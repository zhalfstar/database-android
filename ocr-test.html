<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>拍照识别测试</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#222;line-height:1.6}
h1{font-size:19px;margin:0 0 4px}
.sub{font-size:13px;color:#666;margin-bottom:16px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border:0;border-radius:10px;background:#0a84ff;color:#fff;font-size:16px;font-weight:500;cursor:pointer}
.btn.ghost{background:#eef1f5;color:#333}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
label{font-size:14px;color:#444;display:inline-flex;align-items:center;gap:6px}
input[type=file]{display:none}
#preview{display:block;max-width:100%;max-height:340px;margin:10px auto 0;border-radius:8px;background:#eee}
.meta{font-size:12px;color:#777;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-all;background:#f7f8fa;border:1px solid #e6e8ec;border-radius:8px;padding:10px;font-size:14px;max-height:300px;overflow:auto;margin:8px 0 0}
.tabs{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px;background:#eef1f5;color:#444;font-size:13px;cursor:pointer}
.tab.on{background:#0a84ff;color:#fff}
.pane{display:none}
.pane.on{display:block}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
th,td{border:1px solid #e3e6ea;padding:4px 6px;text-align:left}
th{background:#f2f4f7}
.err{color:#c0392b;font-size:14px;margin-top:8px}
.ok{color:#1a7f37;font-size:14px;margin-top:8px}
input[type=number]{width:70px;padding:6px;border:1px solid #ccc;border-radius:6px}
select{padding:6px;border:1px solid #ccc;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<h1>拍照识别测试</h1>
<div class="sub">只测识别效果，不写入任何数据。拍一张竖排中文照片看看结果。</div>

<div class="card">
  <div class="row">
    <button class="btn" id="btnCam" onclick="document.getElementById('cam').click()">拍照</button>
    <button class="btn ghost" id="btnGal" onclick="document.getElementById('gal').click()">从相册选</button>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <input type="file" id="gal" accept="image/*">
  </div>
  <div class="row">
    <label>识别模式
      <select id="lang">
        <option value="auto">auto（竖排必须选这个）</option>
        <option value="chs">chs（只认横排）</option>
      </select>
    </label>
    <label>引擎
      <select id="engine">
        <option value="2">Engine 2（支持竖排）</option>
        <option value="3">Engine 3</option>
      </select>
    </label>
  </div>
  <div id="status" class="meta">等待拍照…</div>
  <img id="preview" alt="预览">
  <div id="imgMeta" class="meta"></div>
</div>

<div class="card" id="resultCard" style="display:none">
  <h2 style="font-size:16px;margin:0 0 4px">识别结果</h2>
  <div class="meta" id="procInfo"></div>
  <div class="tabs">
    <div class="tab on" data-p="p1">原文</div>
    <div class="tab" data-p="p2">竖排重排</div>
    <div class="tab" data-p="p3">词坐标</div>
    <div class="tab" data-p="p4">原始JSON</div>
  </div>
  <div class="pane on" id="p1"><pre id="rawText"></pre></div>
  <div class="pane" id="p2">
    <div class="row"><label>列间距阈值 <input type="number" id="gap" value="24" min="4" max="200"></label><button class="btn ghost" onclick="renderVertical()">重新排列</button></div>
    <pre id="vText"></pre>
    <div class="meta">按词中心横坐标从右到左分列，每列内从上到下。阈值不对可调。</div>
  </div>
  <div class="pane" id="p3"><div id="wordTable"></div></div>
  <div class="pane" id="p4"><pre id="rawJson"></pre></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="copyText()">复制原文</button></div>
  <div id="msg"></div>
</div>

<script>
var curDataUrl = null;
var curWords = [];

document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    document.getElementById(t.dataset.p).classList.add('on');
  };
});

function readFile(file){
  return new Promise(function(res,rej){
    var r = new FileReader();
    r.onload = function(){res(r.result);};
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function loadImg(src){
  return new Promise(function(res,rej){
    var i = new Image();
    i.onload = function(){res(i);};
    i.onerror = rej;
    i.src = src;
  });
}
function dataUrlBytes(u){
  var i = u.indexOf(',');
  return Math.round((u.length - i - 1) * 3 / 4);
}
function compress(file){
  document.getElementById('status').textContent = '正在压缩图片…';
  return readFile(file).then(loadImg).then(function(img){
    var maxDim = 1600;
    var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width * scale));
    var h = Math.max(1, Math.round(img.height * scale));
    var q = 0.85, out;
    for(var k=0;k<20;k++){
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      out = c.toDataURL('image/jpeg', q);
      if(dataUrlBytes(out) <= 950*1024) break;
      if(q > 0.45) q -= 0.1;
      else { w = Math.round(w*0.8); h = Math.round(h*0.8); }
    }
    curDataUrl = out;
    document.getElementById('preview').src = out;
    document.getElementById('imgMeta').textContent =
      '原图 ' + img.width + '×' + img.height + ' / ' + Math.round(file.size/1024) + 'KB  →  压缩后 ' +
      w + '×' + h + ' / ' + Math.round(dataUrlBytes(out)/1024) + 'KB';
    return out;
  });
}
function handleFile(file){
  if(!file) return;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('msg').innerHTML = '';
  compress(file).then(recognize).catch(function(e){
    document.getElementById('status').textContent = '图片处理失败：' + (e && e.message || e);
  });
}
document.getElementById('cam').onchange = function(e){ handleFile(e.target.files[0]); e.target.value=''; };
document.getElementById('gal').onchange = function(e){ handleFile(e.target.files[0]); e.target.value=''; };

function recognize(){
  if(!curDataUrl) return;
  var lang = document.getElementById('lang').value;
  var engine = document.getElementById('engine').value;
  document.getElementById('status').textContent = '正在识别（' + lang + ' / Engine ' + engine + '）…';
  var fd = new FormData();
  fd.append('base64Image', curDataUrl);
  fd.append('language', lang);
  fd.append('OCREngine', engine);
  fd.append('isOverlayRequired', 'true');
  fd.append('scale', 'true');
  fetch('https://api.ocr.space/parse/image',{
    method:'POST',
    headers:{'apikey':'helloworld'},
    body:fd
  }).then(function(r){return r.json();}).then(function(d){
    document.getElementById('status').textContent = '识别完成';
    showResult(d);
  }).catch(function(e){
    document.getElementById('status').textContent = '请求失败：' + (e && e.message || e);
    document.getElementById('msg').innerHTML = '<div class="err">可能是网络不通、公共 key 限流，或服务暂时不可用。稍后再试。</div>';
  });
}

function showResult(d){
  var card = document.getElementById('resultCard');
  card.style.display = 'block';
  document.getElementById('rawJson').textContent = JSON.stringify(d,null,2);
  var ms = d.ProcessingTimeInMilliseconds || '?';
  document.getElementById('procInfo').textContent =
    '耗时 ' + ms + 'ms / 退出码 ' + d.OCRExitCode + ' / 错误 ' + (d.IsErroredOnProcessing ? '是' : '否');

  if(d.IsErroredOnProcessing || !d.ParsedResults || !d.ParsedResults.length){
    document.getElementById('rawText').textContent = '';
    document.getElementById('msg').innerHTML = '<div class="err">' +
      (d.ErrorMessage ? JSON.stringify(d.ErrorMessage) : '无结果') + '</div>';
    return;
  }
  var pr = d.ParsedResults[0];
  var text = pr.ParsedText || '';
  document.getElementById('rawText').textContent = text;
  var words = [];
  try{
    (pr.TextOverlay.Lines || []).forEach(function(line){
      (line.Words || []).forEach(function(w){
        words.push({
          t: w.WordText,
          left: +w.Left, top: +w.Top, width: +w.Width, height: +w.Height,
          x: +w.Left + (+w.Width)/2,
          y: +w.Top + (+w.Height)/2
        });
      });
    });
  }catch(e){}
  curWords = words;
  renderVertical();
  var tb = '<table><tr><th>文字</th><th>左</th><th>上</th><th>宽</th><th>高</th><th>中心X</th><th>中心Y</th></tr>';
  words.forEach(function(w){
    tb += '<tr><td>' + esc(w.t) + '</td><td>' + w.left + '</td><td>' + w.top + '</td><td>' + w.width +
      '</td><td>' + w.height + '</td><td>' + Math.round(w.x) + '</td><td>' + Math.round(w.y) + '</td></tr>';
  });
  tb += '</table>';
  document.getElementById('wordTable').innerHTML = tb || '<div class="meta">没有词坐标</div>';
  if(!text.trim()){
    document.getElementById('msg').innerHTML = '<div class="err">没识别出文字。试试更清晰的照片，或换 auto 模式。</div>';
  }
}
function renderVertical(){
  var gap = parseInt(document.getElementById('gap').value,10) || 24;
  var words = curWords.slice().sort(function(a,b){return b.x - a.x;});
  var cols = [];
  words.forEach(function(w){
    var col = null;
    for(var i=0;i<cols.length;i++){
      if(Math.abs(cols[i].x - w.x) <= gap){ col = cols[i]; break; }
    }
    if(!col){ col = {x:w.x, items:[]}; cols.push(col); }
    col.items.push(w);
    col.x = col.items.reduce(function(s,it){return s+it.x;},0)/col.items.length;
  });
  cols.sort(function(a,b){return b.x - a.x;});
  var out = cols.map(function(c){
    return c.items.sort(function(a,b){return a.y-b.y;}).map(function(it){return it.t;}).join('');
  }).join('\n');
  document.getElementById('vText').textContent = out || '（没有词坐标，无法重排）';
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function copyText(){
  var t = document.getElementById('rawText').textContent || '';
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){alert('已复制');},function(){alert('复制失败，请长按选择');});
  else alert('请长按文字复制');
}
</script>
</body>
</html>
