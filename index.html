<style>
:root{
  --bg:#F5F6F8; --panel:#FFFFFF; --panel2:#F0F2F6; --line:#E4E8EF; --line2:#D3DAE4; --border:var(--line2); --hl:var(--panel2);
  --text:#202836; --muted:#66717F; --accent:#E8A33D; --accent-hi:#B5761B;
  --topbar-bg:rgba(255,255,255,.92);
  --head-bg:#E7EBF2;   /* 弹窗/面板的标题栏底色：要和主体（--panel 白）明显分开，否则浅色下糊成一片 */
  --accent-soft:rgba(232,163,61,.14); --danger:#E5615B; --danger-hi:#C7453E; --ok:#2E9E63; --ok-hi:#1E8A54;
  --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono","Sarasa Mono SC",monospace;
  --sans:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --radius:10px;
}
/* 深色模式：只换变量，其余样式不动。PDF 预览 / 签名画布那几处**故意保留白底**（要像纸） */
:root[data-theme="dark"]{
  --bg:#12151A; --panel:#1A1E25; --panel2:#232830; --line:#2C323B; --line2:#3A424E;
  --text:#E6E9EE; --muted:#98A2B0;
  --accent:#E8A33D; --accent-hi:#F0B65C;
  --accent-soft:rgba(232,163,61,.18); --danger:#E5615B; --danger-hi:#F0796F; --ok:#3FBE7D; --ok-hi:#4FD08D;
  --topbar-bg:rgba(26,30,37,.92);
  --head-bg:#2A313C;
  color-scheme:dark;
}
:root{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
a{color:inherit}
#app{display:flex;min-height:100vh}
/* 刘海屏/圆角屏安全区（含横屏）的完整规则放在样式表**最后** —— 那里才能盖住
   各媒体查询里给 .overlay / #view 等写的 padding（同优先级靠后胜出）。见文件末尾。 */
.sprite{display:none}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ic.big{width:20px;height:20px;stroke-width:2.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 侧边栏 ===== */
#sidebar{width:262px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .22s ease;overflow-y:auto;overflow-x:hidden}.side-brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#201505;display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
.ver-badge{color:#201505;background:var(--accent);border-radius:5px;padding:0 5px;font-size:10px;margin-left:3px}
.close-side{margin-left:auto}
nav{padding:4px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-hi)}
.side-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}
#table-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 10px}
.tbl-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px}
.tbl-item:hover{background:var(--panel2)}
.tbl-item.active{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.tbl-item .ic{color:var(--muted)}
.tbl-item.active .ic{color:var(--accent-hi)}
.tbl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-count{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.side-empty{color:var(--muted);font-size:12px;padding:10px;text-align:center}
/* flex:0 0 auto —— 底栏（含「数据占用」）绝不允许被压扁。以前是默认可收缩，
   横屏等矮屏下它被挤到视口外、又没处可滚 → 存储区看不见也点不到 ✗。
   配合 #sidebar 的 overflow-y:auto：真装不下时整条侧边栏可以滚到底。 */
.side-bottom{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:0 0 auto}.side-act{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;transition:background .15s}
.side-act:hover{background:var(--panel2)}
.side-act.danger{color:var(--danger-hi);border-color:rgba(229,97,91,.35)}
.side-act.danger:hover{background:rgba(229,97,91,.1)}
.storage{margin-top:8px}
.storage-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.storage-track{height:5px;border-radius:4px;background:var(--panel2);overflow:hidden}
.storage-hint{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.4}
#storage-bar{height:100%;background:var(--accent);border-radius:4px;width:0;transition:width .3s}
#backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.show{opacity:1;pointer-events:auto}

/* ===== 主区域 ===== */
#main{flex:1;margin-left:262px;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--topbar-bg);backdrop-filter:blur(6px);z-index:30}
.topbar .hamburger{display:none}
.topbar-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-search{margin-left:auto;flex:none}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,158,99,.16);margin-left:auto;flex:none}
.live-text{font-size:11px;color:var(--muted);flex:none}
#view{padding:20px 24px 44px;max-width:1180px;width:100%;margin:0 auto}

/* ===== 视图头部 ===== */
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.titles h1{font-size:20px;font-weight:700;letter-spacing:.2px}
.titles .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:12.5px;margin-bottom:6px}
.back:hover{color:var(--accent-hi)}
.view-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-bar{position:sticky;bottom:0;z-index:8;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 2px;background:var(--bg)}
.table-bar .back{margin-bottom:0}
.bar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-basis:100%;margin-left:0;margin-top:4px}
/* ===== 工作表页签（一个工作簿下的平行表，Excel 式） ===== */
.sheet-tabs{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;padding:0 0 0;margin-bottom:10px;border-bottom:1px solid var(--line)}
.sheet-tab{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.sheet-tab:hover{background:var(--panel2);color:var(--text)}
.sheet-tab.active{background:var(--panel2);border-color:var(--line2);color:var(--text);font-weight:600}
.sheet-tab.add{color:var(--accent-hi);border:1px dashed var(--line2);border-bottom:none;border-radius:8px}
.ov-card-sheets{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}
/* 侧边栏底部的外观切换 */
/* 「外观」这一行要和下面四个按钮（.side-act）长得一样：同样的外框、圆角、内边距、悬停底色 */
.side-theme{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12.5px;transition:background .15s}
.side-theme:hover{background:var(--panel2)}
.side-theme > span{flex:none;color:var(--text);width:4em;text-align:justify;text-align-last:justify}
/* 外观选择器用**自绘弹层**，不用原生 <select> ——
   原生下拉的弹出列表由系统/浏览器渲染，深色模式下会是一块灰白底，和应用主题对不上 ✗。
   自绘的用主题变量，明暗都对 ✓ */
.theme-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;border:none;background:transparent;color:var(--text);font-size:12.5px;font-family:inherit;padding:0;margin:0;cursor:pointer;text-align:right}
.theme-btn:focus{outline:none}
.theme-caret{color:var(--muted);font-size:10px;line-height:1}
#theme-menu{position:fixed;z-index:2500;display:none;flex-direction:column;min-width:150px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(15,30,60,.18);padding:4px;animation:menuPop .2s ease}
#theme-menu.show{display:flex}
#theme-menu .theme-opt{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--text);font-size:13px;font-family:inherit;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer}
#theme-menu .theme-opt:hover{background:var(--panel2)}
#theme-menu .theme-opt.on{color:var(--accent-hi);font-weight:600}
#theme-menu .theme-check{width:12px;flex:none;color:var(--accent-hi)}
/* ===== 概览/文件夹：查看方式 + 排序 ===== */
/* 列表视图 */
.ov-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ov-row{display:flex;align-items:center;gap:10px;padding:9px 12px;text-decoration:none;color:var(--text);cursor:grab;font-size:13.5px;-webkit-user-select:none;user-select:none}
.ov-row+.ov-row{border-top:1px solid var(--line)}
.ov-row:hover{background:var(--panel2)}
.ov-row:active{cursor:grabbing}
.ov-row.dragging{opacity:.4}
.ov-row.drop-col{outline:2px dashed var(--accent);outline-offset:-2px}
.ov-row.drop-merge{outline:2px dashed var(--accent-hi);outline-offset:-2px;background:var(--panel2)}
.ov-row-ic{display:inline-flex;flex:none;color:var(--muted)}
.ov-row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ov-row-meta,.ov-row-date{font-size:12px;color:var(--muted);flex:none;white-space:nowrap}
.sheet-tabs-toggle{flex:none;background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--muted);font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;font-family:inherit;margin-bottom:2px}
.sheet-tabs-toggle:hover{color:var(--text);background:var(--panel2)}
/* 收起后只留「箭头 + 当前工作表名」，手机端省地方 */
.sheet-tabs.collapsed .sheet-tab{display:none}
.sheet-tabs.collapsed .sheet-tab.active{display:inline-flex}
.sheet-tabs.collapsed .sheet-tab.add{display:none}
.search-box{position:relative;display:flex;align-items:center}
.search-box .ic{position:absolute;left:8px;width:14px;height:14px;color:var(--muted);pointer-events:none}
/* 高度与文字等高：去掉上下内边距，改用 line-height 撑高。
   height 用 1.5em 而不是固定 px —— 手机端字号会被提到 16px，盒子要跟着变高才不挤。 */
.search-box input{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:0 10px 0 24px;font-size:13px;line-height:1.5;height:1.5em;width:220px;outline:none;transition:border-color .15s}
.search-box input:focus{border-color:var(--accent)}
/* 概览页：全局搜索从顶栏挪到内容区（h1「概览」右边），顶栏那个隐藏 */
/* ===== 存储容量预警 ===== */
.storage-warn{margin-top:7px;font-size:11px;color:var(--danger-hi);display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.storage-warn .btn{padding:3px 8px;font-size:11px;flex:none;white-space:nowrap}
#storage-bar.hot{background:var(--danger)}
/* ===== 全局搜索 ===== */
.top-searches{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.gresults{position:absolute;top:calc(100% + 6px);right:0;width:330px;max-width:calc(100vw - 16px);max-height:62vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.16);z-index:60;padding:6px;display:none;animation:menuPop .2s ease}
.gr-item{display:block;padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer}
.gr-item:hover{background:var(--panel2)}
.gr-tname{display:block;font-size:11px;color:var(--muted)}
.gr-main{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-field{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-empty,.gr-more{padding:10px;font-size:12px;color:var(--muted);text-align:center}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;border:1px solid transparent;text-decoration:none;font-family:inherit;transition:background .15s,border-color .15s,color .15s}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.primary{background:var(--accent);color:#201505;font-weight:600}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-hi)}
.btn.danger{background:rgba(229,97,91,.12);border-color:rgba(229,97,91,.4);color:var(--danger-hi)}
.btn.danger:hover{background:rgba(229,97,91,.22)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn.danger:hover{background:rgba(229,97,91,.15);color:var(--danger-hi)}

/* ===== 概览 ===== */

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel-head h2{font-size:14px;font-weight:600}
.muted{color:var(--muted);font-size:12px}
.tbl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ov-cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tbl-card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.tbl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ov-card{cursor:grab;justify-content:center;align-items:center;text-align:center;font-weight:600;font-size:14px;padding:20px 14px;gap:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ov-card:active{cursor:grabbing}
.ov-card.dragging{opacity:.4}
.ov-card.drop-col{outline:2px dashed var(--accent);outline-offset:-2px}
/* 拖到卡片中央 = 松手合并成一个数据表（两个平行工作表） */
.ov-card.drop-merge{outline:2px dashed var(--accent-hi);outline-offset:-2px;background:var(--panel2)}
.ov-card.drop-merge::after{content:'松手合并为一个数据表';display:block;font-size:11px;color:var(--accent-hi);font-weight:400;margin-top:4px}
/* ===== 概览多选（批量移入文件夹 / 批量删除）=====
   为什么要它：概览的拖动是 HTML5 拖放（draggable + ondragstart/ondrop），
   这套在**触屏上根本不触发** —— 安卓/iPad 上长按卡片拖不进文件夹（真机 2026-10-20）。
   多选不依赖拖放，所以手机上也能把表放进文件夹 ✓ */
.ov-card.ov-sel{position:relative;padding-left:36px;cursor:pointer}
.ov-card .ov-cb{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  border:1.5px solid var(--line2);border-radius:5px;background:var(--panel);display:flex;align-items:center;
  justify-content:center;font-size:11px;line-height:1;color:transparent;font-weight:700}
.ov-card.ov-sel.on{border-color:var(--accent);background:var(--accent-soft)}
.ov-card.ov-sel.on .ov-cb{background:var(--accent);border-color:var(--accent);color:#fff}
.ov-selbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(15,23,42,.10)}
.ov-selbar .n{font-size:13px;font-weight:600;margin-right:auto;white-space:nowrap}
.ov-selbar button:disabled{opacity:.45;pointer-events:none}
@media (max-width:520px){ .ov-selbar{gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px))}
  .ov-selbar .btn{padding:8px 10px;font-size:12.5px} }
/* 工作表页签拖动排序 / 拖出拆分 */
.sheet-tab.dragging{opacity:.45}
.sheet-tab.drop-before{box-shadow:inset 2px 0 0 var(--accent-hi)}
.sheet-tab.drop-after{box-shadow:inset -2px 0 0 var(--accent-hi)}
.sheet-tabs.detach-hint{border-bottom:1px dashed var(--accent-hi)}
.sheet-tabs.detach-hint::after{content:'松开 → 移出为独立数据表';font-size:11px;color:var(--accent-hi);margin-left:8px;white-space:nowrap}
.ov-folder{margin-bottom:16px}
.ov-folder:last-child{margin-bottom:0}
.ov-folder-head{display:flex;align-items:center;gap:8px;padding:4px 2px 10px;font-weight:600;font-size:13.5px;color:var(--text);cursor:grab;user-select:none;-webkit-touch-callout:none}
.ov-folder-head .ic{width:16px;height:16px;color:var(--accent);flex:none}
.folder-arrow{display:inline-flex;flex:none;transition:transform .18s}
.folder-arrow .ic{width:14px;height:14px;color:var(--muted)}
.ov-folder.collapsed .folder-arrow{transform:rotate(-90deg)}
.ov-folder.collapsed .ov-cards,.ov-folder.collapsed .ov-list{display:none}
.ov-folder-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-folder-count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400;flex:none}
.ov-folder-head.dragging{opacity:.4}
.ov-folder-head.drop-col{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:8px}
.ov-folder.ungrouped .ov-folder-head{cursor:default;color:var(--muted)}
.ov-folder.ungrouped .ov-folder-head .ic{color:var(--muted)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:11.5px;font-weight:600}
.badge.ok{background:rgba(91,185,138,.15);color:var(--ok-hi)}
.badge.no{background:rgba(229,97,91,.13);color:var(--danger-hi)}
.empty-panel{display:flex;justify-content:center}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty .ic{width:44px;height:44px;color:var(--line2);stroke-width:1.4}
.empty h2{color:var(--text);font-size:16px}
.empty p{font-size:13px;max-width:340px}

/* ===== 数据网格 ===== */
.grid-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row-count{font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.trash-wrap{display:flex;flex-direction:column;gap:12px;padding:14px}
.trash-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trash-title{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.trash-title svg{width:16px;height:16px;color:var(--danger)}
.trash-total{color:var(--muted);font-size:12.5px;flex:1}
.trash-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.trash-card-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.trash-tname{font-weight:600;font-size:13.5px}
.trash-time{color:var(--muted);font-size:12px}
.trash-ops{margin-left:auto;display:flex;gap:8px}
.trash-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trash-row:last-child{border-bottom:none}
.trash-no{font-family:var(--mono);color:var(--muted);font-size:12px;min-width:34px}
.trash-vals{display:flex;gap:8px 16px;flex-wrap:wrap;flex:1}
.trash-val{font-size:12.5px;color:var(--text)}
.trash-val em{font-style:normal;color:var(--muted);margin-right:4px}
.trash-empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--radius)}
.danger-text{color:var(--danger)!important}
.result-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.result-bar b{font-family:var(--mono);color:var(--text)}
.link-btn{background:none;border:none;color:var(--accent-hi);cursor:pointer;font-size:12px;padding:0;text-decoration:underline;font-family:inherit}
.table-scroll{overflow:auto;max-height:calc(100vh - 260px);min-height:120px;position:relative}
@media (pointer:coarse){
  .table-scroll{overflow:hidden;max-height:none;-webkit-overflow-scrolling:touch;touch-action:none}
  table.grid thead th{touch-action:none}
  input,select,textarea{font-size:16px}
}
body.table-page-body{overflow:hidden}
#view.table-page{display:flex;flex-direction:column;height:calc(100vh - 52px);height:calc(100dvh - 52px);max-width:none;padding:0 12px 6px}
#view.table-page .grid-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:0 0 var(--radius) var(--radius)}
#view.table-page .table-scroll{flex:1;min-height:0;max-height:none}
#view.table-page .table-bar{position:static;margin-top:0;padding:8px 2px;flex-wrap:nowrap}
#view.table-page .bar-actions{flex-basis:auto;margin-top:0;margin-left:auto;flex-wrap:nowrap}
.rc-short{display:none}
.t-short{display:none}
@media (max-width:420px){
  .rc-full{display:none}.rc-short{display:inline}
  .t-full{display:none}.t-short{display:inline}
  #view.table-page .table-bar .btn{padding:7px 10px;font-size:12.5px}
  #view.table-page .row-count{font-size:11.5px}
  #view.table-page .back{font-size:12px}
}
.bar-menu-wrap{position:relative}
.bar-menu{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(15,23,42,.12);padding:6px;display:flex;flex-direction:column;min-width:178px;z-index:40;animation:menuPop .2s ease}
.bar-menu button,.bar-menu a{display:flex;align-items:center;gap:8px;background:none;border:none;padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;border-radius:8px;text-align:left;font-family:inherit;white-space:nowrap;text-decoration:none}
.bar-menu button:hover,.bar-menu a:hover{background:var(--panel2)}
table.grid{width:100%;border-collapse:collapse;table-layout:auto}
table.grid.fixed{table-layout:fixed;width:auto}
table.grid.fixed td{overflow:hidden;text-overflow:ellipsis}
table.grid th,table.grid td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:13px;vertical-align:middle;text-align:left;white-space:nowrap;height:var(--rowH,auto)}
table.grid td{position:relative}
table.grid .g-num{position:absolute;top:0;right:0;font-size:9px;line-height:1;min-width:11px;text-align:center;padding:1px 2px;background:#3a3f47;color:#fff;border-radius:0 0 0 3px;pointer-events:auto;cursor:pointer}
#group-panel{position:fixed;z-index:999;min-width:150px;max-width:260px;max-height:none;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:10px 12px;font-size:13px;color:var(--text);animation:menuPop .2s ease}
#group-panel .gp-title{font-weight:600;margin-bottom:8px;color:var(--text)}
#group-panel .gp-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0}
#group-panel .gp-name{flex:1;cursor:pointer;padding:5px 6px;border-radius:6px;color:var(--text)}
#group-panel .gp-name:hover{background:var(--panel2)}
#group-panel .gp-del{border:none;background:#fee4e4;color:#e5484d;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
#group-panel .gp-btns{display:flex;gap:8px;margin-top:8px}
#group-panel .gp-close{flex:1;padding:6px 0;border:none;border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer}
#group-panel .gp-dissolve{flex:1;padding:6px 0;border:1px solid #f2b8bb;border-radius:6px;background:var(--panel);color:#e5484d;cursor:pointer}
#group-panel .gp-addlink{flex:1;padding:6px 0;border:1px solid #cfe0ff;border-radius:6px;background:var(--panel);color:#4285F4;cursor:pointer}
.vline-layer{position:absolute;top:0;left:0;pointer-events:none;z-index:5}
.vline{position:absolute;top:0;bottom:0;width:14px;transform:translateX(-50%);cursor:col-resize;touch-action:none;pointer-events:auto;z-index:4}
.vline::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;margin-left:-0.5px;background:transparent;pointer-events:none}
.vline:hover::before,.vline.active::before,.vline:active::before{width:3px;margin-left:-1.5px;background:#4285F4;box-shadow:0 0 4px rgba(66,133,244,.55)}
.resize-col .vline::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--accent);opacity:.55}
.row-resizer{position:absolute;left:0;right:0;bottom:-7px;height:14px;cursor:row-resize;touch-action:none;display:none;z-index:3}
.row-resizer::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-0.5px;background:transparent;pointer-events:none}
.row-resizer:hover::before,.row-resizer.active::before,.row-resizer:active::before{height:3px;margin-top:-1.5px;background:#4285F4;box-shadow:0 0 4px rgba(66,133,244,.55)}
.resize-row .row-resizer{display:block}
.rowH-on table.grid th,.rowH-on table.grid td{height:var(--rowH);padding:2px 12px;line-height:1.25;overflow:hidden}
body.resizing *{transition:none!important}
body.resizing{overflow:hidden}
.resize-col,.resize-row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.has-row-res{position:relative}
.row-resizer::after{content:'';position:absolute;left:12%;right:12%;bottom:5px;height:3px;background:var(--accent);opacity:.55}
/* ===== 单元格就地编辑（只在电脑版生效；手机/平板不会进入这个状态）===== */
table.grid td.cell-editing{padding:2px 4px;overflow:visible}
.cell-edit-wrap{display:flex;align-items:center;min-width:76px;width:100%}
.cell-edit-in{width:100%;min-width:76px;box-sizing:border-box;font-family:inherit;font-size:13px;line-height:1.3;
  color:var(--text);background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:5px 7px;outline:none}
.cell-edit-in:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
select.cell-edit-in{padding:4px 6px}
.cell-edit-wrap .msel{width:100%}
.cell-edit-wrap .msel-btn{padding:5px 8px;font-size:13px}
/* 电脑端给可编辑单元格一点"这里能改"的提示（鼠标才有 hover，触屏不受影响） */
@media (hover:hover) and (pointer:fine){
  table.grid tbody td[data-fid]{cursor:text}
  table.grid tbody td[data-fid]:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}
}
table.grid thead th{position:sticky;top:0;background:var(--panel2);z-index:2;color:var(--muted);font-weight:600;user-select:none;touch-action:pan-y}
.th-main.dragging{opacity:.4}
.th-main.drop-col{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:6px}
table.grid th:last-child,table.grid td:last-child{text-align:right;border-right:none}
th.no-cell,td.no-cell{text-align:right;font-family:var(--mono);color:var(--muted)}
table.grid td.no-cell{font-size:12px}
table.grid tbody tr{transition:background .12s}
table.grid tr.link-picked td{background:rgba(66,133,244,.16)}
table.grid tr.link-rel td{background:rgba(66,133,244,.14);border-top:1px solid #4285F4;border-bottom:1px solid #4285F4}
table.grid tr.link-rel td.no-cell{box-shadow:inset 4px 0 0 #4285F4}
table.grid tr.hit td{background:rgba(232,163,61,.10)}
#link-mode-bar{position:fixed;top:8px;left:8px;width:min(92vw,420px);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(15,23,42,.15);padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;overflow:auto;touch-action:none;cursor:grab;animation:menuPop .2s ease}
#link-mode-bar:active{cursor:grabbing}
.gp-name.gp-x{color:#1f6feb;background:rgba(31,111,235,.08);border-radius:6px;padding:1px 6px;font-weight:600}
tr.flash-row{animation:rowFlash 1.9s ease}
@keyframes rowFlash{0%,55%{background:rgba(66,133,244,.30)}100%{background:transparent}}
/* 全局搜索跳转过来的那一行：常驻"选中"高亮（下次跳转或表格重渲染后自然消失）。
   左侧竖条用 box-shadow inset，这样即使该行被用户设过自定义底色也仍能看出选中态。 */
tr.hit-row>td{background:rgba(66,133,244,.14)}
tr.hit-row>td:first-child{box-shadow:inset 3px 0 0 #4285F4}
.gp-name{cursor:pointer}
#link-mode-bar .lm-top{cursor:move;touch-action:none;display:flex;align-items:center;gap:8px}
#link-mode-bar .lm-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:2}
#link-mode-bar .lm-resize::before{content:'';position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.6;border-radius:1px}
#link-mode-bar .lm-resize:active::before{border-color:#4285F4}
#link-mode-bar #link-exit{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;flex:none}
#link-mode-bar .lm-name-btn{background:none;border:none;color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:4px 2px}
#link-mode-bar .lm-name-btn:active{opacity:.6}
#link-mode-bar .hint{color:var(--muted);font-size:12px;flex:none;white-space:nowrap}
#link-mode-bar .lm-table{max-width:110px;font-size:12px;padding:4px 6px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--text);flex:none}
.lm-results{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow:auto;margin-top:6px}
.lm-hit{padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.lm-hit.on{background:var(--accent);color:#fff}
.lm-hit.muted{color:var(--muted);cursor:default}
.lm-hit.lm-empty{color:#7a5b00;background:#fff7db;border:1px solid #f2e3a8;font-size:12.5px}
.lm-hit.lm-empty .ic{width:13px;height:13px;flex:none}
.lm-tip{font-size:11px;color:var(--muted);padding:2px 2px 0}
.lm-src{color:var(--muted);background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:0 5px;font-size:11px;flex:none}
.g-num.xg{background:#e8f3ff;color:#1f6feb}
.lm-row2{display:flex;gap:8px;align-items:center}
#link-mode-bar #link-search{flex:1;box-sizing:border-box;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--input,#fff);color:var(--text);min-width:0}
#link-mode-bar #link-search:focus{outline:none;border-color:#4285F4}
#link-mode-bar #link-clear{background:none;border:1px solid var(--line);color:#D93025;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;flex:none;white-space:nowrap}
#link-panel{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,.16);padding:8px;min-width:230px;max-width:min(340px, calc(100vw - 24px));animation:menuPop .2s ease}
#link-panel .lp-title{font-size:12px;color:var(--muted);padding:4px 10px 6px;font-weight:600}
#link-panel .lp-group{border-top:1px solid var(--line);padding:8px 10px}
#link-panel .lp-fname{font-size:13px;font-weight:600;color:var(--text)}
#link-panel .lp-members{font-size:12.5px;color:var(--muted);margin:4px 0 8px;line-height:1.55;word-break:break-all}
#link-panel button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:10px;font-size:13.5px;border-radius:8px;text-align:left;font-family:inherit;cursor:pointer;min-height:42px}
#link-panel button svg.ic{flex:none;width:15px;height:15px}
.drag-sort{opacity:.5;box-shadow:0 6px 16px rgba(15,23,42,.16)}
.smart-box{position:relative;border:1px solid var(--line2);border-radius:10px;padding:8px;background:var(--panel2)}
.submenu-wrap{position:relative}
.submenu-wrap.open > .submenu-trigger{background:var(--panel2)}
.submenu-trigger{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.submenu-trigger .sub-caret{margin-left:auto;transition:transform .18s ease;flex:none;opacity:.7}
.submenu-wrap.open > .submenu-trigger .sub-caret{transform:rotate(90deg)}
/* 子菜单：**留在 .submenu-wrap 里**（关键 —— 挂到 <body> 后就不在 .bar-menu-wrap 内，
   全局 click 监听会立刻 closeMenu → 把 body>.submenu 从 DOM 拔掉 →
   真手指点下去时元素已脱离文档，事件丢失 → 表现"点导出没反应" ✗）。
   为了不被主菜单开场动画的 transform 影响定位，用 position:fixed + offsetBox() 量位置。 */
.submenu{position:fixed;z-index:1200;box-sizing:border-box;width:max-content;min-width:160px;
  max-width:calc(100vw - 16px);
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:4px;
  overscroll-behavior:contain;
  animation:subPop .18s cubic-bezier(.34,1.4,.64,1)}
@keyframes subPop{from{opacity:0;transform:translateX(-6px) scale(.96)}to{opacity:1;transform:none}}
.submenu button{display:flex;align-items:center;gap:6px;width:100%;padding:9px 10px;border:none;background:none;text-align:left;font-size:13px;cursor:pointer;border-radius:6px;color:var(--text)}
.submenu button:hover,.submenu button:active{background:var(--panel2)}
.submenu .sub-grip{display:flex;align-items:center;gap:6px;padding:2px 8px 4px;margin:-2px -4px 3px;
  border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);cursor:move;touch-action:none}
.submenu .sub-grip .grip-dots{letter-spacing:1px;font-size:13px;line-height:1}
.smart-input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:52px;background:var(--panel);color:var(--text)}
/* 「清空」后旧文字还留在 textarea 里（写值会打断 iOS 听写），用这层把它盖住：
   只显示"清空之后新说的内容"，看起来就是已清空、正在重新填。textarea 一个字都不动。 */
.smart-mirror{position:absolute;z-index:2;pointer-events:none;overflow:hidden;box-sizing:border-box;

/* 注意：这里的背景是**浅色药丸**，必须同时写死文字色 —— 否则深色模式下继承主题的浅色文字
   会落在浅底上看不清（铅笔「字段设置」菜单就踩过这个坑）✗。所以下面 span/sec 都显式给 color。 */
#field-menu .fm-row span{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:8px;font-size:12px;text-align:justify;text-align-last:justify;white-space:nowrap;width:90px;box-sizing:border-box}
/* 复选框行（必填 / 允许多选 / 禁止重复值 / 隐藏字段 / 默认当前时间）：
   **标题在左、复选框在右**；标题药丸**宽度与其他行完全一致**（沿用基类的 90px + 两端对齐），
   只把复选框用 margin-right:auto 推到最右边 —— 用户要求"每个胶囊长度一样、字体分散对齐"。
   注意标签文案要控制在 6 个汉字以内（"默认填当前时间"7 字会撑出 90px 边界，已改成"默认当前时间"）。 */
#field-menu .fm-row.fm-chk{gap:10px}

/* 格式面板的拖动把手 —— 面板里几乎全是下拉框/按钮，以前能拖的只有一行小标题，

@media (max-width:768px){ .fm-drag{padding:10px 8px;min-height:40px;margin-bottom:8px} }
/* 手机上把格式面板的控件放大 —— 原来「左/中/右」只有 32×26（安卓建议触摸目标 ≥44），
   手指稍一偏就落进按钮之间的空隙，什么都不会发生，用户感知就是"点了没反应" ✗ */

}

   .modal-body.no-scroll 由 JS 在「表单内容装得下、不需要滚动」时打上：
   此时把整个字段区也变成拖动把手（否则一滚就滚不动了）。 */
.modal-foot{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);touch-action:none}
.drag-filler{flex:1 1 0;min-height:0;cursor:move;touch-action:none}
.modal-body.no-scroll .rec-fields{touch-action:none}
.modal.narrow .modal-foot{flex-wrap:wrap}
.modal.narrow .smart-actions{flex-wrap:wrap}
.modal.narrow .modal-head{flex-wrap:wrap}
@media (max-width:520px){
  .modal-foot{flex-wrap:wrap}
  .smart-actions{flex-wrap:wrap}
}
.modal.small{max-width:400px}
.modal-body > *{min-width:0}
/* 标题栏：一律给一层**浅灰底**（--panel2），和弹窗主体（--panel 白）分开 ✗
   以前没有任何底色 → 浅色模式下标题区和表单区都是白的，整块糊在一起，
   看起来"标题栏和背景混淆"（真机 2026-10-21）。深色模式下 --panel2 也比 --panel 亮一档，同样有层次 ✓ */
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;background:var(--head-bg);border-bottom:1px solid var(--line);border-radius:13px 13px 0 0;touch-action:none;cursor:move}
.modal-head h2{font-size:15px;font-weight:700}
.rec-head-opts{display:flex;align-items:center;gap:12px;flex-shrink:0}
/* 底栏左侧的开关（和表头同款 .rec-opt 样式） */
.rec-foot-opt{margin-right:auto}
@media (max-width:400px){ .rec-foot-opt{font-size:11px} .rec-foot-opt .sw{width:26px;height:15px} .rec-foot-opt .sw::after{width:11px;height:11px} .rec-foot-opt input:checked + .sw::after{left:13px} }
.rec-opt{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
.rec-opt input{position:absolute;opacity:0;width:0;height:0}
.rec-opt .sw{position:relative;width:30px;height:17px;background:#d7dde8;border-radius:9px;transition:background .15s;flex-shrink:0;display:inline-block}
.rec-opt .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.rec-opt input:checked + .sw{background:#2f6bff}
.rec-opt input:checked + .sw::after{left:15px}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;overflow-y:auto}
.modal-foot .eq{min-width:88px;justify-content:center}
.imp-opts{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto}
.imp-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.imp-row:hover{border-color:var(--accent)}
.imp-row input{accent-color:var(--accent);flex:none}
.imp-name{font-size:13.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
/* 导入弹窗里每个表下面那行小字：这个文件的字段带不带属性 */
.imp-name .imp-attrs{display:block;font-style:normal;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px;white-space:normal}
.imp-tools{display:flex;gap:14px;justify-content:flex-end}
.imp-tools a{font-size:12px;color:var(--accent-hi);cursor:pointer;text-decoration:none}
.modal-sub{padding:0 18px 14px;display:flex;justify-content:flex-end}
.danger-link{font-size:12px;color:var(--danger-hi);cursor:pointer;text-decoration:none}
.danger-link:hover{text-decoration:underline}
.flex1{flex:1}
.field-item{display:flex;flex-direction:column;gap:6px}
.f-label{font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:8px}
.f-label em{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--mono);border:1px solid var(--line);padding:0 6px;border-radius:4px}
.in{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13.5px;outline:none;width:100%;font-family:inherit;transition:border-color .15s}
.field-hint{display:none;margin:6px 2px 0;font-size:12px;color:var(--danger-hi)}
.field-hint.show{display:block}
.in.err{border-color:var(--danger)!important;background:rgba(229,97,91,.06)!important}
input.in.err:focus{box-shadow:0 0 0 3px rgba(229,97,91,.12)!important}
.in:focus{border-color:var(--accent)}
.et-fields{display:flex;flex-direction:column;gap:8px}
.field-row .f-name{flex:1}
.fr-drag-handle{cursor:grab;user-select:none;display:inline-flex;align-items:center;padding:4px;color:var(--muted)}
.fr-drag-handle:active{cursor:grabbing}
.opt-editor{display:none;flex:1 1 100%;flex-direction:column;gap:8px;background:var(--bg);border:1px dashed var(--line2);border-radius:8px;padding:10px;margin-top:2px;animation:menuPop .2s ease}
.opt-editor.show{display:flex}
.opt-add{display:flex;gap:8px;align-items:center}
.opt-add .opt-input{flex:1}
.opt-list{display:flex;flex-wrap:wrap;gap:3px;max-height:58px;overflow:hidden}
.opt-star{background:none;border:none;padding:0;margin:0;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:none}
.opt-star.on{color:#f5a623}
.opt-star svg{width:12px;height:12px}
.opt-list.expanded{max-height:640px;overflow:auto}
#dialog-opt-list{max-height:300px;min-height:100px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.opt-more{align-self:flex-start;font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;line-height:1.4}
.opt-chip{display:inline-flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:2px 5px;font-size:12px;color:var(--text);cursor:grab}
.opt-chip.dragging{opacity:.45}
.opt-chip.drop-target{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt-del{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:50%;padding:0;flex:none}
.opt-del:hover{color:var(--danger-hi);background:rgba(229,97,91,.15)}
.opt-del .ic{width:12px;height:12px}
.opt-hint{font-size:11px;color:var(--muted)}
.opt-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.opt-clear-all{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer}
.opt-clear-all:hover:not(:disabled){color:var(--danger-hi);border-color:rgba(229,97,91,.4)}
.opt-clear-all:disabled{opacity:.45;cursor:default}
.opt-clear-all .ic{width:11px;height:11px}
.msel{position:relative}
.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s;box-sizing:border-box}
.msel-btn:hover{border-color:var(--accent)}
.msel-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-btn .ic{flex:none;color:var(--muted)}
.msel-pop{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 34px rgba(15,23,42,.16);padding:6px;z-index:70;max-height:220px;overflow-y:auto;animation:menuPop .2s ease}
.msel-pop.show{display:block}
.msel-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.msel-opt:hover{background:var(--panel)}
.msel-clear{width:100%;margin-top:4px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
.msel-clear:hover{color:var(--danger-hi);border-color:rgba(229,97,91,.4)}
/* 自绘下拉（替代原生 <select>）：原生下拉的**弹出列表由系统渲染**（iOS 是系统滚轮、Windows 是系统菜单），
   只跟随系统明暗、跟不了应用主题 —— 应用切浅色而系统是深色时，弹出来就是深色的 ✗。
   .msel-single 就是「把原生 select 换成按钮 + 主题化弹层」用的（见 skinSelect()）。 */
.msel-single{flex:1;min-width:0}
.msel-single .msel-btn{padding:5px 8px;font-size:12.5px;background:var(--panel);border-color:var(--line)}
/* 选项层：至少和按钮一样宽，再按内容撑开（向右展开会顶出菜单，所以改成右对齐往左长）；
   white-space:nowrap 防止"¥ 人民币"这种被折成两行 ✗ */
.msel-single .msel-pop{left:auto;right:0;min-width:100%;width:max-content;max-width:min(240px,86vw);
  /* 「冒泡」出现动画：原点放在**右上角**（正对着上面那个按钮），
     从 0.55 倍"长出来"再弹回 1 倍 —— 这就是用户说的"冒泡出来的感觉"。
     cubic-bezier 带一点**回弹过冲**，比原来的 14px 上浮明显得多 ✓ */
  transform-origin:top right;
  animation:bubblePop .24s cubic-bezier(.34,1.56,.64,1)}
@keyframes bubblePop{from{opacity:0;transform:scale(.55) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.msel-single .msel-opt{white-space:nowrap}
button.msel-opt{width:100%;border:none;background:none;color:var(--text);font-family:inherit;text-align:left}
button.msel-opt:hover{background:var(--panel)}
.msel-tick{margin-left:auto;color:var(--accent-hi);font-weight:700}
select.in{background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit}
.switch-line{display:flex;align-items:center;gap:8px;font-size:13px}
.rec-no{font-size:12px;color:var(--muted);font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;align-self:flex-start}
.last-rec{display:block;width:100%;margin:0 0 10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--hl);cursor:pointer;text-align:left;font:inherit;color:inherit;line-height:1.4}
.last-rec:active{background:#eef4ff}
.last-rec-body{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;line-height:1.6}
.last-rec-body b{font-weight:600}
.last-rec-body .last-rec-val{color:var(--danger-hi);font-style:normal;font-weight:600}
.last-rec-pop{position:fixed;z-index:2000;width:min(330px,88vw);max-height:46vh;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 32px rgba(15,23,42,.22);font-size:13px;user-select:none;-webkit-user-select:none;animation:menuPop .2s ease}
/* 右下角的缩放把手 —— 用户要求「上次记录弹窗大小可以调整」。
   注意：滚动条必须在内层 .last-rec-body 上，不能留在 .last-rec-pop 上 ——
   否则 absolute 定位的把手会跟着内容一起滚走 ✗ */
.last-rec-grip{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;z-index:3;opacity:.5;
  background:linear-gradient(135deg, transparent 0 48%, var(--muted) 48% 100%);
  border-bottom-right-radius:11px}
.last-rec-grip:hover,.last-rec-grip:active{opacity:1}
.last-rec-pop-title{position:sticky;top:0;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--hl);border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--muted);cursor:move;touch-action:none;user-select:none;z-index:1}
.last-rec-pop-title b{color:var(--text)}
.last-rec-pop-close{border:0;background:none;padding:9px 11px;margin:-7px -9px -7px 0;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;flex-shrink:0;border-radius:8px}
.last-rec-pop-close:active{background:var(--panel2);color:var(--text)}
.last-rec-pop .last-rec-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 12px;line-height:1.6;cursor:pointer}
.last-rec-pop .last-rec-body b{font-weight:600;color:var(--text)}
.confirm-body{font-size:13.5px;padding:10px 2px;line-height:1.7}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
/* 浮层出现动画（统一一套）。弹窗(.modal/.toast)一直有 pop；
   字段设置/列操作/页签菜单、概览长按菜单、更多菜单、子菜单、类型选择、上次记录、
   关联面板、分组面板、搜索结果… 这些浮层以前是"啪"地直接出现，现在都用同一套动画 ✓ */
@keyframes menuPop{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}

/* ===== Toast ===== */
#toast-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:14px 24px;border-radius:10px;font-size:14px;box-shadow:0 12px 36px rgba(15,23,42,.2);animation:pop .22s ease;max-width:80vw;text-align:center}
.toast.out{opacity:0;transition:opacity .25s}

/* ===== 响应式 ===== */
/* 注意：这里同时用宽度**和高度**判定。手机横屏时宽度很大（844~932px）但高度只有 360~430px，
   只按宽度判断会落到桌面布局（固定侧边栏 + 262px 缩进），矮屏下侧边栏底部直接被切掉 ✗。 */
@media (max-width:920px), (max-height:520px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:none;box-shadow:0 0 60px rgba(15,23,42,.22)}
  #main{margin-left:0}
  .topbar .hamburger{display:inline-flex}
  .search-box input{width:150px}
  /* 顶栏标题别被搜索框挤成 0 宽（否则表名会整段消失） */
  .topbar-title{flex:0 1 auto;min-width:60px}
}
@media (max-width:560px){
  #view{padding:6px 12px 150px}
  .tbl-cards{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  .ov-card{padding:9px 6px;font-size:12.5px;gap:2px}
  .ov-card .ov-card-sheets{font-size:10px;margin-top:1px}
  .view-actions .search-box{width:100%}
  .view-actions .search-box input{width:100%}
  .topbar{padding:0 12px;gap:8px}
  /* 顶栏排成「☰ + 标题 + 搜索框」：标题靠在左边图标（汉堡）旁边，
     搜索框在右侧占剩余宽度。注意 .topbar-title 必须 flex:0 0 auto，
     避免被搜索框挤成 0 宽导致标题"消失"。 */
  .topbar-title{order:1;flex:0 0 auto;max-width:46%}
  .top-searches{order:2;margin-left:auto;flex:1 1 auto;min-width:0}
  .live-dot{order:3}
  .live-text{display:none}                 /* 窄屏省地方，只留状态圆点 */
  .top-search{flex:1;min-width:0}
  .top-search input{width:100%}
  .search-box input{width:100%;min-width:0;font-size:16px}
  /* 手机上放不下两个搜索框：概览显示全局搜索，表格页显示本表搜索 */
  body.table-page-body #global-search{display:none}
  /* 数据表页反过来：表名在左、搜索框在右（概览仍保持"搜索框在标题左边"）。
     表名 flex:1 吃掉剩余空间（所以文字靠左），搜索框固定宽度钉在右边，不会被挤变形。 */
  body.table-page-body .topbar-title{order:1;flex:1 1 auto;max-width:none;min-width:0}
  body.table-page-body .top-searches{order:2;flex:0 0 auto;margin-left:0}
  body.table-page-body .top-search{flex:0 0 auto}
  body.table-page-body .top-search input{width:112px}
  /* 列表视图：窄屏日期列保持显示，字号略小避免拥挤 */
  .ov-row-meta,.ov-row-date{font-size:11px}
  /* 输入类控件统一 16px：小于 16px 时 iOS 聚焦会自动放大页面 */
  .in, select.in, .msel-btn{font-size:16px}
}
/* ===== 横屏 / 矮屏专用 =====
   手机横屏的特点是「很宽但很矮」（844×390、932×430 之类），上面那些按宽度写的规则全都命中不到。
   这里统一按**高度**收口：竖向能省就省，保证侧边栏底部的「数据占用」和各类弹窗都完整可见可点。 */
@media (max-height:520px){
  .side-brand{padding:9px 14px 7px}
  /* 矮屏下**必须**让列表让位：设 min-height:56px 时，列表+底栏加起来会超出侧边栏高度，
     侧边栏虽然能滚，但底栏（含「数据占用」进度条）会被顶到视口外、默认看不见 ✗。
     改成 0 让列表把空间让给底栏，底栏永远完整可见 ✓（列表自己仍可滚）。 */
  #table-list{min-height:0}
  /* 底栏排成两列：4 个按钮走 2×2，比竖排省约 80px —— 这样「数据占用」一栏在横屏也露得出来 */
  .side-bottom{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px}
  .side-theme{grid-column:1 / -1}
  .storage{grid-column:1 / -1;margin-top:2px}
  .side-act{padding:7px 9px;font-size:12px}
  /* 「外观」这一行要和上面的按钮**同内边距**，否则横屏下图标/文字会错开 1px，对不齐 */
  .side-theme{padding:7px 9px;font-size:12px}
  .storage-hint{font-size:10px}
  #view{padding:12px calc(16px + var(--sai-l,0px)) calc(20px + var(--sai-b,0px)) calc(16px + var(--sai-r,0px))}
  .overlay{padding:2vh 12px 12px}
  /* 弹窗按视口高度收口：makeFloat 恢复"上次拖出来的尺寸"时不看视口高，
     横屏下会直接超出屏幕、底栏按钮点不到 ✗ */
  .modal{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  /* 「更多」菜单有 9 项，矮屏下从底栏往上弹会顶出屏幕顶部，让它自己滚 */
  .bar-menu{max-height:calc(100vh - 64px);overflow-y:auto}
}
/* ===== 刘海屏 / 圆角屏安全区 =====
   横屏时刘海在左或右两侧、底部还有小白条（home indicator），内容必须躲开。
   **不能只给 #app 加内边距** —— #sidebar 和弹窗浮层都是 position:fixed（相对视口定位），
   不跟 #app 的 padding 走：抽屉内容会压在刘海下面、贴底的底栏会钻进小白条里 ✗。
   所以每个贴边的固定元素各自补安全区。取值统一放进 CSS 变量，JS 读同一份（见 safeInsets()）。
   必须放在样式表最后：这里要盖掉各媒体查询给 .overlay / #view 写的 padding。 */
@supports (padding: env(safe-area-inset-left)){
  :root{
    --sai-t:env(safe-area-inset-top); --sai-r:env(safe-area-inset-right);
    --sai-b:env(safe-area-inset-bottom); --sai-l:env(safe-area-inset-left);
  }
  #app{padding-left:var(--sai-l);padding-right:var(--sai-r)}
  /* 宽度把安全区算进去 —— 否则横屏时侧边栏的内容宽度被刘海吃掉 94px，
     底栏那 4 个按钮会窄到换行（"分享/软件"）✗ */
  #sidebar{
    width:calc(262px + var(--sai-l) + var(--sai-r));
    padding-left:var(--sai-l);padding-right:var(--sai-r);
    /* 底部安全区加在 #sidebar 上（**不要**改 .side-bottom 的 padding-bottom ✗ ——
       那条会连横屏媒体查询里写的 padding:8px 一起盖掉，底栏内容被抬高一大截）。 */
    padding-bottom:var(--sai-b);
  }
  .overlay{
    padding-left:calc(16px + var(--sai-l));padding-right:calc(16px + var(--sai-r));
    padding-bottom:calc(12px + var(--sai-b));
  }

     注意不要在这里加 padding-bottom:var(--sai-b) ✗ —— 那会把「新建记录/更多/定位」整条
     往上顶 21~34px，看起来就是"底部一行往上移"。底栏背景本来就会铺到屏幕最底。 */
  /* 弹窗自己按视口算位置，也要把刘海那侧让出来 */
  #last-rec-pop{max-width:calc(100vw - var(--sai-l) - var(--sai-r) - 16px)}

   它常常把一整句**一次性**插进来（beforeinput 的 data 就有 20~40 字），
   而 iPhone 听写是逐字插入（1~3 字/次）。"回车"怎么切段要靠这个区分（见 smart 回车分支）。 */
window.__isAndroid = /Android/i.test(navigator.userAgent);
const TYPE_META = {
  text:{label:'文本', icon:'i-t-text'},
  textarea:{label:'文本(多行)', icon:'i-t-area'},
  rich:{label:'富文本', icon:'i-t-rich'},
  number:{label:'数字', icon:'i-t-num'},

};
const ICON_CHOICES = ['i-star','i-check','i-warn','i-home','i-phone','i-mail','i-user','i-cal','i-book','i-camera','i-pin','i-link'];
function orderedTypes(){
  // 固定优先顺序：文本、选项、货币、是/否、电话号码、日期时间
  const priority = ['text','select','money','bool','phone','datetime'];
  let order = [];
  try{ order = JSON.parse(localStorage.getItem('lighter-db-type-order')||'[]'); }catch(e){}
  const all = Object.entries(TYPE_META);
  const known = new Set(order);
  const headFixed = priority.filter(k=>TYPE_META[k]).map(k=>[k, TYPE_META[k]]);
  const restKnown = order.filter(k=>TYPE_META[k] && !priority.includes(k)).map(k=>[k, TYPE_META[k]]);
  const restAll = all.filter(([k])=>!known.has(k) && !priority.includes(k));
  return headFixed.concat(restKnown).concat(restAll);
}
function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr = esc;
const svg = id => `<svg class="ic" aria-hidden="true"><use href="#${id}" xlink:href="#${id}"/></svg>`;
const $ = id => document.getElementById(id);
function fmtBytes(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function deleteRowFromLinkPanel(tableId, rowId){
  closeLinkPanel();
  // enter batch mode for deletion
  enterBatchMode(tableId, rowId);
}
function checkPhone(inp){
  const wrap = inp.closest('.phone-wrap');
  const hint = wrap ? wrap.querySelector('.field-hint') : null;
  const v = inp.value.trim();
  const chk = validatePhone(v);
  const bad = v!=='' && !chk.ok;
  inp.classList.toggle('err', bad);
  if(hint){ hint.textContent = chk.msg; hint.classList.toggle('show', bad); }
}
function validatePhone(v){
  const s = String(v==null?'':v).replace(/[\s-]/g,'').trim();
  if(!s) return {ok:true, msg:''};
  if(!/^\d+$/.test(s)) return {ok:false, msg:'号码只能包含数字'};
  if(s[0]==='1') return s.length===11 ? {ok:true,msg:''} : {ok:false, msg:'手机号需为 11 位，当前为 '+s.length+' 位'};

function moveFieldTo(tableId, fromFid, toFid){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return false;
  const fields = t.fields;
  const from = fields.findIndex(f=>f.id===fromFid);
  const to = fields.findIndex(f=>f.id===toFid);

/* localStorage 的真实上限：**按字符数（UTF-16 单元）算**，实测（Chromium 2026-10-21）
   中文和英文都是写满 5,242,880 个字符就抛 QuotaExceededError，跟 UTF-8 字节数无关。
   ⚠️ 以前用 `new Blob([v]).size`（UTF-8 字节）除以 5e6 —— 中文内容会被放大 2~3 倍，
   于是"只用了三分之一"却显示「已用 96%，接近上限」并亮红灯（真机 2026-10-21）✗
   现在统一按 UTF-16 字节（字符数 × 2）计量，上限 10 MB，跟浏览器的算法一致 ✓ */
const LS_QUOTA_CHARS = 5242880;
function lsSizeOf(v){ return String(v == null ? '' : v).length * 2; }
function storageBreakdown(){
  // 把占用拆成三块：主数据 / 撤销记录 / 其它偏好键。
  // 以前只报一个总数，用户看到「数据才几百 K，却显示 2.32M」会以为数据出问题；
  // 实际上大头是**撤销记录**（最多 10 份快照）。拆开显示才说得清。
  let data = 0, hist = 0, other = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('lighter-db-') !== 0) continue;
      const v = localStorage.getItem(k);
      if(!v) continue;
      const n = lsSizeOf(v);
      if(k === LS_KEY) data += n;
      else if(k === LS_KEY+'-history') hist += n;
      else other += n;
    }
  }catch(e){}
  return { data, hist, other, total: data + hist + other };
}
function storageBytes(){ return storageBreakdown().total; }
// 只刷新侧边栏的存储区（不算整页 render）—— 撤销记录是在 save() 之后 100ms 才写入的，
// 光靠 render 时算一次会永远偏小/滞后，必须等真正写完再补刷一次。
function refreshStorageUI(){
  const num = document.getElementById('storage-num');
  const bar = document.getElementById('storage-bar');
  if(!num || !bar) return;
  const b = storageBreakdown();
  // 主数字只报**数据本身**。以前报"数据+撤销记录"的总数，大表上撤销记录能占好几 MB，
  // 于是"清空/导入后数字一直不变"（撤销快照把差额顶住了）✗ —— 用户会以为数据没生效。
  num.textContent = fmtBytes(b.data);
  num.title = '数据 ' + fmtBytes(b.data) + ' · 撤销记录 ' + fmtBytes(b.hist) + ' · 其它 ' + fmtBytes(b.other) + ' · 合计 ' + fmtBytes(b.total);
  // 进度条按**总占用**算（含撤销记录/缓存），那才是真正会撞配额的部分
  const quota = LS_QUOTA_CHARS * 2;
  const ratio = b.total / quota;
  bar.style.width = Math.min(100, ratio * 100).toFixed(2) + '%';
  // 副标题：永远写「合计 / 上限」，**可清理的部分一律带「清理」入口** ✗
  // 以前只有 `hist>=32KB` 才出「清理」链接 —— 而占空间最大的其实常常是
  // `lighter-db-v1-backup`（整库快照，落在 other 桶里），于是「占了 4 个多 M 却没有清理按钮」
  // （真机 2026-10-21：合计 8.42 MB / 上限 10 MB，找不到清理入口）✗
  const cacheable = b.hist + b.other;
  const hint = document.getElementById('storage-hint');
  if(hint){
    let txt = '合计 ' + fmtBytes(b.total) + ' / 上限 ' + fmtBytes(quota);
    if(cacheable >= 32*1024){
      // 分两行写：第一行「合计/上限」，第二行「可清理 X · 立即清理」
      // （挤在一行时手机侧边栏只有 ~240px，会把「清理」两个字折成两行 ✗）
      hint.innerHTML = '合计 ' + fmtBytes(b.total) + ' / 上限 ' + fmtBytes(quota) +
        '<br><span style="white-space:nowrap">可清理 ' + fmtBytes(cacheable) +
        ' · <a onclick="clearCaches()" style="color:var(--accent-hi);cursor:pointer;font-weight:600">立即清理</a></span>';
      hint.title = '撤销记录 ' + fmtBytes(b.hist) + ' · 其它缓存 ' + fmtBytes(b.other) + '（数据不受影响）';
    }else{
      hint.textContent = txt;
    }
    hint.style.display = '';
  }
  const warn = document.getElementById('storage-warn');
  if(warn){
    const hot = ratio >= 0.8;
    bar.classList.toggle('hot', hot);
    warn.style.display = hot ? 'flex' : 'none';
    if(hot){
      warn.innerHTML = '<span>已用 ' + Math.round(ratio * 100) + '%（' + fmtBytes(b.total) + ' / ' + fmtBytes(quota) + '）</span>'+
        '<span style="display:flex;gap:6px">'+
        (cacheable >= 32*1024 ? '<button type="button" class="btn sm" onclick="clearCaches()">清理缓存</button>' : '')+
        '<button type="button" class="btn sm danger" onclick="exportJSON()">导出备份</button></span>';
      if(!window._quotaWarned){
        window._quotaWarned = true;
        toast('存储空间已用 ' + Math.round(ratio * 100) + '%，建议导出备份');
      }
    }
  }
}
// 清掉可再生的缓存（撤销记录、UI 偏好），用来在写满时腾地方。数据本身绝不动。
function evictRegenerableStorage(){
  let freed = 0;
  const tryDrop = k => { try{ const v = localStorage.getItem(k); if(v){ freed += lsSizeOf(v); localStorage.removeItem(k); } }catch(e){} };
  tryDrop(LS_KEY+'-backup');                                   // 旧的整库快照：最大的一块，且没有代码读它
  tryDrop(LS_KEY+'-history');                                  // 撤销记录
  ['-table-query','-ov-prefs','-collapsed-folders','-menu-order','-lp-order','-lastrec-size'].forEach(s=>tryDrop(LS_KEY+s));

/* 侧边栏「存储占用」里的「清理」：丢掉**可再生的缓存**，数据本身绝不动。

   ⚠️ `-backup` 是以前"彻底删除/清空回收站前"写的整库快照，**从来没有任何代码读它**，
   等于白占一整份数据的空间（真机 2026-10-21：数据 4.24 MB，它 4.18 MB，合计直接到 84%）✗
   现在不再写它了，存量也在这里清掉 ✓ */
function clearCaches(){
  const before = storageBreakdown();
  const beforeCache = before.hist + before.other;
  try{ localStorage.removeItem(LS_KEY+'-history'); }catch(e){}
  try{ localStorage.removeItem(LS_KEY+'-backup'); }catch(e){}
  ['-table-query','-lp-order','-lastrec-size'].forEach(s=>{ try{ localStorage.removeItem(LS_KEY+s); }catch(e){} });
  // 浮层位置（lighter-db-float-*）也是可再生缓存
  try{
    const drop = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('lighter-db-float-') === 0) drop.push(k);
    }
    drop.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  refreshStorageUI();
  const after = storageBreakdown();
  const freed = Math.max(0, beforeCache - (after.hist + after.other));
  toast(freed > 0 ? ('已清理缓存，释放 ' + fmtBytes(freed) + '（数据未动）') : '没有可清理的缓存');

        <button class="btn danger" id="cf-ok" onclick="window.__cfOk && window.__cfOk()">${esc(btnLabel)}</button>
      </div>
    </div>`;
    $('modal-root').appendChild(ov);
    let done = false;
    const run = ()=>{ if(done) return; done = true; ov.remove(); onOk(); };
    window.__cfOk = run;
    const okBtn = ov.querySelector('#cf-ok');
    if(okBtn) okBtn.addEventListener('click', run);
    return;
  }
  openModal(`<div class="modal small">
    <div class="modal-body confirm-body">${msg}</div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn danger" id="cf-ok" onclick="window.__cfOk && window.__cfOk()">${esc(btnLabel)}</button>
    </div>
  </div>`);
  // 双保险绑定：内联 onclick 之外再加 addEventListener，兼容 UC 等对按钮 JS onclick 绑定不稳定的浏览器
  let done = false;
  const run = ()=>{ if(done) return; done = true; closeModal(); onOk(); };
  window.__cfOk = run;
  const okBtn = $('cf-ok');

}
function toast(msg){

}

/* ===== 侧边栏 ===== */

/* ===== 工作簿 / 工作表（Excel 式平行页签） =====
   同一 bookId 的表 = 同一个工作簿下的平行工作表，用顶部页签切换。
   bookId 缺省时用表自身 id —— 这样「现有表零改动」：每张老表自动就是单工作表的工作簿。 */
function bookIdOf(t){ return (t && (t.bookId || t.id)) || ''; }
function bookSheets(t){
  if(!t) return [];
  const bid = bookIdOf(t);
  return db.tables.filter(x=>bookIdOf(x)===bid).sort((a,b)=>(a.order==null?0:a.order)-(b.order==null?0:b.order));
}
// 工作簿头 = 工作簿里排序第一的那张表。侧边栏/概览/文件夹只列它，
// 否则一个工作簿会在列表里出现多份（删掉头之后下一张自动顶上）。
function isBookHead(t){
  const s = bookSheets(t);
  return !s.length || s[0].id === t.id;
}
/* ===== 外观主题：跟随系统 / 浅色 / 深色 ===== */
const THEME_KEY = 'lighter-db-theme';
function themeMode(){ try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(){
  const m = themeMode();
  const dark = (m === 'dark') || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  // 状态栏/系统栏配色跟着应用内的明暗走（而不是只跟系统）
  const tm = document.getElementById('theme-color-meta');
  if(tm) tm.setAttribute('content', dark ? '#141C2C' : '#F5F6F8');
  syncThemeLabel();
}
function setThemeMode(m){
  try{ localStorage.setItem(THEME_KEY, m); }catch(e){}
  applyTheme();
  syncThemeLabel();
}
const THEME_LABELS = { auto:'跟随系统', light:'浅色', dark:'深色' };
function syncThemeLabel(){
  const el = document.getElementById('theme-cur');
  if(el) el.textContent = THEME_LABELS[themeMode()] || THEME_LABELS.auto;
}
/* 「外观」弹层：自绘而不是原生 <select>，这样深色模式下弹层也是深色的（原生下拉会是一块灰白底） */
function closeThemeMenu(){ const m = document.getElementById('theme-menu'); if(m) m.remove(); }
function openThemeMenu(btn){
  // 再点同一个「外观」按钮 → 收起弹层（用户要求：点一下开，再点一下收）
  const opened = document.getElementById('theme-menu');
  if(opened && opened._anchor === btn){ closeThemeMenu(); return; }
  closeThemeMenu();
  const cur = themeMode();
  const menu = document.createElement('div');
  menu.id = 'theme-menu';
  menu.setAttribute('role','menu');
  menu.innerHTML = ['auto','light','dark'].map(v=>
    `<button type="button" role="menuitem" class="theme-opt${v===cur?' on':''}" onclick="setThemeMode('${v}');closeThemeMenu()">`+
    `<span class="theme-check">${v===cur?'✓':''}</span>${THEME_LABELS[v]}</button>`).join('');
  document.body.appendChild(menu);
  // **右边缘和「外观」那一行（胶囊）的右边对齐**（用户要求）；
  // 上下优先放在那一行上方（它在侧边栏底部），放不下再翻到下方。
  const row = btn.closest('.side-theme') || btn;
  const rr = row.getBoundingClientRect();
  menu.classList.add('show');                 // 先显形才量得到尺寸
  const mw = menu.offsetWidth || 150, mh = menu.offsetHeight || 130;
  let left = rr.right - mw;
  left = Math.max(8, Math.min(left, Math.max(8, window.innerWidth - mw - 8)));
  let top = rr.top - mh - 6;
  if(top < 8) top = Math.max(8, Math.min(window.innerHeight - mh - 8, rr.bottom + 6));
  menu.style.left = Math.round(left) + 'px';
  menu.style.top = Math.round(top) + 'px';
  menu._anchor = btn;      // 记住是哪个按钮开的，再点同一个就收起
  menu._opening = true;
  setTimeout(()=>{ menu._opening = false; }, 300);
}
document.addEventListener('click', e=>{
  const m = document.getElementById('theme-menu');
  if(!m || m._opening) return;
  if(e.target.closest('#theme-menu') || e.target.closest('#theme-btn')) return;
  closeThemeMenu();
}, true);
try{
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSys = ()=>{ if(themeMode() === 'auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onSys);
  else if(mq.addListener) mq.addListener(onSys);
}catch(e){}

/* ===== iOS 键盘：整页位移补偿 =====
   iOS 键盘弹出时会把「视觉视口」整体上移（visualViewport.offsetTop > 0），
   而 position:fixed / sticky 都是相对布局视口定位的 —— 页面主体（顶栏 + 表格）
   会跟着被顶上去：表格往上跑、表头藏到顶栏后面，键盘收起后也不回来。

   应用原本只补偿了弹窗（.rec-modal 的 _vvAnchor）和「上次记录」小窗，
   主体没补偿 —— 所以看起来"弹窗没动、表格却被顶走了"。

   这里把 #app 按 offsetTop 顶回去，主体视觉上保持不动。
   安全性：#app 内只有侧边栏和主区；弹窗（#modal-root）、浮层菜单、toast 都是
   body 的直接子元素，在 #app 之外，不受这个 transform 影响（它们各自有补偿）。
   transform 不改布局，只改绘制，不会引起回流。 */
/* 键盘是否弹着：iOS 弹键盘会把「视觉视口」高度压掉一大截（地址栏变化只有几十像素）。
   用它把"键盘顶走文档"和"手指正常滚动页面"两种情况区分开。 */
function keyboardOpen(){
  const vv = window.visualViewport;
  if(!vv) return false;
  const h = vv.height || window.innerHeight;
  return h < window.innerHeight - 80;
}
function syncAppShift(){
  const app = document.getElementById('app');
  const vv = window.visualViewport;
  const off = (vv && vv.offsetTop) || 0;
  // 只有「键盘把视觉视口顶起来」时才做补偿。
  // 关键：**手指正常滚动页面时 visualViewport 的 scroll / resize 也会疯狂触发**
  //（iOS 快速上滑时地址栏收起，尤其明显），那时若调 resetDocScroll() 就会把刚滚上去的
  //  内容顶回顶部 —— 表现就是"快速用力上滑被顶下来，慢慢滑没事"✗。
  // 所以这里必须用「键盘是否弹着 / 守卫窗口是否开着」来收口，不能无条件补偿。
  const kb = docGuardActive() || keyboardOpen();
  // ① 位移补偿：iOS 键盘有时会把「视觉视口」整体上移，主体跟着被顶走 → 按 offsetTop 顶回来
  if(app){
    const t = (kb && off > 0) ? ('translateY(' + off + 'px)') : '';
    if(app.style.transform !== t) app.style.transform = t;
  }
  // ② 文档滚动补偿（这才是"键盘弹出瞬间表头就没了"的主因）：
  //    iOS 在聚焦输入框时会把**整个文档**滚上去把输入框露出来 —— 即使 body 设了
  //    overflow:hidden 也照滚不误 ✗。而顶栏是 position:sticky、会钉在视口顶部，
  //    于是表格内容被顶上去、表头钻进顶栏（搜索框那一层）下面。
  //    这里把文档滚回顶部，内容就回到原位。只在键盘相关时刻做。
  if(kb) resetDocScroll();
}
function resetDocScroll(){
  // 只在手机端做：桌面端窗口很矮时文档本来就该能滚，别去动它
  if(!window.__isMobile) return;
  // 注意：不要动 #grid .table-scroll 的 scrollTop —— 那是用户自己的表格滚动位置，
  // 动了就会跟用户抢（之前踩过：加了"表头被挡就拉回顶部"的兜底，结果用户拖不回来了）。
  try{
    if(window.scrollY > 0) window.scrollTo(0, 0);
    const de = document.documentElement;
    if(de.scrollTop > 0) de.scrollTop = 0;
    if(document.body.scrollTop > 0) document.body.scrollTop = 0;
  }catch(e){}
}
/* 「文档滚动复位」只允许在**键盘相关**的时刻生效。
   它本来是给"聚焦输入框时 iOS 把整个文档滚上去、sticky 顶栏跟着跑"兜底的。
   但原来还挂着一个**无条件**的全局 scroll 监听：只要 window.scrollY>0 就立刻滚回 0 ——
   于是概览页上正常的滑动会被一直顶回去（横屏内容比屏幕高一倍，表现就是"一拉上去就弹下来"）✗。
   现在改成守卫窗口：只有 focusin / focusout 前后这一小段（键盘动画期间）才复位，
   平时完全不碰用户的滚动。 */
let _docGuardUntil = 0;
const DOC_GUARD_MS = 1500;
function docGuardActive(){ return Date.now() < _docGuardUntil; }
// 键盘弹出/收起时 iOS 滚文档是异步的，光靠一次调用盖不住 —— 前后各补几次
let _docWatchdog = null;
function watchDocScroll(arm){
  // arm=false 只用于 boot：开机时清一下 iOS 恢复的滚动位置，但**不要**打开守卫窗口，
  // 否则刚打开应用的两秒内用户滑概览页会被顶回去（体感就是"卡住不动"）✗
  if(arm !== false) _docGuardUntil = Date.now() + DOC_GUARD_MS;
  resetDocScroll();
  clearTimeout(_docWatchdog);
  let n = 0;
  const tick = ()=>{
    resetDocScroll();
    if(++n < (arm === false ? 4 : 8)) _docWatchdog = setTimeout(tick, 90);
  };
  _docWatchdog = setTimeout(tick, 60);
}
window.addEventListener('scroll', ()=>{ if(docGuardActive() && window.scrollY > 0) resetDocScroll(); }, { passive:true });
/* 只有"会弹键盘"的聚焦才会让 iOS 滚动整个文档。
   点卡片/按钮/链接**同样**会触发 focusin（<a href>、<button> 都能获得焦点），
   但不会顶走文档 —— 那种情况绝不能开守卫，否则"点一下卡片，接下来一两秒页面滑不动" ✗。 */
function isTextEntry(el){
  if(!el) return false;
  if(el.isContentEditable) return true;
  const tag = (el.tagName || '').toLowerCase();
  if(tag !== 'input' && tag !== 'textarea' && tag !== 'select') return false;
  const type = (el.type || '').toLowerCase();
  return ['button','submit','reset','checkbox','radio','file','range','color','image'].indexOf(type) < 0;
}
function onFocusChange(e){ if(isTextEntry(e.target)) watchDocScroll(); }
document.addEventListener('focusin', onFocusChange, true);
document.addEventListener('focusout', onFocusChange, true);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncAppShift);
  window.visualViewport.addEventListener('scroll', syncAppShift);
}

/* ===== 概览/文件夹：查看方式（平铺·列表）与排序方式 =====
   偏好**按文件夹各存各的**：在哪个文件夹里设置就只影响那个文件夹。
   scope = 文件夹 id（未分类固定用 __ungrouped__）。默认「平铺 + 自定义顺序」。 */
const OV_SCOPE_DEFAULT = '__ungrouped__';
function ovPrefsAll(){
  try{
    const raw = JSON.parse(localStorage.getItem('lighter-db-ov-prefs') || '{}');
    if(raw && typeof raw === 'object') return raw;
  }catch(e){}
  return {};
}
function ovPrefs(scope){
  const p = ovPrefsAll()[scope || OV_SCOPE_DEFAULT];
  return (p && typeof p === 'object') ? p : {};
}
function ovWritePref(scope, patch){
  const all = ovPrefsAll();
  const k = scope || OV_SCOPE_DEFAULT;
  all[k] = Object.assign({}, (all[k] && typeof all[k] === 'object') ? all[k] : {}, patch);
  try{ localStorage.setItem('lighter-db-ov-prefs', JSON.stringify(all)); }catch(e){}
}
// 旧版把偏好存成全局三个键：首次运行搬进「未分类」这个 scope，避免用户设置突然丢失
(function migrateOvPrefs(){
  try{
    const v = localStorage.getItem('lighter-db-ov-view');
    const so = localStorage.getItem('lighter-db-ov-sort');
    const d = localStorage.getItem('lighter-db-ov-dir');
    if(!v && !so && !d) return;
    const all = ovPrefsAll();
    if(!all[OV_SCOPE_DEFAULT]){
      const p = {};
      if(v) p.view = v;
      if(so) p.sort = so;
      if(d) p.dir = d;
      all[OV_SCOPE_DEFAULT] = p;
      localStorage.setItem('lighter-db-ov-prefs', JSON.stringify(all));
    }
    localStorage.removeItem('lighter-db-ov-view');
    localStorage.removeItem('lighter-db-ov-sort');
    localStorage.removeItem('lighter-db-ov-dir');
  }catch(e){}
})();
function ovView(scope){ return ovPrefs(scope).view === 'list' ? 'list' : 'tile'; }
function ovSort(scope){ return ovPrefs(scope).sort || 'custom'; }
function ovSortDir(scope){ return ovPrefs(scope).dir === 'desc' ? 'desc' : 'asc'; }
function setOvView(m, scope){ ovWritePref(scope, { view: m }); render(); }
function setOvSort(m, scope){
  if(m !== 'custom' && ovSort(scope) === m){
    // 同一排序项再点一下：切换正序/倒序
    ovWritePref(scope, { dir: ovSortDir(scope) === 'asc' ? 'desc' : 'asc' });
  } else {
    ovWritePref(scope, { sort: m, dir: 'asc' });
  }
  render();
}
function ovSortTables(list, scope){
  const mode = ovSort(scope), dir = ovSortDir(scope), arr = list.slice();
  const byName = (a,b)=> String(bookNameOf(a)).localeCompare(String(bookNameOf(b)), 'zh-Hans-CN');
  const mul = dir === 'desc' ? -1 : 1;
  if(mode === 'updated') arr.sort((a,b)=> mul*((a.updatedAt||0)-(b.updatedAt||0)) || byName(a,b));
  else if(mode === 'size') arr.sort((a,b)=> mul*((a.rows.length||0)-(b.rows.length||0)) || byName(a,b));
  else if(mode === 'type') arr.sort((a,b)=> mul*((bookSheets(a).length>1?1:0)-(bookSheets(b).length>1?1:0)) || byName(a,b));
  else if(mode === 'name') arr.sort((a,b)=> mul>0 ? byName(a,b) : byName(b,a));
  // custom：保持数组原顺序（即用户拖动出来的 order），不排序
  return arr;
}
function fmtShortDate(ts){
  if(!ts) return '';
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function ovRowHTML(t){
  const sheets = bookSheets(t);
  return `<a class="ov-row" href="#/table/${encodeURIComponent(t.id)}" data-id="${t.id}" draggable="true" ondragstart="dragTableStart(this,event)" ondragover="dragTableOver(this,event)" ondragleave="dragTableLeave(this)" ondrop="dragTableDrop(this,event,'${t.id}')" ondragend="dragTableEnd()" title="点击进入 · 拖动调整顺序 · 长按改名">
    <span class="ov-row-ic">${svg('i-table')}</span>
    <span class="ov-row-name">${esc(bookNameOf(t))}</span>
    <span class="ov-row-meta">${t.rows.length} 条${sheets.length>1?' · '+sheets.length+' 个工作表':''}</span>
    <span class="ov-row-date">${fmtShortDate(t.updatedAt)}</span>

}
// 按当前查看方式渲染一组表：列表用 ov-row，平铺用各视图自己的卡片（cardFn）
function ovItemsHTML(list, cardFn, scope){
  if(ovView(scope) === 'list') return `<div class="ov-list">` + list.map(ovRowHTML).join('') + `</div>`;
  return `<div class="tbl-cards ov-cards">` + list.map(cardFn).join('') + `</div>`;
}
// 工作簿总名：存在 db.bookNames[bookId] 里（不写进表对象，删掉头表也不会丢）。
// 没设过就回退到第一张工作表的名字 —— 于是「现有表零改动」，行为与以前完全一致。
function bookNameOf(t){
  if(!t) return '';
  const n = (db.bookNames || {})[bookIdOf(t)];
  if(n && String(n).trim()) return String(n).trim();
  const s = bookSheets(t);
  return (s[0] && s[0].name) || t.name || '';
}
function renderSidebar(){
  const r = parseHash();
  const list = $('table-list');
  $('nav-overview').classList.toggle('active', r.view==='overview');
  $('nav-trash').classList.toggle('active', r.view==='trash');
  const tc = $('nav-trash-count');
  if(tc){
    const n = (db.trash||[]).reduce((x,it)=>x+it.rows.length,0);
    tc.textContent = n ? n : '';
    tc.style.display = n ? '' : 'none';
  }
  const sideTables = db.tables.filter(isBookHead);
  list.innerHTML = sideTables.length ? sideTables.map(t=>`
    <a class="tbl-item ${r.view==='table' && bookSheets(t).some(s=>s.id===r.id) ? 'active':''}" href="#/table/${encodeURIComponent(t.id)}" title="${esc(t.name)}">
      ${svg('i-table')}<span class="tbl-name">${esc(bookNameOf(t))}</span><span class="tbl-count">${t.rows.length}</span>
    </a>`).join('') : `<div class="side-empty">暂无数据表</div>`;

/* ===== 路由 ===== */
// 手工输入畸形 hash（如 #/table/%）时 decodeURIComponent 会抛 URIError，
// 之前会把整个渲染流程打断成白屏；这里统一兜底。
function safeDecodeURIComponent(s){
  try{ return decodeURIComponent(String(s==null?'':s)); }
  catch(e){ return String(s==null?'':s); }
}
function parseHash(){
  const h = location.hash || '#/overview';
  if(h.startsWith('#/trash')) return { view:'trash' };
  const mf = h.match(/^#\/folder\/(.+)$/);
  if(mf) return { view:'folder', id: safeDecodeURIComponent(mf[1]) };
  const m = h.match(/^#\/table\/(.+)$/);
  if(m) return { view:'table', id: safeDecodeURIComponent(m[1]) };
  return { view:'overview' };
}
function route(){
  const r = parseHash();
  if(r.view==='table'){
    const t = db.tables.find(x=>x.id===r.id);
    if(t) return renderTable(t);
  }
  if(r.view==='folder') return renderFolderView(r.id);
  if(r.view==='trash') return renderTrash();
  renderOverview();
}
function render(){
  syncAppShift();
  const r = parseHash();
  // 概览多选只在概览/文件夹页有效：切到别的视图就退出（否则底部操作条会跟着跑到表格页）
  if(_ovSel && r.view!=='overview' && r.view!=='folder') _ovSel = null;
  const t = r.view==='table' ? db.tables.find(x=>x.id===r.id) : null;
  const vw = $('view'); if(vw) vw.classList.remove('table-page');
  document.body.classList.remove('table-page-body');
  // 概览页有自己的 body 类：概览把全局搜索挪到了内容区，顶栏那个要隐藏（见 CSS）
  document.body.classList.toggle('view-overview', r.view === 'overview');
  const cf = r.view==='folder' ? db.folders.find(x=>x.id===r.id) : null;
  $('topbar-title').textContent = r.view==='trash' ? '回收站' : (r.view==='folder' ? '文件夹 · '+(cf?cf.name:'') : (t ? '数据表 · '+bookNameOf(t) : '概览'));
  const ts = $('top-search');
  if(ts){
    ts.style.display = t ? '' : 'none';
    if(t) ts.querySelector('input').value = uiFor(t.id).q || '';
  }
  renderSidebar();
  route();
  ovSelBar();          // 多选底部操作条：进入/退出/计数都靠它同步
}
function onTableSearch(v){
  const r = parseHash();
  if(r.view!=='table') return;
  uiFor(r.id).q = v;
  renderGrid(r.id);
}

/* ===== 全局搜索（跨所有数据表） ===== */
// 图片/签名存的是 dataURL，参与匹配既慢又没意义，直接跳过
const GSEARCH_SKIP = { image:1, signature:1, color:1, icon:1 };
function cellText(r, f){
  if(f.type === 'formula') return fmtFormula(formulaValue(r, f), f);
  let v = r.values[f.id];
  if(Array.isArray(v)) v = v.join(' ');
  if(v == null) return '';
  if(f.type === 'bool') return (v === true || v === 'true' || v === '是') ? '是' : '否';
  return String(v);
}
function rowLabel(t, r){
  for(const f of t.fields){
    if(f.hidden || GSEARCH_SKIP[f.type] || f.type === 'bool') continue;
    const s = cellText(r, f);
    if(String(s).trim() !== '') return String(s);
  }
  return '第 ' + (r.no || '') + ' 条';
}
function globalSearch(q){
  const lq = String(q == null ? '' : q).toLowerCase().trim();
  if(!lq) return { tables: [], rows: [] };
  const tHits = [], rHits = [];
  for(const t of db.tables){
    if(String(t.name || '').toLowerCase().indexOf(lq) > -1) tHits.push({ id:t.id, name:t.name, rows:t.rows.length });
  }
  for(const t of db.tables){
    for(const r of t.rows){
      for(const f of t.fields){
        if(f.hidden || GSEARCH_SKIP[f.type]) continue;
        const s = cellText(r, f);
        if(s && String(s).toLowerCase().indexOf(lq) > -1){
          rHits.push({
            tid:t.id, tname:t.name, rid:r.id, fname:f.name,
            snippet: String(s).length > 60 ? String(s).slice(0, 60) + '…' : String(s),
            main: rowLabel(t, r)
          });
          break;   // 同一条记录只出现一次
        }
      }
      if(rHits.length >= 40) break;
    }
    if(rHits.length >= 40) break;
  }
  return { tables: tHits, rows: rHits };
}
function onGlobalSearch(v, anchor){
  // 概览页把搜索框移到了内容区，所以锚点要能指定；默认仍是顶栏那个。
  // anchor 可以是元素或 id 字符串。注意：如果拿到的是 <input>（比如传了输入框的 id），
  // 必须上溯到它的 .search-box 容器 —— 面板挂进 <input> 里是渲染不出来的
  // （曾表现为"全局搜索不会边输边出结果"，其实结果生成了、只是挂在了 input 内部）。
  let box = null;
  if(anchor){
    box = (typeof anchor === 'string') ? $(anchor) : anchor;
    if(box && box.tagName === 'INPUT') box = box.closest('.search-box') || box.parentElement;
  }
  if(!box) box = $('global-search');
  if(!box) return;
  // 结果面板只有一个实例，用到哪个框就移到哪个框下面（避免出现两个同名 id 的面板）
  let panel = $('global-results');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'global-results';
    panel.className = 'gresults';
  }
  if(panel.parentNode !== box) box.appendChild(panel);
  const q = String(v == null ? '' : v).trim();
  if(!q){ panel.style.display = 'none'; return; }
  const res = globalSearch(q);
  let html = '';
  res.tables.forEach(t=>{
    html += '<div class="gr-item" onclick="openGlobalTable(\'' + t.id + '\')">'+
      '<span class="gr-tname">数据表</span>'+
      '<span class="gr-main">' + esc(t.name) + '</span>'+
      '<span class="gr-field">' + t.rows + ' 条记录 · 点击打开</span></div>';
  });
  res.rows.forEach(r=>{
    html += '<div class="gr-item" onclick="openGlobalResult(\'' + r.tid + '\',\'' + r.rid + '\')">'+
      '<span class="gr-tname">' + esc(r.tname) + '</span>'+
      '<span class="gr-main">' + esc(r.main) + '</span>'+
      '<span class="gr-field">' + esc(r.fname) + '：' + esc(r.snippet) + '</span></div>';
  });
  if(!html) html = '<div class="gr-empty">没有找到「' + esc(q) + '」</div>';
  else if(res.rows.length >= 40) html += '<div class="gr-more">结果较多，仅显示前 40 条，建议输入更精确的关键词</div>';
  panel.innerHTML = html;
  panel.style.display = 'block';
  // 面板本来靠 right:0 锚在搜索框右边向左展开，搜索框靠左（概览页、手机全宽框）时
  // 面板左边会跑出屏幕被裁掉。显示后量一次实际宽度，改用 left 定位夹回可视区内。
  const boxRect = box.getBoundingClientRect();
  const pw = panel.offsetWidth || 330;
  const minL = 8 - boxRect.left;                                   // 左边不越界
  const maxL = window.innerWidth - 8 - pw - boxRect.left;          // 右边不越界
  let L = boxRect.width - pw;                                      // 默认右对齐搜索框
  L = Math.min(Math.max(L, minL), Math.max(minL, maxL));
  panel.style.right = 'auto';
  panel.style.left = Math.round(L) + 'px';
}
function onGlobalSearchKey(ev){
  if(ev.key === 'Escape'){ closeGlobalResults(); return; }
  if(ev.key !== 'Enter') return;
  ev.preventDefault();
  const panel = $('global-results');
  if(!panel || panel.style.display === 'none') return;
  const first = panel.querySelector('.gr-item');
  if(first) first.click();
}
function closeGlobalResults(){

function _clearGlobalInput(){
