// 弹窗内容后填（比如统计结果）时，makeFloat 早已按"当时的内容高度"定死了高度，
// 结果就是内容被截断要滚动。这里按需把它撑高（只长不缩，不覆盖用户手动调的尺寸）。
function fitModalHeight(){
  const m = document.querySelector('#modal-root .modal');
  if(!m || m.classList.contains('rec-modal')) return;
  const body = m.querySelector('.modal-body');
  if(!body) return;
  const over = body.scrollHeight - body.clientHeight;
  if(over <= 2) return;
  const maxH = Math.max(160, Math.round((window.innerHeight - 16) * 0.92));
  const want = Math.min(maxH, m.offsetHeight + over + 2);
  if(want > m.offsetHeight) m.style.height = Math.round(want) + 'px';
}
function syncCondVal(){
  const op = $('cond-op'); if(!op) return;
  const need = !(op.value==='empty' || op.value==='notempty');
  const v = $('cond-val');
  if(v){ v.disabled = !need; v.style.opacity = need ? '' : '.45'; v.placeholder = need ? '比较值' : '（不需要值）'; }
}
function addCondRule(tableId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const fieldId = $('cond-field').value;
  const op = $('cond-op').value;
  const need = !(op==='empty' || op==='notempty');
  const value = $('cond-val').value.trim();
  if(!fieldId){ toast('请选择字段'); return; }
  if(need && value === ''){ toast('请填写比较值'); return; }
  condRulesOf(t).push({ id: uid(), fieldId, op, value: need ? value : '', bgColor: $('cond-bg').value, fontColor: $('cond-fg').value, bold: $('cond-bold').checked });
  save(); openCondRules(tableId); render();
  toast('已添加条件格式');
}
function delCondRule(tableId, ruleId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  t.view.condRules = condRulesOf(t).filter(r=>r.id !== ruleId);
  save(); openCondRules(tableId); render();
}
function moveCondRule(tableId, ruleId, dir){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const arr = condRulesOf(t);
  const i = arr.findIndex(r=>r.id === ruleId);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= arr.length) return;
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  save(); openCondRules(tableId); render();
}
/* ===== 分组统计：按某列分组，对另一列求和/计数/平均/最大/最小（纯 CSS 条形，不引库） ===== */
const GS_AGGS = [['count','计数（条数）'],['sum','求和'],['avg','平均值'],['max','最大值'],['min','最小值']];
function openGroupStats(tableId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  if(!t.fields.length){ toast('这张表还没有字段'); return; }
  const gf = t.fields.filter(f=>!f.hidden);
  const nf = t.fields.filter(f=>(f.type==='number'||f.type==='money') && !f.hidden);
  const defG = (gf.find(f=>f.type==='select'||f.type==='tags'||f.type==='bool') || gf[0]).id;
  const defV = nf.length ? nf[0].id : '';
  const gOpts = gf.map(f=>`<option value="${f.id}"${f.id===defG?' selected':''}>${esc(f.name)}</option>`).join('');
  const vOpts = nf.length ? nf.map(f=>`<option value="${f.id}"${f.id===defV?' selected':''}>${esc(f.name)}</option>`).join('') : '<option value="">（没有数字列）</option>';
  const aOpts = GS_AGGS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');
  openModal(`<div class="modal" data-float-key="groupStats">
    <div class="modal-head"><h2>分组统计</h2><button type="button" class="icon-btn" onclick="closeModal()" title="关闭">${svg('i-x')}</button></div>
    <div class="modal-body">
      <div class="gs-controls">
        <label class="gs-ctl"><span>分组依据</span><select id="gs-group" class="in" onchange="runGroupStats('${t.id}')">${gOpts}</select></label>
        <label class="gs-ctl"><span>统计方式</span><select id="gs-agg" class="in" onchange="runGroupStats('${t.id}')">${aOpts}</select></label>
        <label class="gs-ctl"><span>统计字段</span><select id="gs-field" class="in" onchange="runGroupStats('${t.id}')">${vOpts}</select></label>
      </div>
      <div id="gs-out" class="gs-out"></div>
    </div>
    <div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">关闭</button></div>
  </div>`);
  runGroupStats(tableId);
}
function runGroupStats(tableId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const out = $('gs-out'); if(!out) return;
  const gsel = $('gs-group'), asel = $('gs-agg'), vsel = $('gs-field');
  if(!gsel || !asel){ out.innerHTML = ''; return; }
  const gf = t.fields.find(f=>f.id === gsel.value);
  const vf = t.fields.find(f=>f.id === (vsel ? vsel.value : ''));
  const agg = asel.value;
  if(!gf){ out.innerHTML = '<p class="muted">请选择分组依据</p>'; return; }
  if(agg !== 'count' && !vf){ out.innerHTML = '<p class="muted">请选一个数字列，或把统计方式改成「计数」</p>'; return; }
  const multi = (gf.type==='tags' || (gf.type==='select' && gf.multi !== false));
  const groups = new Map();
  const bump = (key, val)=>{
    if(!groups.has(key)) groups.set(key, { n:0, vals:[] });
    const g = groups.get(key);
    g.n++;
    if(val !== null) g.vals.push(val);
  };
  t.rows.forEach(r=>{
    let val = null;
    if(agg !== 'count' && vf){
      const s2 = condCellStr(r, vf);
      const n = s2 === '' ? NaN : Number(s2);
      if(!isNaN(n)) val = n;
    }
    const raw = r.values[gf.id];
    const arr = Array.isArray(raw) ? raw.filter(x=>x!=='' && x!=null).map(String)
                                  : ((raw==null || String(raw).trim()==='') ? [] : [String(raw).trim()]);
    if(!arr.length){ bump('（空）', val); return; }
    if(multi && arr.length > 1){ arr.forEach(k=>bump(k, val)); return; }
    bump(arr.join(' / '), val);
  });
  const list = [...groups.entries()].map(([name,g])=>{
    let v = g.n;
    if(agg === 'sum') v = g.vals.reduce((a,b)=>a+b, 0);
    else if(agg === 'avg') v = g.vals.length ? g.vals.reduce((a,b)=>a+b, 0) / g.vals.length : 0;
    else if(agg === 'max') v = g.vals.length ? Math.max.apply(null, g.vals) : 0;
    else if(agg === 'min') v = g.vals.length ? Math.min.apply(null, g.vals) : 0;
    return { name, n: g.n, v };
  });
  list.sort((a,b)=> b.v - a.v || String(a.name).localeCompare(String(b.name), 'zh-Hans-CN'));
  let max = 0;
  list.forEach(x=>{ const a = Math.abs(x.v); if(a > max) max = a; });
  if(!max) max = 1;
  const isMoney = vf && vf.type === 'money' && agg !== 'count';
  const fmtV = x => isMoney ? fmtMoney(x, vf) : fmtNum(x);
  const aggName = (GS_AGGS.find(x=>x[0]===agg) || [])[1] || '';
  const bars = list.map(x=>{
    const w = Math.max(2, Math.round(Math.abs(x.v) / max * 100));
    return '<div class="gs-item"><div class="gs-top"><span class="gs-name">' + esc(x.name) + '</span>' +
           '<span class="gs-val">' + fmtV(x.v) + (agg !== 'count' ? ' <em class="muted">/ ' + x.n + ' 条</em>' : '') + '</span></div>' +
           '<div class="gs-bar"><i style="width:' + w + '%"></i></div></div>';
  }).join('');
  out.innerHTML =
    '<div class="gs-sum"><span>共 <b>' + list.length + '</b> 组 · <b>' + t.rows.length + '</b> 条记录</span>' +
    '<span class="muted">' + esc(gf.name) + ' → ' + aggName + ((agg !== 'count' && vf) ? '（' + esc(vf.name) + '）' : '') + '</span></div>' +
    '<div class="gs-list">' + (bars || '<p class="muted">没有数据</p>') + '</div>' +
    (multi ? '<p class="muted" style="font-size:12px;margin-top:10px">该字段可多选：一条记录若选了多个值，会在每个值下各计一次。</p>' : '');
  fitModalHeight();
}
/* ===== 公式字段 =====
   表达式用 [字段名] 引用其它字段，支持 + - * / ( ) 和数字。
   **不用 eval**，自己写了个极小的递归下降解析器（数据来自用户导入，不能拿去 eval）。
   引用字段为空或非数字时按 0 算；整条表达式解析失败则显示 —。 */
function formulaValue(r, f, t){
  if(!t) t = db.tables.find(x=>x.fields.some(y=>y.id === f.id));
  if(!t || !f.expr) return null;
  const v = evalFormula(f.expr, name=>{
    const src = t.fields.find(x=>x.name === name && x.type !== 'formula');
    if(!src) return null;
    const str = condCellStr(r, src);
    if(str === '') return null;
    const num = Number(str);
    return isNaN(num) ? null : num;
  });
  return v;
}
function evalFormula(expr, lookup){
  const src = String(expr || '');
  let i = 0;
  const skip = ()=>{ while(i < src.length && /\s/.test(src[i])) i++; };
  const factor = ()=>{
    skip();
    const c = src[i];
    if(c === '('){ i++; const v = expr_(); skip(); if(src[i] === ')') i++; return v; }
    if(c === '-'){ i++; return -factor(); }
    if(c === '+'){ i++; return factor(); }
    if(c === '['){
      const end = src.indexOf(']', i);
      if(end < 0){ i = src.length; return NaN; }
      const name = src.slice(i+1, end).trim();
      i = end + 1;
      const v = lookup(name);
      return (v == null || isNaN(v)) ? 0 : v;
    }
    const m = /^\d+(\.\d+)?/.exec(src.slice(i));
    if(m){ i += m[0].length; return parseFloat(m[0]); }
    i = src.length; return NaN;
  };
  const term = ()=>{
    let v = factor();
    for(;;){
      skip();
      const c = src[i];
      if(c === '*' || c === '/'){ i++; const r = factor(); v = (c === '*' ? v * r : (r === 0 ? NaN : v / r)); }
      else return v;
    }
  };
  const expr_ = ()=>{
    let v = term();
    for(;;){
      skip();
      const c = src[i];
      if(c === '+' || c === '-'){ i++; const r = term(); v = (c === '+' ? v + r : v - r); }
      else return v;
    }
  };
  const out = expr_();
  return (out == null || isNaN(out) || !isFinite(out)) ? null : out;
}
function fmtFormula(n, f){
  if(n == null) return '';
  if(f && f.exprMoney) return fmtMoney(n, { type:'money', curSym:'¥', curDec:2 });
  return fmtNum(n);
}

      <div class="fx-prev"><span class="muted">预览：</span><b id="fx-prev-val">—</b></div>

function fxInsert(btn, name){
  const el = $('fx-expr'); if(!el) return;
  const at = el.selectionStart == null ? el.value.length : el.selectionStart;
  const add = '[' + name + ']';
  el.value = el.value.slice(0, at) + add + el.value.slice(el.selectionEnd == null ? at : el.selectionEnd);
  el.focus();
  el.setSelectionRange(at + add.length, at + add.length);
  fxPreview();
}
function fxPreview(){
  const el = $('fx-expr'), out = $('fx-prev-val');
  if(!el || !out) return;
  const t = db.tables.find(x=>x.id === editTableId);
  const money = $('fx-money') && $('fx-money').checked;
  const expr = el.value.trim();
  if(!expr || !t){ out.textContent = '—'; return; }
  const fake = { id:'__fx__', name:'公式', type:'formula', expr, exprMoney:money };
  const r = t.rows[0] || { values:{} };
  const v = formulaValue(r, fake, t);
  out.textContent = v == null ? '（无法计算）' : (fmtFormula(v, fake) + (t.rows.length ? '　（按第 1 条记录试算）' : '　（表里还没记录）'));
}

function saveFormulaEditor(){
  const row = window._fxRow;
  if(!row){ closeFormulaEditor(); return; }
  const exprEl = row.querySelector('.f-expr');
  const moneyEl = row.querySelector('.f-expr-money');

}
/* 生成一个数据单元格的内容（编号列除外）。
   renderGrid 与"单元格就地刷新"共用 —— 就地刷新时 g-num 关联角标 / X 跨表角标 /
   行高拖拽把手都必须原样还在，否则改一个格就把这些弄丢了 ✗ */
function cellInnerHTML(t, r, f, ctx){
  ctx = ctx || {};
  const gnums = ctx.gnums || groupNumbers(t);
  const xMountIds = ctx.xMountIds || new Set((db.xgroups||[]).map(g=>xMountField(t,g)));
  const firstFid = t.fields.length ? t.fields[0].id : '';
  const gid = r.links && (r.links[f.id] || (f.id===firstFid && r.links.__any__));
  const gnum = gid && gnums[gid] ? gnums[gid] : '';
  const xgb = (db.xgroups||[]).map((g,i)=>({g,i})).filter(o=>o.g.rows.some(m=>m.t===t.id && m.r===r.id));
  const xbadge = xgb.map(o=>`<span class="g-num xg" title="跨表关联组（点击查看成员及来源）" onclick="showXGroup('${t.id}','${o.g.id}',event)">X${o.i+1}</span>`).join('');
  return `${ctx.rowRes||''}${displayVal(r,f)}${gnum?`<span class="g-num" title="查看关联组成员" onclick="showGroupMembers('${t.id}','${f.id}','${gid}',event)">${gnum}</span>`:''}${xMountIds.has(f.id)?xbadge:''}`;
}
/* ===== 单元格就地编辑（**只在电脑版**；手机/平板完全不走这里）=====
   交互：双击某个单元格 → 变成输入框 → 回车/点别处提交，Esc 取消，Tab 提交并跳到右边一格。
   整条记录仍可用「双击最左边的编号列」或长按菜单打开原来的记录弹窗，行为不变。 */
let _cellEdit = null;          // 当前正在编辑的单元格状态
/* 哪些类型可以在格子里直接编辑（图片/签名/图标/公式不在内 —— 它们需要更大的操作区） */
function canInlineEdit(f){
  if(!f) return false;
  return ['text','textarea','rich','number','money','bool','select','tags','date','time','datetime',
          'duration','book','email','phone','url','location','color'].includes(f.type);
}
function cellEditorHTML(f, v){
  const val = (v==null||v==='undefined'||v==='null') ? '' : v;
  const esc2 = x=>escAttr(String(x==null?'':x));
  if(f.type==='number'||f.type==='money') return `<input class="cell-edit-in" type="number" step="any" value="${esc2(val)}"${f.type==='money'?' placeholder="0.00"':''}>`;
  if(f.type==='date')     return `<input class="cell-edit-in" type="date" value="${esc2(val)}">`;
  if(f.type==='time')     return `<input class="cell-edit-in" type="time" value="${esc2(val)}">`;
  if(f.type==='datetime'||f.type==='book') return `<input class="cell-edit-in" type="datetime-local" value="${esc2(String(val).replace(' ','T'))}">`;
  if(f.type==='bool')     return `<select class="cell-edit-in"><option value=""${val===''?' selected':''}>—</option><option value="true"${val==='true'?' selected':''}>是</option><option value="false"${val==='false'?' selected':''}>否</option></select>`;
  if(f.type==='color')    return `<input class="cell-edit-in" type="color" value="${/^#[0-9a-fA-F]{6}$/.test(val)?esc2(val):'#4f8ef7'}">`;
  if(f.type==='select')   return fieldInput(f, Array.isArray(val)?val:[]);   // 复用带主题的下拉（含多选）
  if(f.type==='tags')     return `<input class="cell-edit-in" type="text" value="${esc2(Array.isArray(val)?val.join('，'):val)}" placeholder="多个用逗号分隔">`;
  if(f.type==='phone')    return `<input class="cell-edit-in" type="text" inputmode="numeric" maxlength="12" value="${esc2(val)}">`;
  if(f.type==='email')    return `<input class="cell-edit-in" type="email" value="${esc2(val)}">`;
  if(f.type==='url')      return `<input class="cell-edit-in" type="url" value="${esc2(val)}">`;
  if(f.type==='textarea'||f.type==='rich') return `<input class="cell-edit-in" type="text" value="${esc2(String(val).replace(/\s*\n\s*/g,' '))}">`;
  return `<input class="cell-edit-in" type="text" value="${esc2(val)}">`;
}
/* 从编辑器里读回"值"（要和 saveRecord 的存储格式一致：bool 存 'true'/'false'，select 存数组） */
function readCellValue(wrap, f){
  if(f.type==='bool'){ const el = wrap.querySelector('select,input[type=checkbox]'); return el ? el.value : ''; }
  if(f.type==='select') return [...wrap.querySelectorAll('input:checked')].map(c=>c.value);
  const el = wrap.querySelector('.cell-edit-in,input,select,textarea');
  if(!el) return '';
  const raw = el.value == null ? '' : String(el.value);
  if(f.type==='number'||f.type==='money'){
    if(raw.trim()==='') return null;
    const n = Number(raw);
    return Number.isFinite(n) ? n : '__NUM_ERR__';
  }
  if(f.type==='tags') return raw.trim() ? raw.split(/[,，、]/).map(s=>s.trim()).filter(Boolean) : [];
  if(f.type==='date'||f.type==='time') return raw.trim();
  if(f.type==='datetime'||f.type==='book') return raw.trim() ? raw.trim().replace('T',' ') : '';
  return raw.trim();
}
/* 校验单个字段的新值；返回错误文案，或 null（通过） */
function validateCellValue(t, r, f, v){
  if(v === '__NUM_ERR__') return '「'+f.name+'」需要是数字';
  const empty = v==null || v==='' || (Array.isArray(v) && !v.length);
  if(f.required && empty) return '「'+f.name+'」是必填项，不能清空';
  if(empty) return null;
  if(f.type==='phone'){
    const chk = validatePhone(v);
    if(!chk.ok) return '「'+f.name+'」'+chk.msg;
  }
  if(f.unique){
    const arr = Array.isArray(v) ? v : [String(v)];
    for(const row of t.rows){
      if(row.id === r.id) continue;
      const rv = row.values[f.id];
      const rvArr = Array.isArray(rv) ? rv : (rv==null||rv==='') ? [] : [String(rv)];
      const dup = arr.find(cv=>rvArr.some(x=>String(x)===String(cv)));
      if(dup !== undefined) return '「'+f.name+'」的值「'+dup+'」已存在，不允许重复';
    }
  }
  return null;
}
/* 就地刷新一个单元格（不整表重绘 —— 整表重绘会把"点到别处"的那一次点击弄丢 ✗） */

function startCellEdit(td, tableId, rowId, fieldId){
  if(window.__isMobile) return;                       // 手机/平板：不动
  if(!td || !td.dataset || !td.dataset.fid) return;
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;

function bindThTap(grid){

    let tsX = 0, tsY = 0, moved = false;
    const fireMenu = ()=>{
      const th = el.closest('th');
      const fid = th && th.dataset.fid ? th.dataset.fid : '__no__';
      // 确保菜单打开时不被 document 的 click 立即关掉
      setTimeout(()=>{ openFieldMenu(tableId, fid); }, 0);
    };
    el.addEventListener('touchstart', e=>{
      const t = e.touches[0]; if(!t) return;
      tsX = t.clientX; tsY = t.clientY; moved = false;
    }, {passive:true});
    el.addEventListener('touchmove', e=>{
      const t = e.touches[0]; if(!t) return;
      if(Math.hypot(t.clientX-tsX, t.clientY-tsY) > 10){

      }
    }, {passive:true});
    el.addEventListener('touchend', e=>{
      const t = e.changedTouches[0]; if(!t) return;
      const now = Date.now();
      if(moved){ moved = false; lastX = t.clientX; lastY = t.clientY; return; }  // 拖动/滚动后不弹菜单
      const dx = t.clientX - lastX, dy = t.clientY - lastY;
      if(lastT && now - lastT < 450 && Math.hypot(dx,dy) < 24){
        lastT = 0;
        e.preventDefault();   // 阻止后续 click/scroll 干扰

      }

function loadLinkBarPos(bar){
  try{
    const p = JSON.parse(localStorage.getItem('lighter-db-linkbar')||'null');
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = p && p.w ? Math.min(Math.max(300, p.w), Math.max(300, vw-16)) : Math.min(420, Math.max(300, vw-16));
    const h = p && p.h ? Math.min(Math.max(200, p.h), Math.max(200, vh-48)) : 240;
    const x = p && p.x ? Math.max(8, Math.min(vw-w-8, p.x)) : Math.max(8, (vw-w)/2);
    const y = p && p.y ? Math.max(8, Math.min(vh-h-8, p.y)) : Math.max(8, 72);
    bar.style.left = Math.round(x)+'px'; bar.style.top = Math.round(y)+'px';
    bar.style.width = Math.round(w)+'px'; bar.style.height = Math.round(h)+'px';
  }catch(e){}
}
function saveLinkBarPos(){
  const bar = document.getElementById('link-mode-bar'); if(!bar) return;
  const r = bar.getBoundingClientRect();
  try{ localStorage.setItem('lighter-db-linkbar', JSON.stringify({x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)})); }catch(e){}
}
function makeLinkBarDraggable(bar){
  let lastDragEnd = 0;
  bar.addEventListener('pointerdown', e=>{
    if(e.target.closest('input,textarea,.lm-resize')) return;
    const sx = e.clientX, sy = e.clientY;
    const r = bar.getBoundingClientRect();
    const ox = r.left, oy = r.top;
    let moved = false;
    const move = ev=>{
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.abs(dx)+Math.abs(dy) > 4) moved = true;
      if(moved){
        bar.style.left = Math.max(4, Math.min(window.innerWidth - bar.offsetWidth - 4, ox + dx))+'px';
        bar.style.top = Math.max(4, Math.min(window.innerHeight - bar.offsetHeight - 4, oy + dy))+'px';
      }
    };
    const up = ()=>{
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if(moved){ lastDragEnd = Date.now(); saveLinkBarPos(); }
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
  bar.addEventListener('click', e=>{
    if(Date.now() - lastDragEnd < 250){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function makeLinkBarResizable(bar, handle){
  handle.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation();
    const r = bar.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    const move = ev=>{
      bar.style.width = Math.max(220, Math.min(window.innerWidth - 8, sw + ev.clientX - sx))+'px';
      bar.style.height = Math.max(110, Math.min(window.innerHeight - 8, sh + ev.clientY - sy))+'px';
    };
    const up = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); saveLinkBarPos(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}
function startLinkPick(tableId, rowId, fieldId){
  const t = db.tables.find(x=>x.id===tableId);
  const f = t && t.fields.find(x=>x.id===fieldId);
  if(!f){ toast('字段不存在'); return; }
  if(!t || t.rows.length < 2){ toast('至少需要两条记录才能关联'); return; }
  if(navigator.vibrate && !/HeadlessChrome/.test(navigator.userAgent)) try{ navigator.vibrate(15); }catch(err){}
  const _oldBar = document.getElementById('link-mode-bar'); if(_oldBar) _oldBar.remove();
  linkMode = { tableId, fieldId, anchorId: rowId, picked:[rowId], q:'', xTableId:null };
  const bar = document.createElement('div');
  bar.id = 'link-mode-bar';
  bar.innerHTML = `
    <div class="lm-top">
      <button type="button" id="link-exit" title="退出关联">退出</button>
      <button type="button" id="link-mode-name" class="lm-name-btn" title="点击可切换字段">按「${esc(f.name)}」关联</button>
      <span class="hint">已选 <b id="link-count">1</b> 条</span>
    </div>
    <div class="lm-row2">
      <select id="link-table" class="lm-table" onchange="switchLinkTable(this)" oninput="switchLinkTable(this)" title="选择关联范围"><option value="">本表</option>${db.tables.filter(x=>x.id!==tableId).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <input id="link-search" type="text" placeholder="搜索要关联的记录…（可连续搜索关联）">
      <button type="button" id="link-clear" title="清除该记录全部关联">清空关联</button>
    </div>
    <div id="lm-results" class="lm-results"></div>
    <button type="button" id="link-done">完成关联</button>`;
  bar.querySelector('#link-exit').onclick = ()=>cancelLinkMode();
  bar.querySelector('#link-mode-name').onclick = cycleLinkField;
  bar.querySelector('#link-clear').onclick = clearAnchorLink;
  const li = bar.querySelector('#link-search');
  ['mousedown','touchstart','click'].forEach(ev=>{
    li.addEventListener(ev, e=>e.stopPropagation(), ev==='touchstart'?{passive:true}:false);
  });
  let linkSearchTimer = null;
  li.addEventListener('input', e=>{
    if(!linkMode) return;
    linkMode.q = e.target.value.trim();
    const sel = document.getElementById('link-table');
    if(sel && linkMode.xTableId !== (sel.value||null)) linkMode.xTableId = sel.value||null;
    clearTimeout(linkSearchTimer);
    linkSearchTimer = setTimeout(()=>{ if(linkMode && !linkMode.xTableId) renderGrid(tableId); renderLinkResults(); li.focus(); }, 150);
  });
  bar.querySelector('#link-done').onclick = finishLinkMode;
  const rz = document.createElement('div'); rz.className = 'lm-resize'; rz.title = '拖动调整大小'; bar.appendChild(rz);
  loadLinkBarPos(bar);
  makeLinkBarDraggable(bar);
  makeLinkBarResizable(bar, rz);
  document.body.appendChild(bar);
  requestAnimationFrame(()=> renderGrid(tableId));
  toast(`按「${f.name}」关联：点选记录加入（选中行有高亮），点「完成关联」结束`);
}
function switchLinkTable(sel){
  const m = linkMode; if(!m) return;
  m.xTableId = sel && sel.value ? sel.value : null;
  m.q = '';
  const li = document.getElementById('link-search'); if(li) li.value = '';
  const rl = document.getElementById('lm-results'); if(rl) rl.innerHTML = '';
  if(!m.xTableId) renderGrid(m.tableId);
  renderLinkResults();
}
function renderLinkResults(){
  const m = linkMode; if(!m) return;
  const box = document.getElementById('lm-results'); if(!box) return;
  const xt = db.tables.find(x=>x.id===(m.xTableId||m.tableId)); if(!xt) return;
  const lq = m.q.toLowerCase();
  if(!m.xTableId){
    if(!lq){ box.innerHTML = ''; return; }
    const hits = xt.rows.filter(r=>xt.fields.some(f=>String(rawVal(r,f)||'').toLowerCase().includes(lq)));
    if(!hits.length){ box.innerHTML = '<div class="lm-hit muted">本表无匹配记录</div>'; return; }
    box.innerHTML = hits.slice(0,50).map(r=>{
      const nm = xt.fields[0] ? String(rawVal(r,xt.fields[0])||'').trim() : '';
      const on = m.picked.includes(r.id);
      return `<div class="lm-hit${on?' on':''}" onclick="toggleXLink('${xt.id}','${r.id}',event)"><span class="lm-src">${esc(xt.name)}</span>#${r.no!=null?r.no:''}${nm?(' '+esc(nm)):''}</div>`;
    }).join('');
    return;
  }
  if(!xt.rows.length){ box.innerHTML = `<div class="lm-hit lm-empty">${svg('i-info')} 该表暂无记录，可先到「${esc(xt.name)}」表添加记录</div>`; return; }
  const pool = lq ? xt.rows.filter(r=>xt.fields.some(f=>String(rawVal(r,f)||'').toLowerCase().includes(lq))) : xt.rows;
  if(!pool.length){ box.innerHTML = `<div class="lm-hit muted">表「${esc(xt.name)}」无匹配记录</div>`; return; }
  box.innerHTML = `<div class="lm-tip">共 ${pool.length} 条记录，点击加入关联</div>` + pool.slice(0,50).map(r=>{
    const nm = xt.fields[0] ? String(rawVal(r,xt.fields[0])||'').trim() : '';
    const on = m.picked.some(p=>p && typeof p==='object' && p.t===xt.id && p.r===r.id);
    return `<div class="lm-hit${on?' on':''}" onclick="toggleXLink('${xt.id}','${r.id}',event)"><span class="lm-src">${esc(xt.name)}</span>#${r.no!=null?r.no:''}${nm?(' '+esc(nm)):''}</div>`;
  }).join('');
}
function toggleXLink(xtId, xrId, ev){
  if(ev) ev.stopPropagation();
  const m = linkMode; if(!m) return;
  const idx = m.picked.findIndex(p=>p && typeof p==='object' && p.t===xtId && p.r===xrId);
  if(idx>=0) m.picked.splice(idx,1); else m.picked.push({t:xtId, r:xrId});
  updateLinkCount();
  renderLinkResults();
}
function xGroupNumbers(){
  const m = {};
  (db.xgroups||[]).forEach((g,i)=>{ m[g.id] = i+1; });
  return m;
}
function xFieldName(g){
  for(const t of db.tables){ const f = t.fields.find(x=>x.id===g.fieldId); if(f) return f.name; }
  return '';
}
function showXGroup(tableId, gid, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const g = (db.xgroups||[]).find(x=>x.id===gid); if(!g) return;
  let anchorT = null, anchorGid = null;
  for(const tt of db.tables){
    const mem = g.rows.find(m=>m.t===tt.id); if(!mem) continue;
    const rr = tt.rows.find(x=>x.id===mem.r);
    if(rr && rr.links && (rr.links[g.fieldId] || rr.links.__any__)){ anchorT = tt; anchorGid = rr.links[g.fieldId] || rr.links.__any__; break; }
  }
  renderGroupPanel(tableId, g.fieldId, anchorGid, g, ev, false, anchorT);
}
function unlinkXMember(gid, xt, xr, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const g = (db.xgroups||[]).find(x=>x.id===gid); if(!g) return;
  g.rows = g.rows.filter(m=>!(m.t===xt && m.r===xr));
  if(g.rows.length <= 1) db.xgroups = db.xgroups.filter(x=>x.id!==gid);
  closeGroupPanel();
  save(); render();
  toast('已取消该成员的跨表关联');
}
function dissolveXGroup(gid, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  db.xgroups = (db.xgroups||[]).filter(x=>x.id!==gid);
  closeGroupPanel();
  save(); render();
  toast('该跨表组已解散');
}
function cycleLinkField(){
  const m = linkMode; if(!m) return;
  const t = db.tables.find(x=>x.id===m.tableId); if(!t || !t.fields.length) return;
  const idx = t.fields.findIndex(f=>f.id===m.fieldId);
  const next = t.fields[(idx+1) % t.fields.length];
  m.fieldId = next.id;
  const nm = document.getElementById('link-mode-name');
  if(nm) nm.textContent = '按「'+next.name+'」关联';
  renderGrid(m.tableId);
}
function clearAnchorLink(){
  const m = linkMode; if(!m) return;
  const t = db.tables.find(x=>x.id===m.tableId);
  const r = t && t.rows.find(x=>x.id===m.anchorId);
  if(!r) return;
  const rowId = r.id;
  unlinkRow(m.tableId, rowId);
  cancelLinkMode(false);
  toast('已清除该记录的全部关联');
}
function updateLinkCount(){ const c=document.getElementById('link-count'); if(c) c.textContent=linkMode?linkMode.picked.length:0; }
function finishLinkMode(){
  const m = linkMode; if(!m) return;
  if(!m.picked.length){ toast('请先点选记录'); return; }
  if(m.picked.length < 2){
    toast((m.xTableId || m.picked.some(p=>p && typeof p==='object')) ? '请先在搜索结果中选择要关联的记录' : '至少需要两条记录才能关联');
    return;
  }
  const cross = m.picked.filter(p=>p && typeof p==='object');
  if(cross.length){
    const t = db.tables.find(x=>x.id===m.tableId); if(!t) return;
    const rows = [];
    m.picked.forEach(p=>{
      if(typeof p==='string'){ const r = t.rows.find(x=>x.id===p); if(r) rows.push({t:m.tableId, r:r.id}); }
      else rows.push({t:p.t, r:p.r});
    });
    const gid = uid();
    (db.xgroups = db.xgroups||[]).push({ id:gid, fieldId:m.fieldId, rows });
    const fld = t.fields.find(x=>x.id===m.fieldId);
    const srcRow = t.rows.find(x=>x.id===m.anchorId);
    const srcName = srcRow && t.fields[0] ? (srcRow.values[t.fields[0].id]||'') : '';
    t.updatedAt = Date.now(); save('关联「'+(srcName||'选中记录')+'」'+(fld?'：'+fld.name:''));
    if(m.q) uiFor(m.tableId).q = '';
    linkMode = null;
    const b = document.getElementById('link-mode-bar'); if(b) b.remove();
    const d = document.getElementById('link-done'); if(d) d.remove();
    render();
    toast(`已关联 ${rows.length} 条记录（含跨表 ${cross.length} 条）`);
    return;
  }
  const t = db.tables.find(x=>x.id===m.tableId); if(!t) return;
  let gid = null;
  for(const rid of m.picked){
    const r = t.rows.find(x=>x.id===rid);
    if(r && r.links){ gid = r.links[m.fieldId] || r.links.__any__ || null; }
    if(gid) break;
  }
  if(!gid) gid = uid();
  let n = 0;
  for(const rid of m.picked){
    const r = t.rows.find(x=>x.id===rid);
    if(!r) continue;
    if(!r.links) r.links = {};
    if(r.links.__any__ && m.fieldId!=='__any__'){ r.links[m.fieldId] = r.links.__any__; }
    r.links[m.fieldId] = gid;
    n++;
  }
  t.updatedAt = Date.now(); save();
  const keepQ = m.q;
  if(keepQ) uiFor(m.tableId).q = keepQ;
  linkMode = null;
  const b = document.getElementById('link-mode-bar'); if(b) b.remove();
  const d = document.getElementById('link-done'); if(d) d.remove();
  renderTable(t);
  toast(`已关联 ${n} 条记录${keepQ ? '，表格保持显示搜索的记录' : ''}`);
}
function cancelLinkMode(show=true){
  const m = linkMode;
  linkMode = null;
  const b = document.getElementById('link-mode-bar'); if(b) b.remove();
  const d = document.getElementById('link-done'); if(d) d.remove();
  if(m){
    const t = db.tables.find(x=>x.id===m.tableId);
    if(t){ if(m.q) uiFor(m.tableId).q = ''; renderTable(t); }
  }
  if(show) toast('已退出关联');
}
function unlinkRow(tableId, rowId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const r = t.rows.find(x=>x.id===rowId); if(!r || !r.links) return;
  const groups = Object.keys(r.links).map(fid=>({ fid, gid: r.links[fid] }));
  r.links = {};
  groups.forEach(g=>{
    if(!g.gid) return;
    t.rows.forEach(x=>{
      if(x===r || !x.links) return;
      if(x.links[g.fid]===g.gid || (x.links[g.fid]==null && x.links.__any__===g.gid)){
        if(x.links[g.fid]===g.gid) delete x.links[g.fid];
        else if(x.links.__any__===g.gid) delete x.links.__any__;
        if(x.links && !Object.keys(x.links).length) x.links = {};
      }
    });
  });
  (db.xgroups = db.xgroups||[]).forEach(g=>{ g.rows = g.rows.filter(m=>!(m.t===tableId && m.r===rowId)); });
  db.xgroups = db.xgroups.filter(g=>g.rows.length>1);
  closeLinkPanel();
  const rn = r.values && t.fields[0] ? (r.values[t.fields[0].id]||'') : '';
  t.updatedAt = Date.now(); save('取消关联「'+(rn||'未命名')+'」');
  renderTable(t);
  toast('已取消该记录的全部关联');
}
document.addEventListener('click', e=>{
  if(linkMode){
    if(suppressLinkCancel){ return; }
    const tr = e.target.closest('#grid tbody tr');
    if(tr){
      const rid = tr.dataset.rid;
      const t = db.tables.find(x=>x.id===linkMode.tableId);
      const a = t && t.rows.find(x=>x.id===linkMode.anchorId);
      const b = t && t.rows.find(x=>x.id===rid);
      if(t && a && b && a!==b){
        const gOf = x => (x.links && (x.links[linkMode.fieldId] || x.links.__any__)) || null;
        const ga = gOf(a), gb = gOf(b);
        if(ga && gb && ga!==gb){
          toast('该记录已属于另一关联组，不能与不同组的记录关联');
          return;
        }
      }
      if(!linkMode.picked.includes(rid)) linkMode.picked.push(rid);
      else linkMode.picked = linkMode.picked.filter(x=>x!==rid);
      updateLinkCount();
      tr.classList.toggle('link-picked');
      return;
    }
    if(!e.target.closest('#link-done') && !e.target.closest('#link-mode-bar')) cancelLinkMode();
  }
  if(!e.target.closest('#link-panel') && !e.target.closest('#link-mode-bar') && !e.target.closest('#link-done')) closeLinkPanel();
  if(!e.target.closest('#group-panel')) closeGroupPanel();
});
function bindTablePan(scroller){
  if(!scroller || scroller._panBound) return;
  scroller._panBound = true;
  let sx=0, sy=0, sl=0, st=0, active=false, samples=[];
  scroller.addEventListener('touchstart', e=>{
    if(e.target.closest('input,select,textarea,button,a,.vline,.row-resizer')) return;
    active = true;
    samples = [];
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    sl = scroller.scrollLeft; st = scroller.scrollTop;
  }, {passive:true});
  scroller.addEventListener('touchmove', e=>{
    if(!active) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    const now = performance.now();
    samples.push({ t:now, l:scroller.scrollLeft, s:scroller.scrollTop });
    if(samples.length>6) samples.shift();
    if(Math.abs(dx) > Math.abs(dy) && scroller.scrollWidth > scroller.clientWidth + 4){
      scroller.scrollLeft = sl - dx;
      e.preventDefault();
    }else if(Math.abs(dy) > Math.abs(dx) && scroller.scrollHeight > scroller.clientHeight + 4){
      scroller.scrollTop = st - dy;
      e.preventDefault();
    }
  }, {passive:false});
  const end = ()=>{
    active = false;
    if(samples.length>=2){
      const a = samples[0], b = samples[samples.length-1];
      const dt = b.t - a.t;
      if(dt>12){
        const vx = (b.l - a.l)/dt, vy = (b.s - a.s)/dt;
        if(Math.abs(vx)>0.35 || Math.abs(vy)>0.35) inertiaScroll(scroller, vx, vy);
      }
    }
    samples = [];
  };
  scroller.addEventListener('touchend', end);
  scroller.addEventListener('touchcancel', end);
}
function bindPageDbl(){
  if(document._dblBound) return;
  document._dblBound = true;
  let lastTap = 0, lx = 0, ly = 0;
  const jump = clientY=>{
    const sc = document.querySelector('#grid .table-scroll');
    if(!sc) return;
    const H = window.innerHeight;
    if(clientY < H*0.3) scrollGridTo('top');
    else if(clientY > H*0.7) scrollGridTo('bottom');
  };
  const okD = e => !e.target.closest('thead,tr,td,button,a,input,select,textarea,.bar-menu-wrap,#sidebar');
  document.addEventListener('dblclick', e=>{
    if(!okD(e)) return;
    jump(e.clientY);
  });
  const okT = e => !e.target.closest('thead,tr,td,button,a,input,select,textarea');
  document.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0]; if(!t) return;
    const now = Date.now();
    if(now - lastTap < 300 && Math.hypot(t.clientX-lx, t.clientY-ly) < 24){
      lastTap = 0;
      if(!okT(e)) return;
      e.preventDefault();
      jump(t.clientY);
      return;
    }
    lastTap = now; lx = t.clientX; ly = t.clientY;
  }, {passive:false});
}
function inertiaScroll(sc, vx, vy){
  let raf = null;
  const step = ()=>{
    vx *= 0.93; vy *= 0.93;
    const maxL = Math.max(0, sc.scrollWidth - sc.clientWidth);
    const maxT = Math.max(0, sc.scrollHeight - sc.clientHeight);
    let nl = sc.scrollLeft + vx*16, nt = sc.scrollTop + vy*16;
    if(nl<0 || nl>maxL){ vx = 0; nl = Math.max(0, Math.min(nl, maxL)); }
    if(nt<0 || nt>maxT){ vy = 0; nt = Math.max(0, Math.min(nt, maxT)); }
    sc.scrollLeft = nl; sc.scrollTop = nt;
    if(Math.abs(vx)>0.05 || Math.abs(vy)>0.05) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function setSort(tableId, fieldId, dir){
  const u = uiFor(tableId);
  if(dir==='none'){ delete u.sort; }
  else if(dir){ u.sort = { fieldId, dir }; }
  else{
    if(u.sort && u.sort.fieldId===fieldId) u.sort.dir = u.sort.dir==='asc'?'desc':'asc';
    else u.sort = { fieldId, dir:'asc' };
  }
  closeFieldMenu();
  renderGrid(tableId);
}
function setColFilter(tableId, fieldId, v){
  const u = uiFor(tableId);
  u.col[fieldId] = v;
  renderGrid(tableId);
  const m = document.getElementById('field-menu');
  if(m && m._fid===fieldId){
    positionFieldMenu(m);
    const clearBtn = m.querySelector('.fm-clear');
    if(clearBtn) clearBtn.style.display = (v!=='' && v!=null) ? '' : 'none';
  }
}
function fmtNum(n){ if(n==null||isNaN(n)) return '0'; const a=Math.abs(n); if(a>=1e8) return (n/1e8).toFixed(2)+'亿'; if(a>=1e4) return (n/1e4).toFixed(2)+'万'; return String(Math.round(n*100)/100); }
// 纯文本版货币格式（预览/打印/PDF 用）：负数「红色」格式在 fmtMoney 里会返回 <span>，
// 那些场景会再做一次 esc()，直接暴露 HTML 源码，所以这里只返回文本。
function fmtMoneyText(v, f){
  if(v==null || v==='' || isNaN(Number(v))) return '';
  const n = Number(v);
  const sym = (f && f.curSym) || '¥';
  const dec = (f && f.curDec !== undefined && f.curDec !== null && f.curDec !== '') ? Number(f.curDec) : 2;
  const negFmt = (f && f.curNeg) || 'minus';
  const body = sym + Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  if(n >= 0) return body;
  return negFmt === 'paren' ? '(' + body + ')' : '-' + body;
}
function fmtMoney(v, f){
  if(v==null || v==='' || isNaN(Number(v))) return '';
  const n = Number(v);
  const sym = (f && f.curSym) || '¥';
  const dec = (f && f.curDec !== undefined && f.curDec !== null && f.curDec !== '') ? Number(f.curDec) : 2;
  const negFmt = (f && f.curNeg) || 'minus';
  const neg = n < 0;
  const body = sym + Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits: dec, maximumFractionDigits: dec});
  if(!neg) return body;
  if(negFmt === 'paren') return '(' + body + ')';
  if(negFmt === 'red') return '<span style="color:#d33">-' + body + '</span>';
  return '-' + body;
}

function makeFieldMenuDraggable(menu){
  if(menu._dragBound) return; menu._dragBound = true;
  const exCls = 'button,input,select,textarea,a,.fm-sort,.fm-btn,.fm-clear,.fm-ctl';
  menu.addEventListener('pointerdown', e=>{
    if(e.target.closest(exCls)) return;
    const sx = e.clientX, sy = e.clientY;
    const r = menu.getBoundingClientRect();
    const ox = r.left, oy = r.top;
    let moved = false;
    const move = ev=>{
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.abs(dx)+Math.abs(dy) > 4) moved = true;
      if(moved){
        if(menu.style.touchAction !== 'none') menu.style.touchAction = 'none';
        menu.style.left = Math.max(4, Math.min(window.innerWidth - menu.offsetWidth - 4, ox + dx))+'px';
        menu.style.top = Math.max(4, Math.min(window.innerHeight - menu.offsetHeight - 4, oy + dy))+'px';
      }
    };
    const up = ()=>{
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if(moved){
        menu.style.touchAction = '';
        menu._dragged = true;
        try{ localStorage.setItem('lighter-db-float-field-menu', JSON.stringify({x:Math.round(menu.getBoundingClientRect().left), y:Math.round(menu.getBoundingClientRect().top)})); }catch(err){}
      }
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
  // 恢复上次拖动后的位置（若保存过）
  try{
    const p = JSON.parse(localStorage.getItem('lighter-db-float-field-menu')||'null');
    if(p && p.x!=null && p.y!=null){
      menu._dragged = true;
      menu.style.left = Math.max(4, Math.min(window.innerWidth - 60, p.x))+'px';
      menu.style.top = Math.max(4, Math.min(window.innerHeight - 60, p.y))+'px';
    }
  }catch(err){}
}

function restoreTrashRow(trashId, rowId){

}
function restoreTrashItem(trashId){
  const it = (db.trash||[]).find(x=>x.id===trashId); if(!it) return;
  let t = db.tables.find(x=>x.id===it.tableId);
  if(!t){
    // Whole-table trash entry: rebuild the table from its saved structure.
    if(it.fields && it.fields.length){
      t = { id: it.tableId, name: it.tableName, fields: it.fields, rows: [], view: it.view || {}, updatedAt: Date.now(), folderId: it.folderId || null, bookId: it.bookId || '' };
      db.tables.push(t);
    }else{
      toast('原数据表已删除，无法恢复'); return;
    }
  }
  t.rows.push(...it.rows);
  renumberTable(t); t.updatedAt = Date.now();
  db.trash = db.trash.filter(x=>x.id!==trashId);
  save(); render(); toast('已恢复 '+it.rows.length+' 条到「'+t.name+'」');
}

// 日期/时间字段勾了「默认当前时间」时，新建记录用当前时刻预填。
// 用本地时间手工拼串，不能用 toISOString()（那是 UTC，会差几个小时）。
function nowForType(type){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const D = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  const T = p(d.getHours()) + ':' + p(d.getMinutes());
  if(type === 'date') return D;
  if(type === 'time') return T;
  if(type === 'datetime' || type === 'book') return D + 'T' + T;
  return '';
}

  document.querySelectorAll('#modal-root [data-fid]').forEach(el=>{
    if(el.dataset.fx === '1') return;
    const fid = el.dataset.fid;
    if(fid) tmp.values[fid] = el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value;

  cur.forEach(f=>{
    const el = document.querySelector('#modal-root [data-fid="' + f.id + '"]');
    if(el && el.dataset.fx === '1') el.value = fmtFormula(formulaValue(tmp, f, t), f);

}

function bindRecordNav(modal, t){
  if(!modal) return;
  const items = [...modal.querySelectorAll('.field-item')];
  const focusNext = cur=>{
    let found = false;
    for(const it of items){
      if(found){
        const inp = it.querySelector('input:not([type=checkbox]):not([type=hidden]),select,textarea');
        if(inp){ inp.focus(); if(inp.select) inp.select(); }
        return;
      }
      if(it === cur) found = true;
    }
  };
  items.forEach(it=>{
    const fid = it.dataset.vfid;
    const f = fid ? t.fields.find(x=>x.id===fid) : null;
    if(!f) return;
    if(f.type==='select'){
      it.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change', ()=>{ if(cb.checked) focusNext(it); });
      });
      return;
    }
    const inp = it.querySelector('input:not([type=checkbox]):not([type=hidden]),select,textarea');
    if(!inp) return;
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); focusNext(it); }
    });
  });
}

    // 原来会被当成拖动而放弃关闭，这就是"X 时好时坏"的原因。这里放宽到 28px。

    if(dragged){ pop._lastDragged = true; return; }

    if(moved > 8){ pop._lastDragged = true; return; }

    }
  };
  pop.addEventListener('pointerup', upDrag);
  pop.addEventListener('pointercancel', endPopDrag);
  pop.addEventListener('click', e=>{
    if(pop._lastDragged){ pop._lastDragged = false; return; }
    if(pop._tapHandled){ pop._tapHandled = false; return; }
    if(pop._downOnClose){ closeLastRecPop(); return; }
    if(e.target.closest && e.target.closest('.last-rec-body')){ closeLastRecPop(); quickEditLast(t.id, lastRow.id); }
  });
}

function smartBoxText(box){

  //    而安卓输入法会整段改写，一改就快照对不上 → 旧文字全部显形、识别从第一条开始 ✗

  //    保存后刚挂上罩时框是空的，若这次调用就把罩摘了，随后重播进来的旧文字
  //    又会被当成新内容去识别、重新填表、再存一遍 ✗
  if(!raw) return '';
  if(raw === snap) return '';                       // 还是旧文字：当作空
  const nSnap0 = normSmartText(snap);
  const i = raw.indexOf(snap);

    const tail = raw.slice(snap.length);            // 接在旧文字后面的部分
    const nTail = normSmartText(tail);

    //    `陈家炳，回车。`（刚保存那段的尾巴）接在后面插回来 → 被当成新记录又存一条 ✗
    if(nTail && nTail.length >= 3 && nSnap0.length > nTail.length && nSnap0.slice(-nTail.length) === nTail){
      vlog('识别框：新增部分其实是刚保存那段的尾巴 → 继续隐藏（重播）');
      return '';
    }
    return tail;                                    // 新文字接在旧文字后面（iOS 听写就是这种）

  const nSnap = normSmartText(snap), nRaw = normSmartText(raw);

  //    真机实证（v2026-10-13.4，23:47.180）：保存「…姓名，陈家炳。回车」后 0.85 秒，
  //    识别器只把尾巴 `陈家炳，回车。` 插回来 → 被当成新记录存了一条**又残缺又重复**的 ✗
  //    （原来只判"进来的文字里含快照"和"编辑距离"，都抓不到这种"只回一小截"的情形）
  if(nSnap && nRaw && nRaw.length >= 3 && nSnap.length > nRaw.length && nSnap.slice(-nRaw.length) === nRaw){
    vlog('识别框：是刚保存那段的**尾巴** → 继续隐藏（重播）');
    return '';
  }
  if(nSnap && nRaw.indexOf(nSnap) >= 0){
    box._clearedSnapshot = raw;          // 快照跟着更新成"被重写后的旧文字"，后续追加仍能识别 ✓
    vlog('识别框：内容被重写，继续隐藏（' + raw.length + ' 字）');
    return '';

  box._pendingClear = false; box._clearedSnapshot = null;   // 旧文字被新内容替换了

}

/* ── 说一次「回车」只能保存一次（防重复保存）──────────────────────────────

   但语音识别可能在极短时间内**回调两次**（识别器把"回车"重复识别一次；或者语音键盘被中断后

          //    而重启合成 → **听写直接断掉**（真机 2026-10-20：说了回车只得到"。"，框清空 + 语音停止）。
          //    现在把话留在框里，用户可以直接接着说 ✓
          toast('没有识别到内容，已跳过（要强制保存请点「添加记录」）');
          enterGateClear();               // 这次没保存，放开闸门 —— 别让"空回车"挡住紧接着的正常回车
          return;
        }
        smartNoteHandled(box, handledText);           // 记下"这批已处理"（要在清空之前取）
        clearInputKeepVoice(box);
        box._tailUntil = Date.now() + 1500;           // 保存后听写尾巴常会带一个句号过来，自动清掉
        box._clearAt = Date.now();
        // ⚠️ 这里**没有**"内容与刚保存的那条一样就跳过"的判断 ✗ ——
        //    表单签名只包含"被自动识别到的字段"，如果表里只有姓名字段能被识别，
        //    那么"张三 买书 / 张三 买笔"两条的签名**完全一样** → 第二条会被误杀，
        //    用户看到的就是「说回车没反应」✗。
        //    重复录入由另外两层负责：① 单条完全重播 → 隐藏罩（smartBoxText 返回空）；
        //    ② 整段多条重播 → smartIsReplay(box, 2)。
        setTimeout(()=>{
          const saved = saveRecord(tid, form.dataset.rowid || '');
          // 真存下来了才落冷却（enterGateDone）；被校验拦下或判定成重复 → 放开闸门，
          // 否则用户补完必填项再按回车会被当成重复丢掉 ✗
          if(saved === true){
            enterGateDone(tid, uid);
            smartRememberSaved(tid, sigNow);
            smartRememberSavedText(tid, rawBefore);   // 记下本会话已保存过的原文（防"较早某条被重播"）
            // ⭐ 关键：保存成功后立刻给识别框挂"隐藏罩" —— 停止听写时 iOS 会把刚保存的这段
            //    重新提交一遍，不盖住的话它会被自动识别**重新填进表单**、下一次又存一遍 ✗
            smartArmSavedEcho(tid, rawBefore);
            // ⭐ 每录满 N 条**真清空**一次识别框（默认 5，可在「更多 → 自动清空」里改/关）
            //    安卓输入法会把整段文字一直攒着（实测到 170 字），框越长越容易出
            //    "隐藏失效 / 识别从第一条开始认"的问题；趁刚存完这一条、状态最干净时归零 ✓
            //    ⚠️ **只在安卓上做** ✗ —— iPhone 的防重复逻辑依赖"框里累积着前几条"，
            //    中途硬清空会打乱它（实测 `db-voice-replay4` 13 条丢 2 条）。
            const _every = window.__isAndroid ? autoClearEvery() : 0;
            if(_every > 0){
              box._savedCount = (box._savedCount || 0) + 1;
              if(box._savedCount >= _every){
                box._savedCount = 0;
                try{ hardClearInput(box); }catch(e){}
                vlog('自动清空：已录满 ' + _every + ' 条 → 真清空识别框');
              }
            }
            // ⭐ 把"这条记录当时的原始文字"冻结下来（重播修订前版本时要用它比对），ring 清空给下一条
            _histFrozen.unshift(_histRing.slice(-20));
            _histFrozen = _histFrozen.slice(0, 3);
            _histRing = [];
            // ⭐ 把"这次实际写进去的字段值"记进日志 —— 用户报"存出一条空记录"时，
            //    光看"待识别=…"猜不出到底哪几个字段有值，这一行能直接给出答案 ✓
            try{
              const _t = db.tables.find(x=>x.id===tid);
              const _row = _t && _t.rows[_t.rows.length-1];
              if(_row) vlog('已保存记录：' + vlogText(JSON.stringify(_row.values || {})));
            }catch(e){}
          }
          else enterGateClear();
        }, 200);
        return;
      }
    }
    syncSmartMirror();                              // 新说的内容实时显示在镜像层上
    box._t = setTimeout(()=>{
      // ⚠️ 识别框已经被换掉（保存后弹窗重建）→ 这个定时器是**过期的**，必须丢弃 ✗
      //    否则它的 form 指向旧弹窗（dataset 还在），runSmartFill 会去读**当前**的识别框，
      //    把"停止听写重播进来的旧文字"重新填进表单 → 下次保存又存一遍 ✗
      if(!box.isConnected || document.getElementById('smart-input') !== box) return;
      const form = box.closest('.rec-modal');
      if(!form || !form.dataset.table) return;
      // ⭐ 刚保存完，框里这段又跟"刚保存的那批"高度相似 → 多半是停止听写时的重播，
      //    别自动识别 —— 否则会把刚存过的记录**重新填回表单**，下一次保存就又存一遍 ✗
      //    （只压"自动识别"这一步；用户真要说一条很像的新记录，说「回车」照样能存）
      if(smartIsReplay(box) || smartIsSavedEcho(normSmartText(smartBoxText(box)))){
        vlog('自动识别：这批是已保存过/刚保存过的内容 → 跳过自动填入（防重播）');
        return;
      }
      runSmartFill(form.dataset.table);
    }, 750);
  });
  // 焦点离开识别框 = 听写肯定结束了 → 这时才把旧文字真正抹掉
  box.addEventListener('focusout', ()=>{
    vlog('识别框失焦 → 硬清空');
    if(!box.isConnected) return;          // 已被换掉（弹窗重建）→ 别再去解析当前那个框 ✗
    if(box._pendingClear){
      // 先把还没解析的最后一句解析掉（否则最后说的内容会丢），再清
      try{
        const form = box.closest('.rec-modal');
        const t = smartBoxText(box);
        // ⭐ 这里也必须防重播 ✗ —— 停止听写/弹窗重建都会让识别框失焦，
        //    此时框里若是"刚保存过的那批"（重播），绝不能再去识别一遍，
        //    否则刚存的记录会被重新填回表单、下一次保存又存一遍 ✗
        if(form && form.dataset.table && t.trim() && !smartIsReplay(box) && !smartIsSavedEcho(normSmartText(t))){
          runSmartFill(form.dataset.table);
        } else if(t.trim()){
          vlog('失焦解析：这批是已保存过/刚保存过的内容 → 跳过（防重播）');
        }
      }catch(e){}
      hardClearInput(box);
    }
  });
  // 手动拖大识别框之后，镜像层要跟着对齐
  wrapUpSmartMirror(box);
  // 语音日志：记下关键事件，真机上"语音为什么停"就一目了然
  ['focus','blur','beforeinput','compositionstart','compositionend'].forEach(t=>{
    box.addEventListener(t, e=>{
      let extra = '';
      if(t === 'beforeinput'){
        // ⭐ 关键：记下"这次要插入什么内容"（e.data）—— 停止听写时的整段重播会在这里现形
        extra = '（' + ((e && e.inputType) || '?') + '）';
        if(e && e.data != null){
          extra += ' data=' + vlogText(e.data);
          // ⭐ 记下这次插入的规模：用户说话是**逐字**插入（1~2 字），
          //    识别器"整段重写"是**一次性插一大块**（真机日志：data=len=123 / len=152）
          try{ box._lastInsLen = String(e.data).length; }catch(err){}
        }
      }
      if(t === 'focus' || t === 'blur'){
        extra += ' 框里=' + vlogText(box.value);
      }
      if(t === 'blur'){
        const a = document.activeElement;
        extra += '（焦点转到 ' + (a ? (a.id ? '#'+a.id : a.tagName) : '空') + '）';
      }
      vlog(t + extra);
    });
  });
  // Enter = save record, clear smart box completely
  box.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      clearTimeout(box._t);
      const form = box.closest('.rec-modal');
      if(!form || !form.dataset.table) return;
      const tid = form.dataset.table;
      const rid = form.dataset.rowid || '';
      // 同一个防重闸门：语音键盘/系统偶尔会把一次回车派发两次（keydown 重复），
      // 短时间内的第二次直接丢弃，避免存出两条记录 ✗
      const uid = box._uid || (box._uid = 'sb' + Math.random().toString(36).slice(2));
      if(!enterGate(tid, uid)) return;
      // ⭐ 必须**先把框里的文字识别进表单，再清空** ✗（原来是先无条件 `box.value=''` 再 saveRecord）
      //    老逻辑靠的是"750ms 防抖已经把表单填好了"，可上面那句 `clearTimeout(box._t)`
      //    正好把还没跑完的防抖**取消**掉 —— 于是"说完马上按回车"时：文字被清空、表单还是空的
      //    → 什么都没存、框也空了（安卓输入法整句提交时最容易踩；真机 2026-10-20 反馈）✗
      //    「回车」两个字是指令不是数据，识别前先去掉；已保存内容的重播不要往里填（防重复）。
      const _rawTxt = smartBoxText(box);
      const _txt = String(_rawTxt || '').replace(/回车/g, ' ').trim();
      if(_txt && !smartIsReplay(box, 2) && !smartIsSavedEcho(normSmartText(_rawTxt))){
        runSmartFill(tid, _txt);
      }
      box.value = '';
      if(window.__isAndroid){ _andConsumed = 0; }   // 安卓：框被清空，回车计数归零（已存段要保留，防重播）
      const saved = saveRecord(tid, rid);
      if(saved === true) enterGateDone(tid, uid); else enterGateClear();
    }
  });
}
function showAlert(msg){
  // Create alert as a separate overlay on top of existing modal, don't replace it
  let ov = document.getElementById('alert-overlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'alert-overlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)';
    document.body.appendChild(ov);
  }
  ov.innerHTML = '<div style="background:var(--panel);border-radius:14px;padding:20px 18px;width:280px;max-width:85vw;box-shadow:0 8px 30px rgba(0,0,0,.2)">'+
    '<div style="font-weight:600;margin-bottom:10px;font-size:15px">提示</div>'+
    '<p style="margin:0 0 16px;font-size:14px;color:var(--text)">'+esc(msg)+'</p>'+
    '<button class="btn primary" style="width:100%" onclick="document.getElementById(\'alert-overlay\').remove()">我知道了</button>'+
    '</div>';
  ov.onclick = function(e){ if(e.target===ov) ov.remove(); };
}
/* 连续录入时"原地重置"记录表单：**不关弹窗、不重建识别框**。
   为什么不能 closeModal() + openRecordModal()：那会把识别框这个 DOM 元素整个换掉 ——
   手机键盘会收起、正在进行的语音听写也会跟着断 ✗。原地重置则弹窗/键盘/听写全都保持 ✓。
   只用于"新建记录"弹窗：编辑弹窗的标题、按钮、提交参数都不一样，不能就地改。 */
function voiceContinueOn(){ try{ return localStorage.getItem('lighter-db-opt-voicecont') !== '0'; }catch(e){ return true; } }
function resetRecordModalInPlace(tableId){
  const t = db.tables.find(x=>x.id===tableId);
  const m = document.querySelector('#modal-root .modal.rec-modal');
  if(!t || !m || !m.querySelector('#smart-input')) return false;
  if(m.querySelector('#rec-opt-editcont')) return false;
  clearSmartForm(tableId);                                  // 字段回到默认值（含"默认当前时间"）
  refreshFormulaCells(tableId);
  const si = document.getElementById('smart-input');
  if(si){ clearInputKeepVoice(si); si.dataset.filled = '1'; }   // 按「清空方式」清，尽量不打断听写
  markRecordBase(tableId);                                      // 重置后重记基线（否则下一次「回车」会被误判成"有改动"）
  if(localStorage.getItem('lighter-db-opt-showlast') !== '0'){
    if(t.rows.length) showLastRecPop(t, t.rows[t.rows.length-1]); else closeLastRecPop();
  }else closeLastRecPop();
  return true;
}
function saveRecord(tableId, rowId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  /* 兜底防重：saveRecord 是"真正往表里塞一行"的唯一出口，所以这里再拦一道 ——
     任何调用路径（语音「回车」、实体回车键、表单 onsubmit）在极短时间内重复触发，都只保存一次。
     用"同表 + 50ms 内"作为判据：正常人不可能在 50ms 内真的提交两条不同记录，
     而重复派发一定落在这个窗口内。 */
  const _srNow = Date.now();
  if(_srLast && _srLast.tableId === tableId && _srNow - _srLast.at < 50){
    vlog && vlog('saveRecord 重复调用（' + (_srNow - _srLast.at) + 'ms 内）→ 已忽略');
    return 'dup';
  }
  _srLast = { tableId:tableId, at:_srNow };
  // check required fields
  // 校验失败要放开去重记录，否则用户补好必填项后再按回车会被当成"重复"丢掉 ✗
  const _bail = ()=>{ _srLast = null; return false; };
  for(const f of t.fields){
    if(!f.required) continue;
    const el = document.querySelector(`#modal-root [data-fid="${f.id}"]`);
    if(!el) continue;
    let empty = false;
    if(f.type==='bool'){ empty = !el.checked; }
    else if(f.type==='select'){ empty = el.querySelectorAll('input:checked').length === 0; }
    else { empty = !el.value || !el.value.trim(); }
    if(empty){
      showAlert('「'+f.name+'」是必填项，请填写后再保存');
      el.focus(); return _bail();
    }
  }
  const values = {};
  for(const f of t.fields){
    const el = document.querySelector(`#modal-root [data-fid="${f.id}"]`);
    if(!el){ values[f.id] = null; continue; }
    // Check unique/禁止重复 (select fields render a div.msel, not an input, so
    // collect the checked option values; array-valued fields are compared item-wise)
    if(f.unique){
      let cvs = [];
      if(f.type==='select'){ cvs = [...el.querySelectorAll('input:checked')].map(c=>c.value); }
      else if(f.type==='bool'){ cvs = el.checked ? ['true'] : []; }
      else { const v = el.value ? el.value.trim() : ''; if(v) cvs = [v]; }
      if(cvs.length){
        for(const row of t.rows){
          if(rowId && row.id === rowId) continue;
          const rv = row.values[f.id];
          const rvArr = Array.isArray(rv) ? rv : (rv==null || rv==='') ? [] : [String(rv)];
          const dup = cvs.find(cv=>rvArr.some(r=>String(r)===cv));
          if(dup !== undefined){
            showAlert('「'+f.name+'」的值「'+dup+'」已存在，不允许重复');
            el.focus(); return _bail();
          }
        }
      }
    }
    if(f.type==='bool'){ values[f.id] = el.checked ? 'true':'false'; continue; }
    if(f.type==='select'){ values[f.id] = [...el.querySelectorAll('input:checked')].map(c=>c.value); continue; }
    let v = el.value.trim();
    if(f.type==='number'||f.type==='money'){
      if(v===''){ values[f.id] = null; continue; }
      v = Number(v);
      if(isNaN(v)){ toast('「'+f.name+'」需要是数字'); return _bail(); }
      values[f.id] = v;
    }else if(f.type==='tags'){
      values[f.id] = v ? v.split(/[,，]/).map(s=>s.trim()).filter(Boolean) : [];
    }else if(f.type==='date' || f.type==='time' || f.type==='datetime'){
      // 留空就保持为空：不再自动填「今天」，否则非必填日期字段永远存不了空值
      if(v===''){ values[f.id] = ''; continue; }
      values[f.id] = (f.type==='datetime') ? v.replace('T',' ') : v;
    }else if(f.type==='phone'){
      if(v===''){ values[f.id] = ''; continue; }
      const chk = validatePhone(v);
      if(!chk.ok){ checkPhone(el); toast('「'+f.name+'」'+chk.msg); el.focus(); return _bail(); }
      values[f.id] = v;
    }else{
      values[f.id] = v;
    }
  }
  // ⭐ 全空的新记录不保存 ✗ ——
  //    实体回车键那条路径（`box.addEventListener('keydown')`）**完全没有"有没有内容"的判断**，
  //    表单是空的时候照样 `saveRecord()` → 存出一条**完全没有信息**的记录 ✗
  //    （用户报："最后一条是自动填进去的空记录"）
  //    放在 saveRecord 里做 → 语音回车 / 实体回车 / 表单提交**所有路径一次性覆盖** ✓
  //    注：只拦"新建"（编辑时允许把字段清空后保存）；有默认值的字段（如"默认当前时间"）
  //    不算空，所以带默认值的表行为不变 ✓
  if(!rowId){
    const _blankVal = v => v == null
      || (typeof v === 'string' && (v.trim() === '' || v === 'false'))   // 空串 / 未勾选的 bool
      || (Array.isArray(v) && v.length === 0);                           // 空的选项/标签
    if(Object.keys(values).every(k => _blankVal(values[k]))){
      vlog && vlog('saveRecord：所有字段都是空的 → 不保存（避免存出空记录）');
      toast('没有内容可保存');
      return _bail();
    }
  }
  if(rowId){
    const row = t.rows.find(r=>r.id===rowId);
    if(row){ row.values = values; }
  }else{
    t.rows.push({ id: uid(), no: nextNo(t), values });
  }
  t.updatedAt = Date.now();
  save();
  // 记录已真正落盘 —— 「回车」闸门的冷却/复位由调用方(enterGateDone)负责
  const wasEdit = !!rowId;
  const cont = wasEdit ? localStorage.getItem('lighter-db-opt-editcont') !== '0' : localStorage.getItem('lighter-db-opt-continue') !== '0';  // 保存后是否自动进入下一条
  // 连续录入（新建）：**原地重置**表单，不关弹窗、不重建识别框 ——
  // 重建会把识别框换掉，手机键盘会收起、正在进行的语音听写也会断 ✗。
  if(!wasEdit && cont && voiceContinueOn() && resetRecordModalInPlace(tableId)){
    setTimeout(()=>{ try{ renderTable(t); }catch(e){} }, 30);   // 表格照常刷新，但挪出这一轮事件，别扰动听写
    toast('已添加 1 条记录，可继续录入（键盘/语音不会断）');
    return true;
  }
  // Capture the VISUAL ANCHOR before closing: the anchor is where the modal sat before any keyboard pushed it up,
  // so the next record reopens at the same on-screen position even if the keyboard had shoved the modal to the top.
  const _oldModal = document.querySelector('#modal-root .modal');
  const _oldOff = window.visualViewport ? (window.visualViewport.offsetTop || 0) : 0;
  const _oldAnchor = (_oldModal && _oldModal._vvAnchor !== undefined) ? _oldModal._vvAnchor : (_oldModal ? (_oldModal.getBoundingClientRect().top - _oldOff) : null);
  const _oldLeft = _oldModal ? _oldModal.getBoundingClientRect().left : null;
  closeModal();
  renderTable(t); // 只重绘当前表，避免整页 render() 按 hash 切走视图
  if(!cont) return true;
  openRecordModal(tableId, '');
  if(_oldAnchor != null){
    const nm = document.querySelector('#modal-root .modal');
    if(nm){
      const _curOff = window.visualViewport ? (window.visualViewport.offsetTop || 0) : 0;
      if(_oldLeft != null) nm.style.left = _oldLeft+'px';
      nm.style.top = (_oldAnchor + _curOff)+'px';
      nm.style.right = 'auto'; nm.style.bottom = 'auto'; nm.style.transform = 'none';
    }
  }
  // 火狐键盘弹出时会自动滚动到识别框并把弹窗挤压，保存后不自动聚焦识别框；其他浏览器正常聚焦便于连续录入
  if(!/Firefox/i.test(navigator.userAgent)){
    const si = document.getElementById('smart-input');
    if(si){ si.focus({preventScroll:true}); }
  }
  toast(wasEdit ? '已保存修改，可继续录入新记录' : '已添加 1 条记录，可继续录入');
  return true;
}

function optChip(o, defs){

function lunarToDay(str){
  const cnNum = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,'二十一':21,'二十二':22,'二十三':23,'二十四':24,'二十五':25,'二十六':26,'二十七':27,'二十八':28,'二十九':29,'三十':30};
  const monthMap = {'正':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'腊':12};
  // extract month
  let month = null;
  for(const k in monthMap){
    if(str.includes(k+'月') || str.startsWith(k)){ month = monthMap[k]; break; }
  }
  if(!month) return null;
  // extract day
  const dayStr = str.replace(/.*月/, '');
  let day = 0;
  if(dayStr.startsWith('初')){
    const rest = dayStr.replace('初','');
    day = cnNum[rest] || 0;
  } else if(dayStr === '十' || dayStr === '初十'){
    day = 10;
  } else if(dayStr.startsWith('廿')){
    const rest = dayStr.replace('廿','');
    day = rest ? (20 + (cnNum[rest] || 0)) : 20;
  } else if(dayStr === '二十'){
    day = 20;
  } else if(dayStr.startsWith('二十')){
    const rest = dayStr.replace('二十','');
    day = 20 + (cnNum[rest] || 0);
  } else if(dayStr === '三十'){
    day = 30;
  } else if(dayStr.startsWith('十')){
    const rest = dayStr.replace('十','');
    day = rest ? (10 + (cnNum[rest] || 0)) : 10;
  }
  if(!day) return null;
  return month * 100 + day;
}

      return {

        neg: (n && n.value) ? n.value : 'minus'
      };
    };
    const syncCurHint = ()=>{
      if(!curHint) return;
      const st = curState();
      const symLabel = st.sym==='¥'?'¥ 人民币':st.sym==='$'?'$ 美元':st.sym==='€'?'€ 欧元':st.sym==='£'?'£ 英镑':'无符号';
      const negLabel = st.neg==='red'?'红色负数':st.neg==='paren'?'括号负数':'-1,234.56';
      const sample = (()=>{ const b = (1234).toFixed(st.dec).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return st.neg==='paren' ? '('+b+')' : (st.neg==='red' ? '<span style="color:#d33">-'+b+'</span>' : '-'+b); })();
      curHint.innerHTML = '当前：' + symLabel + ' · ' + st.dec + ' 位小数 · ' + negLabel
        + '<br><span style="color:var(--muted)">正数预览 ' + st.sym + (1234).toFixed(st.dec).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
        + ' ・ 负数预览 ' + sample + '</span>';
    };
    const applyCur = (id, cls)=>{
      const sel = menu.querySelector(id);
      if(!sel) return;

        const r = btn.closest('.field-row') || row;

        syncCurHint();
      };
      sel.addEventListener('change', run);
      // iOS 某些版本/某些输入法只派发 input 不派发 change，两个都绑上更稳
      sel.addEventListener('input', run);
    };
    applyCur('#menu-cur-sym', '.f-cur-sym');
    applyCur('#menu-cur-dec', '.f-cur-dec');
    applyCur('#menu-cur-neg', '.f-cur-neg');
    syncCurHint();
  }
  // make draggable
  const title = menu.querySelector('.fm-title');
  let isDown = false, startX = 0, startY = 0, origX = 0, origY = 0;
  title.addEventListener('pointerdown', e=>{
    isDown = true;
    startX = e.clientX; startY = e.clientY;
    origX = menu.offsetLeft; origY = menu.offsetTop;
    title.setPointerCapture(e.pointerId);
  });
  title.addEventListener('pointermove', e=>{
    if(!isDown) return;
    menu.style.left = (origX + e.clientX - startX) + 'px';
    menu.style.top = (origY + e.clientY - startY) + 'px';
  });
  title.addEventListener('pointerup', ()=>{ isDown = false; });
}
function startFieldDrag(el, e){
  const row = el.closest('.field-row');
  if(!row) return;
  const startY = e.clientY;
  let moved = false;
  row.style.touchAction = 'none';
  let lastY = startY;
  const onMove = ev=>{
    const dy = ev.clientY - lastY;
    if(Math.abs(dy) < 2) return;
    moved = true;
    ev.preventDefault();
    row.style.opacity = '0.5';
    lastY = ev.clientY;
    const allRows = [...row.parentElement.querySelectorAll('.field-row')];
    const i = allRows.indexOf(row);
    if(dy > 0 && i < allRows.length-1){
      const next = allRows[i+1];
      const nr = next.getBoundingClientRect();
      if(ev.clientY > nr.top + nr.height*0.3){
        row.parentElement.insertBefore(row, next.nextSibling);
      }
    } else if(dy < 0 && i > 0){
      const prev = allRows[i-1];
      const pr = prev.getBoundingClientRect();
      if(ev.clientY < pr.top + pr.height*0.7){
        row.parentElement.insertBefore(row, prev);
      }
    }
  };
  const onUp = ()=>{
    row.style.opacity = '';
    row.style.touchAction = '';
    document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
  };
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp, {once:true});
}
function startTypeDrag(el, e){
  // Don't preventDefault on tap - only when actually dragging
  const pop = el.closest('.tp-pop');
  if(!pop) return;
  const startY = e.clientY;
  let dragging = false;
  let lastY = startY;
  const onMove = ev=>{
    const dy = ev.clientY - lastY;
    if(!dragging && Math.abs(dy) < 5) return;
    if(!dragging){
      dragging = true;
      el.style.opacity = '0.5';
      el.style.touchAction = 'none';
      if(e.cancelable) e.preventDefault();
      ev.preventDefault();
    }
    lastY = ev.clientY;
    const allOpts = [...pop.querySelectorAll('.tp-opt')];
    const i = allOpts.indexOf(el);
    if(dy > 0 && i < allOpts.length-1){
      const next = allOpts[i+1];
      const nr = next.getBoundingClientRect();
      if(ev.clientY > nr.top + nr.height*0.3){
        pop.insertBefore(el, next.nextSibling);
      }
    } else if(dy < 0 && i > 0){
      const prev = allOpts[i-1];
      const pr = prev.getBoundingClientRect();
      if(ev.clientY < pr.top + pr.height*0.7){
        pop.insertBefore(el, prev);
      }
    }
  };
  const onUp = ()=>{
    el.style.opacity = '';
    el.style.touchAction = '';
    document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp);
    const order = [...pop.querySelectorAll('.tp-opt')].map(o=>o.dataset.t);
    try{ localStorage.setItem('lighter-db-type-order', JSON.stringify(order)); }catch(err){}
  };
  document.addEventListener('pointermove', onMove, {passive:false}); document.addEventListener('pointerup', onUp);
}

                expr: exEl ? exEl.value.trim() : '',
                exprMoney: exmEl ? exmEl.value === '1' : false };
  if(type==='money'){
    const curSymEl = fr.querySelector('.f-cur-sym');

function saveTable(tableId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const name = $('et-name').value.trim();
  if(!name){ toast('请填写表名称'); return; }
  const rows = [...document.querySelectorAll('#modal-root .field-row')];
  const fields = [], kept = new Set();
  let skipped = 0;
  rows.forEach(fr=>{
    const f = fieldFromRow(fr);
    if(!f){ skipped++; return; }
    kept.add(f.id);
    fields.push(f);
  });
  if(!fields.length){ toast('至少保留一个字段'); return; }
  if(skipped){ toast(`有 ${skipped} 个字段未填写名称，请补全名称或删除空行`); return; }
  t.name = name;
  t.fields = fields;
  fields.forEach(f=>{
    t.rows.forEach(r=>{
      let v = r.values[f.id];
      if(f.type==='select' || f.type==='tags'){
        r.values[f.id] = Array.isArray(v) ? v : (v==null||v==='' ? [] : [String(v)]);
      }else if(f.type==='bool'){
        r.values[f.id] = (v===true||v==='true') ? 'true' : 'false';
      }else if(f.type==='number'){
        r.values[f.id] = (v===''||v==null) ? null : (isNaN(Number(v)) ? null : Number(v));
      }else{
        r.values[f.id] = Array.isArray(v) ? (v.length ? String(v[0]) : '') : (v==null ? '' : String(v));
      }
    });
  });
  t.rows.forEach(r=>{ Object.keys(r.values).forEach(k=>{ if(!kept.has(k)) delete r.values[k]; }); });
  t.updatedAt = Date.now();
  save(); closeModal(); render();
  toast('表结构已更新');
}
function deleteTable(tableId){

  // 先取同工作簿的其它工作表：在表内删掉后要留在当前数据表并切过去，而不是退回概览
  const sib = bookSheets(t).filter(x=>x.id!==tableId);
  const isSheet = sib.length > 0;
  // 从哪里删的就留在哪里：表内删除→留在数据表；概览/回收站删除→留在原视图，不要被拽进表格页
  const fromTablePage = parseHash().view === 'table';
  confirmDialog(`确定删除${isSheet?'工作表':'数据表'}「${esc(t.name)}」吗？共 <b>${t.rows.length}</b> 条记录。删除后整表进入回收站，可随时恢复；也可用撤销恢复。`, ()=>{
    // Move the whole table (structure + rows) into trash so it can be restored
    db.trash = db.trash || [];
    db.trash.push({ id: uid(), tableId: t.id, tableName: t.name, deletedAt: Date.now(), rows: t.rows, fields: t.fields, view: t.view || {}, folderId: t.folderId || null, bookId: t.bookId || '' });
    db.tables = db.tables.filter(x=>x.id!==tableId);
    delete ui.tableQuery[tableId];
    save(); closeModal();

    // 在概览/回收站删除：留在原视图，不要跳进表格页。
    if(fromTablePage && sib.length) location.hash = '#/table/' + encodeURIComponent(sib[0].id);
    else location.hash = '#/overview';

    toast('已删除' + (isSheet?'工作表':'数据表') + '，可到回收站恢复');
  });
}

/* ===== 导入导出 ===== */
function download(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1200);
}
/* 统一的「把文件交给用户」入口。两个踩过的坑：
   1. iOS Safari 上 <a download> 只会弹出一个「预览页」（带返回/关闭键），用户点返回/关闭就什么都
      没存 —— 而且**我们无法得知结果**，所以绝不能无条件提示「已导出」，那是假提示 ✗。
   2. 优先走系统分享（navigator.share），里面有「存储到文件」；成功才提示，用户取消就不提示成功 ✓。 */
function isIOSDevice(){
  const ua = navigator.userAgent || '';
  return /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function exportFile(blob, fname, opts){
  opts = opts || {};
  const okMsg = opts.okMsg || ('已导出 ' + fname);
  const title = opts.title || '轻量数据库';
  let file = null;
  try{ file = new File([blob], fname, {type: blob.type || 'application/octet-stream'}); }catch(e){}
  if(file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title: title}).then(()=>{
      toast(okMsg);
    }).catch(err=>{
      if(err && err.name === 'AbortError'){ toast('已取消导出'); return; }   // 用户自己取消，别报成功
      download(blob, fname);
      toast('已开始下载 ' + fname + (isIOSDevice() ? '，请在弹出界面选择「存储到文件」' : ''));
    });
    return;
  }
  download(blob, fname);
  // 走 <a download> 时拿不到结果：桌面浏览器是直接下载，iOS 会先弹预览页。
  // 所以这里如实说"已开始下载"，不再谎报"已导出"。
  toast('已开始下载 ' + fname + (isIOSDevice() ? '，请在弹出界面选择「存储到文件」' : ''));
}

/* 单表导出用的数据包。除了表本身，还必须带上**关联分组**：
   只带和这张表有关、且成员属于这张表的组（别的表不在这个文件里，带了也是空引用）。
   不带的话，导进来的副本"关联记录"就空了 ✗（行里的 links 还在，但"这一组有谁"没了）。 */
function tableExportPayload(t){
  const gids = new Set();
  (t.rows||[]).forEach(r=>{ if(r && r.links) Object.keys(r.links).forEach(k=>{ const g = r.links[k]; if(g) gids.add(g); }); });
  // 选组的判据：行上挂了这一组 **或** 这一组里有成员属于本表 ✓
  // （跨表关联组可能只存在 xgroups 里、成员行自己不带标记，只看行标记会漏掉 ✗）
  const xgroups = (db.xgroups||[])
    .filter(g=>g && (gids.has(g.id) || (g.rows||[]).some(m=>String(m && m.t)===String(t.id))))
    .map(g=>({ id:g.id, fieldId:g.fieldId, rows:(g.rows||[]).filter(m=>String(m.t)===String(t.id)) }))
    .filter(g=>g.rows.length);
  return { v:1, xgroups,
    tables:[{ id:t.id, name:t.name, fields:t.fields, rows:t.rows, updatedAt:t.updatedAt,
              bookId:t.bookId||'', order: (typeof t.order==='number'? t.order : undefined),
              view:t.view||{} }] };
}

function importJSON(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json,.csv,text/csv';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    const isCsv = /\.csv$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = () => {
      if(isCsv){
        let txt = reader.result;
        try{
          const buf = reader.result;
          if(buf instanceof ArrayBuffer){
            txt = new TextDecoder('utf-8').decode(buf);
            if(txt.includes('\uFFFD')){ try{ txt = new TextDecoder('gbk').decode(buf); }catch(e){} }
          }
        }catch(e){}
        const d = csvToDb(txt, file.name);
        if(d && d.tables && d.tables.length){ openImportDialog(d); }
        else toast('导入失败：CSV 为空或格式不正确');
        return;
      }
      let d;
      try{ d = JSON.parse(reader.result); }
      catch(e){ toast('导入失败：不是有效的 JSON'); return; }
      if(d && d.table && typeof d.table==='object' && d.table.name!=null){
        d = { v:1, tables:[d.table], xgroups: Array.isArray(d.xgroups) ? d.xgroups : [] };
      }
      // Support single-table share format {name,fields,rows}
      if(d && d.name && Array.isArray(d.fields) && Array.isArray(d.rows)){
        // 兼容"单表分享"的旧格式 —— 但别把关联分组丢了
        d = { v:1, tables:[{ id: uid(), name: d.name, fields: d.fields, rows: d.rows, view: d.view||{} }],
              xgroups: Array.isArray(d.xgroups) ? d.xgroups : [] };
      }
      if(!d || !Array.isArray(d.tables)){ toast('导入失败：缺少 tables 字段'); return; }
      openImportDialog(d);
    };
    if(isCsv) reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
  };
  inp.click();
}
function parseCSV(text){
  text = String(text||'').replace(/^\uFEFF/, '');
  const rows = []; let row = [], cur = '', inQ = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }else if(ch==='"') inQ = true;
    else if(ch===','){ row.push(cur); cur = ''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(ch!=='\r') cur += ch;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length);
}
function csvToDb(text, filename){
  const rows = parseCSV(text);
  if(!rows.length) return null;
  const headers = rows[0].map((h,i)=> String(h==null?'':h).trim() || ('列'+(i+1)));
  const dataRows = rows.slice(1).filter(r=>r.some(c=>String(c==null?'':c).trim()!==''));
  if(!dataRows.length) return null;
  const fields = headers.map((h,i)=>{
    const vals = dataRows.map(r=>r[i]);
    const num = vals.every(v=>{ const s=String(v==null?'':v).trim(); return s==='' || /^-?\d+(\.\d+)?$/.test(s); });
    return { id: uid(), name: h, type: num ? 'number' : 'text' };
  });
  const frows = dataRows.map(r=>{
    const values = {};
    fields.forEach((f,i)=>{
      const v = String(r[i]==null?'':r[i]).trim();
      values[f.id] = f.type==='number' ? (v==='' ? null : Number(v)) : v;
    });
    return { id: uid(), values };
  });
  const name = String(filename||'导入表').replace(/\.csv$/i,'').trim() || '导入表';
  return { v:1, tables:[{ id: uid(), name, fields, rows: frows, updatedAt: Date.now() }] };
}
let importCandidates = [];
let importAll = null;
/* 导入前先让用户看清：**这个文件里的字段到底带不带属性**。
   为什么需要：用户报"导出的字段有设置属性，导入时属性丢失"（2026-10-23）。
   JSON 导出是原样带走全部属性的（`normalizeDb` 的白名单覆盖 required/unique/curSym/… ），
   但 **CSV 天生装不下属性**（只有列名和值）—— 用 CSV 导进来，字段类型和属性只能重新猜 ✗
   所以这里把"文件里有什么"直接写出来：带属性就列出来，纯 CSV 就明说"无属性"。 */
function importAttrSummary(t){
  const fs = Array.isArray(t && t.fields) ? t.fields.filter(f=>f && typeof f==='object') : [];
  const cnt = k => fs.filter(f=>f[k]).length;
  const parts = [];
  const req = cnt('required'), uniq = cnt('unique');
  if(req) parts.push(req + ' 个必填');
  if(uniq) parts.push(uniq + ' 个禁止重复');
  const money = fs.filter(f=>f.type==='money');
  if(money.length){
    const sym = money[0].curSym ? money[0].curSym : '无符号';
    parts.push(money.length + ' 个货币（' + esc(String(sym)) + '）');
  }
  if(fs.some(f=>(f.type==='select'||f.type==='tags') && Array.isArray(f.options) && f.options.length)) parts.push('带选项');
  if(fs.some(f=>f.defNow)) parts.push('默认当前时间');
  if(fs.some(f=>f.type==='formula' && f.expr)) parts.push('公式');
  if(fs.some(f=>f.hidden)) parts.push(cnt('hidden') + ' 个隐藏字段');
  return parts.length ? ('含 ' + parts.join(' · ')) : '无属性（只有列名和值，多半是 CSV）';
}
function openImportDialog(d){
  importAll = d;
  importCandidates = (Array.isArray(d.tables) ? d.tables : []).filter(t=>t && typeof t==='object' && t.name!=null);

function toggleImpAll(on){
  document.querySelectorAll('#imp-opts input[type=checkbox]').forEach(c=>{ c.checked = on; });
}
function doImportSelected(){
  const sel = [...document.querySelectorAll('#imp-opts input:checked')].map(c=>Number(c.dataset.i));
  if(!sel.length){ toast('请至少选择一张表'); return; }
  const list = sel.map(i=>importCandidates[i]);
  closeModal();
  const existing = new Set(db.tables.map(t=>t.name));
  const added = [];
  // 导入进来的工作簿必须换一个全新的 bookId：否则若当前库里已存在同一个 bookId，
  // 导入的副本会静默并进那个工作簿，而不是作为新条目出现。
  // 同一份备份里的多张工作表共用同一个新 bookId，保持它们仍归一组。
  const bookMap = new Map();
  const idMap = new Map();    // 旧表 id → 新表 id（关联分组的成员表要跟着换）
  const gidMap = new Map();   // 旧关联组 id → 新关联组 id
  const newGid = g => { if(!gidMap.has(g)) gidMap.set(g, uid()); return gidMap.get(g); };
  db.bookNames = db.bookNames || {};
  db.xgroups = Array.isArray(db.xgroups) ? db.xgroups : [];
  list.forEach(t=>{
    let name = String(t.name||'未命名表');
    if(existing.has(name)){ let k=2; while(existing.has(name+'('+k+')')) k++; name = name+'('+k+')'; }
    existing.add(name);
    let newBid = '';
    if(t.bookId){
      if(!bookMap.has(t.bookId)) bookMap.set(t.bookId, uid());
      newBid = bookMap.get(t.bookId);
      const srcBn = (importAll && importAll.bookNames) ? importAll.bookNames[t.bookId] : '';
      if(srcBn && !db.bookNames[newBid]) db.bookNames[newBid] = String(srcBn);
    }
    const nt = normalizeDb({v:1, tables:[Object.assign({}, t, {id: uid(), name, bookId: newBid})]}).tables[0];
    // 关联组的 id 全换成新的：否则导入的副本会和原表那一组共用同一个 gid，
    // 在"关联记录"里被当成同一组串在一起（行里的 links 必须跟着改）。
    nt.rows.forEach(r=>{
      if(!r.links) return;
      Object.keys(r.links).forEach(k=>{ const g = r.links[k]; if(g) r.links[k] = newGid(g); });
    });
    db.tables.push(nt);
    added.push(name);
    if(t.id) idMap.set(String(t.id), nt.id);
  });
  // 跨表关联分组的成员也要并进来，表 id 换成新的
  const srcXg = Array.isArray(importAll && importAll.xgroups) ? importAll.xgroups : [];
  let xgAdded = 0;
  srcXg.forEach(g=>{
    if(!g) return;
    // 判据是"这一组有没有成员属于本次导入的表"，**不能只看行上的组标记** ✗ ——
    // 跨表关联组可能只存在 xgroups 里（成员行自己不带标记），那种也必须一起导进来 ✓
    const members = (g.rows||[]).map(m=>{
      const nid = idMap.get(String(m && m.t));
      return nid ? { t: nid, r: String((m && m.r) || '') } : null;
    }).filter(m=>m && m.r);
    if(!members.length) return;
    const nid = newGid(String(g.id));                    // 行上标记已改过的会拿到同一个新 id ✓
    // 兜底：万一还有行挂着旧 id，这里再改一遍
    members.forEach(m=>{
      const tb = db.tables.find(x=>x.id===m.t); if(!tb) return;
      const row = tb.rows.find(r=>r.id===m.r); if(!row || !row.links) return;
      Object.keys(row.links).forEach(k=>{ if(String(row.links[k]) === String(g.id)) row.links[k] = nid; });
    });
    db.xgroups.push({ id: nid, fieldId: String(g.fieldId||''), rows: members });
    xgAdded++;
  });
  db.tables.forEach((t,i)=>{ t.order = i; });
  ui.tableQuery = {};
  save(); render();
  toast('已导入 '+added.length+' 张数据表'+(added.length>1 ? '' : '：「'+added[0]+'」')
        + (xgAdded ? '，含 '+xgAdded+' 个关联分组' : ''));
}
function doImportReplace(){
  closeModal();
  confirmDialog('整库替换将<b>覆盖</b>当前全部数据，确定继续吗？', ()=>{
    // 保留表原 id：整库替换本来就是全量覆盖，不会和现有数据撞号；
    // 而换 id 会让 bookId / xgroups / 回收站里的表引用全部指空（工作簿被打散）。
    const src = importAll || {};
    db = normalizeDb({v:1,
      tables: importCandidates.map(t=>Object.assign({}, t)),
      folders: Array.isArray(src.folders) ? src.folders : [],
      bookNames: (src.bookNames && typeof src.bookNames === 'object') ? src.bookNames : {},
      trash: Array.isArray(src.trash) ? src.trash : [],
      xgroups: Array.isArray(src.xgroups) ? src.xgroups : []});
    ui.tableQuery = {};
    save(); render(); toast('已整库替换，共 '+db.tables.length+' 张表');
  }, '覆盖导入');
}
function clearAll(){
  if(!db.tables.length){ toast('当前没有数据'); return; }
  confirmDialog('确定清空<b>全部</b>数据表吗？此操作不可撤销，建议先导出备份。', ()=>{
    db.tables = [];
    db.trash = [];
    db.folders = [];   // 表都清了，文件夹也要一并清掉，否则概览会留下空文件夹
    db.xgroups = [];   // 表都没了，跨表关联组一并清空，避免孤儿数据
    db.bookNames = {}; // 同理，工作簿总名也是挂在表上的，一并清掉
    ui.tableQuery = {};
    save(); render(); toast('已清空全部数据');
  }, '清空');
}

// Boot-time snapshot of the pristine page (before any dynamic render/panels),
// used by _buildHtml when sharing/downloading the app file.
/* 源文件快照（分享/下载模板时用）。
   **只在真正要用时才去取** —— 原来放在 boot 里，等于每次打开都白拉一份整文件
   （线上 470KB、跨境带宽下要十几秒，纯浪费）。force-cache 让它尽量走 HTTP 缓存，
   通常就是刚加载的那一份，秒回。取不到就退回序列化当前 DOM（调用方有额外清洗）。 */
async function ensureSrcHtml(){
  if(window._SRC_HTML) return window._SRC_HTML;
  try{
    const res = await fetch(location.href, {cache:'force-cache'});
    if(res.ok && /text\/html/i.test(res.headers.get('content-type')||'')){
      const txt = await res.text();
      if(txt && txt.indexOf('<html') > -1) window._SRC_HTML = txt;
    }
  }catch(e){}
  return window._SRC_HTML || '';
}
async function boot(){
  watchDocScroll(false);   // 只清开机时 iOS 恢复的滚动位置，不打开守卫窗口
  loadTableQuery();
  render();
  bindPageDbl();
  try{ if(!localStorage.getItem(LS_KEY)) save(); }catch(e){}
}
boot();
</script>
