function runFolderSearch(fid, val){
  const results = $('fov-results'); if(!results) return;
  const panel = $('fov-panel'); if(!panel) return;
  const q = String(val||'').trim().toLowerCase();
  if(!q){
    results.innerHTML = '';
    results.style.display = 'none';
    panel.style.display = '';
    return;
  }
  const tables = db.tables.filter(t=> fid==='__ungrouped__' ? !t.folderId : t.folderId===fid).filter(isBookHead);
  const out = [];
  tables.forEach(t=>{
    t.rows.forEach(r=>{
      const hits = [];
      if(r.no!=null && String(r.no).toLowerCase().includes(q)) hits.push('编号:'+r.no);
      t.fields.forEach(f=>{
        const v = r.values ? r.values[f.id] : null;
        if(v!=null && v!=='' && String(v).toLowerCase().includes(q)){
          let s = String(v);
          if(s.length>40) s = s.slice(0,40)+'…';
          hits.push(esc(f.name)+':'+esc(s));
        }
      });
      if(hits.length) out.push({ t, r, hits });
    });
  });
  if(!out.length){
    results.style.display = 'flex';
    results.innerHTML = '<div class="fs-empty">未找到包含「'+esc(String(val).trim())+'」的记录</div>';
    panel.style.display = 'none';
    return;
  }
  results.style.display = 'flex';
  results.innerHTML = '<div class="fs-count">找到 '+out.length+' 条记录</div>' + out.slice(0,60).map(o=>`
    <div class="fs-hit" onclick="location.hash='#/table/${encodeURIComponent(o.t.id)}'">
      <div class="fs-tbl">【${esc(o.t.name)}】 #${o.r.no!=null?o.r.no:''} ${o.hits.slice(0,3).join(' · ')}${o.hits.length>3?(' …共'+o.hits.length+'项'):''}</div>
    </div>`).join('');
  panel.style.display = 'none';
}
function bindFolderCardLongPress(){
  const cards = document.querySelectorAll('.fov-card, .ov-row');
  cards.forEach(card=>{
    if(card._fovBound) return;
    card._fovBound = true;
    let t=null, sx=0, sy=0;
    card.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      sx=e.clientX; sy=e.clientY;
      t=setTimeout(()=>{
        lpFired = true;                      // 让"松手那一下"的合成 click 被吞掉，避免直接跳进数据表
        showTableCardMenu(card, e);
      }, 600);
    });
    const cancel=()=>{ clearTimeout(t); t=null; };
    card.addEventListener('pointermove', e=>{ if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10) cancel(); });
    card.addEventListener('pointerup', cancel);
    card.addEventListener('pointerleave', cancel);
    card.addEventListener('pointercancel', cancel);
    card.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation(); showTableCardMenu(card, e); });
  });
}
/* ===== 概览多选：批量移入文件夹 / 批量删除 =====
   为什么需要它：概览的拖动用的是 **HTML5 拖放**（draggable + ondragstart/ondrop），
   这套在**触屏上根本不触发** —— 安卓/iPad 上长按卡片拖不进文件夹（真机 2026-10-20 反馈）。
   多选不依赖拖放，所以手机上也能一次把好几个表放进文件夹 ✓
   进入方式：概览右上「选择」，或长按卡片 →「☑ 多选（批量移动/删除）」 */
let _ovSel = null;            // null = 普通模式；Set<表头 id> = 多选模式

/* 卡片点击：多选模式下切换选中（返回 false 阻止 <a> 跳转）；普通模式下放行 ✓ */

function ovSelMoveTo(fid){

/* 批量删除：整本书一起进回收站（可恢复） */
function ovSelDelete(){
  const ids = [...(_ovSel || [])];
  if(!ids.length) return;
  const names = ids.map(id=>{ const t = db.tables.find(x=>x.id===id); return t ? bookNameOf(t) : ''; }).filter(Boolean);
  confirmDialog('确定删除选中的 <b>' + ids.length + '</b> 个数据表吗？<br>'
    + names.slice(0, 8).map(esc).join('、') + (names.length > 8 ? ' 等' : '')
    + '<br><span class="muted" style="font-size:12px">删除后整表进入回收站，可随时恢复</span>', function(){
    db.trash = db.trash || [];
    ids.forEach(id=>{
      const t = db.tables.find(x=>x.id===id); if(!t) return;
      const bid = bookIdOf(t);
      db.tables.filter(x=>bookIdOf(x)===bid).forEach(x=>{
        db.trash.push({ id: uid(), tableId: x.id, tableName: x.name, deletedAt: Date.now(),
          rows: x.rows, fields: x.fields, view: x.view || {}, folderId: x.folderId || null, bookId: x.bookId || '' });
        delete ui.tableQuery[x.id];

function dragTableOver(el, ev){
  if(!dragTableId || dragTableId===el.dataset.id || el.classList.contains('dragging')) return;
  if(ev && ev.preventDefault) ev.preventDefault();
  const r = el.getBoundingClientRect();
  const inCenter = ev && ev.clientX > r.left + r.width*0.25 && ev.clientX < r.left + r.width*0.75
                        && ev.clientY > r.top + r.height*0.25 && ev.clientY < r.top + r.height*0.75;

// 把一张数据表并入另一张：成为同一个数据表下的平行工作表
function mergeTables(srcId, dstId){
  const src = db.tables.find(x=>x.id===srcId), dst = db.tables.find(x=>x.id===dstId);
  if(!src || !dst) return;
  if(bookIdOf(src) === bookIdOf(dst)){ toast('它们已经在同一个数据表里了'); return; }
  confirmDialog(`把「${esc(bookNameOf(src))}」并入「${esc(bookNameOf(dst))}」？<br>并入后成为同一个数据表下的工作表，用顶部页签切换。`, ()=>{
    const bid = bookIdOf(dst);
    if(!dst.bookId) dst.bookId = bid;
    let mo = bookSheets(dst).reduce((m,x)=>Math.max(m, x.order==null?0:x.order), 0);
    bookSheets(src).forEach(x=>{ x.bookId = bid; x.order = ++mo; x.folderId = dst.folderId || null; });
    save(); render();
    toast('已并入「'+bookNameOf(dst)+'」，共 '+bookSheets(dst).length+' 个工作表');
  }, '合并');
}
function dragTableDrop(el, ev, targetId){
  if(ev && ev.preventDefault) ev.preventDefault();
  if(!dragTableId || dragTableId===targetId){ dragTableEnd(); return; }
  const from = db.tables.findIndex(x=>x.id===dragTableId);
  const to = db.tables.findIndex(x=>x.id===targetId);
  if(from<0 || to<0){ dragTableEnd(); return; }
  // 落在卡片「中央」区域 → 合并成一个数据表；落在边缘 → 只是调整顺序（保持原有拖拽排序）
  const r = el.getBoundingClientRect();
  const inCenter = ev && ev.clientX > r.left + r.width*0.25 && ev.clientX < r.left + r.width*0.75
                        && ev.clientY > r.top + r.height*0.25 && ev.clientY < r.top + r.height*0.75;
  if(inCenter){ const sid = dragTableId; dragTableEnd(); mergeTables(sid, targetId); return; }
  if((db.tables[from].folderId||null)!==(db.tables[to].folderId||null)){ dragTableEnd(); return; }
  const moved = db.tables.splice(from,1)[0];
  db.tables.splice(to,0,moved);
  db.tables.forEach((t,i)=>{ t.order = i; });
  save(); render();
  dragTableEnd();
}

let lpTimer = null, lpFired = false, lpX = 0, lpY = 0;
function lpStart(ev, cb){
  const p = (ev.touches && ev.touches[0]) || ev;

function lpDown(e){

  const fblock = e.target.closest('.ov-folder');

async function buildSingleTableHtml(tableId, withData){
  await ensureSrcHtml();
  const savedDb = JSON.parse(JSON.stringify(db));
  if(!withData) savedDb.tables.forEach(t=>t.rows = []);
  const onlyT = savedDb.tables.find(t=>t.id===tableId);
  savedDb.tables = onlyT ? [onlyT] : [];
  savedDb.folders = [];
  closeModal();
  let html;
  if(window._SRC_HTML){
    // Boot-time raw snapshot: pristine file, no dynamic panels to clean.
    // (Do NOT run the DOM-cleanup regexes here: they match template strings
    // inside the inline script and would delete real code.)
    html = window._SRC_HTML;
  }else{
    // Fallback: serialize the live DOM, then strip dynamic panels.
    // 实测 Chromium 的 outerHTML 对 <script> 体是按原文输出的（不会转成 &lt;/&amp;），
    // 真正会毁掉导出文件的是跨行的清理正则，已由 stripInjected 修复。
    // 但仍优先用 boot 快照：live DOM 里混着已渲染的内容，序列化后需要额外清洗。
    html = '<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    html = html.replace(/<div id="modal-root">[\s\S]*?<\/div>\s*(?=<script|$)/, '<div id="modal-root"></div>');
    html = html.replace(/<div id="app">[\s\S]*?<\/div>(?=<div id="modal-root")/, '<div id="app"></div>');
    html = html.replace(/<div id="alert-overlay">[\s\S]*?<\/div>/, '');
    html = html.replace(/<div id="field-menu"[\s\S]*?<\/div>/g, '');
  }
  // 先剥掉旧注入块：否则从「已嵌入数据的文件」导出单表时，注入点会落在旧的
  // <script>window.__EMBED_DB__... 上，而嵌入数据优先级高于 localStorage，
  // 对方打开后看到的仍是全表而不是这一张表。
  html = stripInjected(html);
  // Escape every "<" as \u003c so a field value containing a closing script tag
  // cannot terminate this script block or inject markup (JSON round-trips unchanged).
  const dataStr = JSON.stringify(savedDb).replace(/</g, '\\u003c');
  const inject = 'try{localStorage.setItem("lighter-db-v1", JSON.stringify('+dataStr+'));}catch(e){}';
  html = html.replace(/<script>/, '<script>'+inject+'<\/script><script>');
  return { html, name: (onlyT ? onlyT.name : '数据表') + (withData ? '_数据' : '_模板') + '.html' };
}
/* 概览里的一张"数据表"其实是一个**工作簿**，底下可能有好几个工作表（顶部页签切换）。
   分享/导出必须把它们**全部**带上 —— 以前只导 `db.tables.find(id)` 那一张，
   多工作表的工作簿就只导出了第一个 ✗（真机 2026-10-23："只能导出第一个表"） */
function shareSheetsOf(tableId){
  const t = db.tables.find(x=>x.id===tableId);
  if(!t) return [];
  const s = bookSheets(t);
  return s.length ? s : [t];
}
function safeFileBase(s){
  return String(s == null ? '' : s).replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim() || '数据表';
}
function shareBookName(t){
  return safeFileBase(bookNameOf(t) || (t && t.name) || '数据表');

/* 一次给出多个文件：能多文件分享就一起分享，否则依次下载。

function shareMany(items, title){
  const list = (items || []).filter(x=>x && x.blob);
  if(!list.length) return;
  if(list.length === 1){ shareOrDownload(list[0].blob, list[0].fname, title); return; }
  closeModal();
  let files = [];
  try{
    files = list.map(it=> new File([it.blob], it.fname, {type: it.blob.type || 'application/octet-stream'}));
  }catch(e){ files = []; }
  const downloadAll = ()=>{
    list.forEach((it,i)=> setTimeout(()=>download(it.blob, it.fname), i*300));
    toast('已开始下载 ' + list.length + ' 个文件');
  };
  if(files.length && navigator.canShare && navigator.share && navigator.canShare({files})){
    navigator.share({files, title: title}).then(()=>{
      toast('已分享 ' + files.length + ' 个文件');
    }).catch(err=>{
      if(err && err.name === 'AbortError'){ toast('已取消导出'); return; }
      downloadAll();
    });
    return;
  }
  downloadAll();
}

/* ===== PDF 导出 =====
   「文字版」（默认）：表格线与文字都是矢量内容 —— 文字可选中、可搜索、任意缩放都清晰，体积小。
     · 中文用 Adobe-GB1 标准 CJK 字体 STHeiti-Light / STHeiti-Medium（UniGB-UCS2-H 编码，
       字符串按 UTF-16BE 写成十六进制），不嵌入字体文件。
     · 数字/英文用 PDF 标准字体 Helvetica / Helvetica-Bold（14 标准字体之一，每个阅读器都自带，
       度量精确）。这样 ASCII 的步进就是它真实的字宽（数字 556/1000、'.' 278/1000、'-' 333/1000…），
       而不是给所有 ASCII 一个统一宽度 —— 后者会让「1,234.56」这类带标点的数字间距看起来不自然。
   「图片版」：整页 canvas 按 300 DPI 渲染成 JPEG 再嵌入，兼容性最好，文字不可选中。
     版式与文字版共用同一套 pdfLayout() 计算，所以两者排版完全一致（表格同样铺满页宽）。 */

// Helvetica / Helvetica-Bold 的 ASCII 字宽表（1/1000 em，取自 AFM），索引 = 码位 - 32
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584];
const HELV_B_W = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,
  722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  333,278,333,584,556,333,
  556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
  389,280,389,584];
function pdfAsciiW(code, bold){
  const t = bold ? HELV_B_W : HELV_W;
  const i = code - 32;
  return (i >= 0 && i < t.length) ? t[i]/1000 : 0.6;
}
// 估算文字宽度（em x 字号）：ASCII 用 Helvetica 真实字宽，其余按全角 1.0
function pdfTextW(s, size, bold){
  let w = 0;
  for(const ch of String(s)){
    const c = ch.codePointAt(0);
    w += (c >= 32 && c <= 126) ? pdfAsciiW(c, bold) : 1.0;
  }
  return w * size;
}
// 中文（UniGB-UCS2-H）：每个码位写成 4 位十六进制的 UTF-16BE
function pdfHex(s){
  const str = String(s);
  let out = '';
  for(let i=0;i<str.length;i++) out += str.charCodeAt(i).toString(16).padStart(4,'0').toUpperCase();
  return '<'+out+'>';
}
// 英文/数字（WinAnsiEncoding）：每个字符 1 字节
function pdfAsciiHex(s){
  const str = String(s);
  let out = '';
  for(let i=0;i<str.length;i++) out += (str.charCodeAt(i) & 0xFF).toString(16).padStart(2,'0').toUpperCase();
  return '<'+out+'>';
}
// 按 ASCII / 非 ASCII 切段，便于一段用 Helvetica、一段用黑体
function pdfRuns(s){
  const str = String(s);
  const out = [];
  let cur = '', curAscii = null;
  for(const ch of str){
    const c = ch.codePointAt(0);
    const isAscii = (c >= 32 && c <= 126);
    if(curAscii === null) curAscii = isAscii;
    else if(isAscii !== curAscii){ out.push({ ascii: curAscii, text: cur }); cur = ''; curAscii = isAscii; }
    cur += ch;
  }
  if(cur) out.push({ ascii: curAscii, text: cur });
  return out;
}
// 按估算宽度截断
function pdfClip(s, size, maxW, bold){
  const str = String(s);
  if(pdfTextW(str, size, bold) <= maxW) return str;
  let out = str;
  while(out.length > 1 && pdfTextW(out+'…', size, bold) > maxW) out = out.slice(0,-1);
  return out+'…';
}
// 单元格显示文本（与表格视图口径一致）
function pdfCellText(f, r){
  let v = r && r.values ? r.values[f.id] : '';
  if(Array.isArray(v)) v = v.join('，');
  if(f.type==='money') return fmtMoneyText(v, f);
  if(f.type==='bool') return (v===true||v==='true') ? '是' : '否';
  if(f.type==='datetime') return String(v==null?'':v).replace('T',' ');
  if(f.type==='image') return String(v||'').startsWith('data:') ? '（图片）' : String(v==null?'':v);
  if(f.type==='signature') return String(v||'').startsWith('data:') ? '（签名）' : String(v==null?'':v);
  return String(v==null?'':v);
}
/* 版式计算 —— 文字版与图片版共用，保证两者排版一致。
   单位统一用 pt：A4 横向 842x595，15mm 边距 = 42.5pt，1px = 0.75pt（对齐应用内「预览」的样式）。 */
function pdfLayout(t, orientation){
  const portrait = orientation === 'portrait';
  const pageW = portrait ? 595 : 842;
  const pageH = portrait ? 842 : 595;
  const margin = 42.5;
  const titleSize = 12;
  const cellSize = 8.25, headSize = 8.25;
  const padX = 6, padY = 3.75;
  const rowH = Math.round(cellSize + padY*2 + 3);
  const headH = rowH;
  const visFields = t.fields.filter(function(f){ return f.hidden !== true; });
  const rows = t.rows || [];
  const usableW = pageW - margin*2;

  let noW = pdfTextW('No.', headSize, true) + padX*2;
  let widths = visFields.map(function(f){
    let max = pdfTextW(f.name, headSize, true) + padX*2;
    rows.forEach(function(r){
      const w = pdfTextW(pdfCellText(f, r), cellSize, false) + padX*2;
      if(w > max) max = Math.min(w, 300);
    });
    return Math.max(24, Math.ceil(max));
  });
  let sumFields = widths.reduce(function(a,b){ return a+b; }, 0);
  let totalW = noW + sumFields;
  if(totalW > usableW){
    // 内容超出：整体等比缩小
    const k = (usableW - noW) / Math.max(1, sumFields);
    widths = widths.map(function(w){ return Math.max(20, w*k); });
  }else if(sumFields > 0){
    // 内容比页宽窄：把剩余宽度按比例摊到各列 → 表格铺满页宽（等价于预览的 width:100%）
    const slack = usableW - totalW;
    widths = widths.map(function(w){ return w + slack * (w / sumFields); });
  }
  sumFields = widths.reduce(function(a,b){ return a+b; }, 0);
  totalW = noW + sumFields;

  const titleBaseline = pageH - margin - titleSize*0.85;
  const tableTop = titleBaseline - titleSize*0.75 - 9;
  const bodyTop = tableTop - headH;
  const bottomLimit = margin + 14;
  const rowsPerPage = Math.max(1, Math.floor((bodyTop - bottomLimit) / rowH));
  const totalPages = Math.max(1, Math.ceil(rows.length / rowsPerPage));

  return { portrait:portrait, pageW:pageW, pageH:pageH, margin:margin,
           titleSize:titleSize, cellSize:cellSize, headSize:headSize,
           padX:padX, padY:padY, rowH:rowH, headH:headH,
           visFields:visFields, rows:rows, noW:noW, widths:widths, totalW:totalW, usableW:usableW,
           titleBaseline:titleBaseline, tableTop:tableTop, bodyTop:bodyTop,
           rowsPerPage:rowsPerPage, totalPages:totalPages };
}
// 组装「文字版」PDF 字节流。字体：
//   F1 = STHeiti-Light / F2 = STHeiti-Medium （中文，Adobe-GB1 标准 CJK 字体，不嵌入）
//   F3 = Helvetica     / F4 = Helvetica-Bold  （数字/英文，PDF 14 标准字体，度量精确）
function buildTextPdfBytes(pageStreams, pw, ph){
  const enc = new TextEncoder();
  const chunks = []; let offset = 0; const offsets = [];
  const pushStr = s=>{ const b = enc.encode(s); chunks.push(b); offset += b.length; };
  const pushBytes = u8=>{ chunks.push(u8); offset += u8.length; };
  const objStart = ()=>{ offsets.push(offset); };
  pushStr('%PDF-1.4\n');
  pushBytes(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));  // 二进制文件标识
  // /W [1 95 620]：Adobe-GB1 里 CID 1..95 是 ASCII 比例字形（UniGB-UCS2-H 把 U+0020..U+007E
  // 映射到 CID 1..95）。实际排版里 ASCII 走 Helvetica，这条只是兜底。
  const cjkFonts = [
    { t:3, d:4, f:5, name:'STHeiti-Light'  },
    { t:6, d:7, f:8, name:'STHeiti-Medium' }
  ];
  const firstPageObj = 11;
  objStart(); pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  objStart(); pushStr('2 0 obj\n<< /Type /Pages /Kids ['+pageStreams.map(function(_,i){ return (firstPageObj+i*2)+' 0 R'; }).join(' ')+'] /Count '+pageStreams.length+' >>\nendobj\n');
  cjkFonts.forEach(function(fo){
    objStart(); pushStr(fo.t+' 0 obj\n<< /Type /Font /Subtype /Type0 /BaseFont /'+fo.name+' /Encoding /UniGB-UCS2-H /DescendantFonts ['+fo.d+' 0 R] >>\nendobj\n');
    objStart(); pushStr(fo.d+' 0 obj\n<< /Type /Font /Subtype /CIDFontType0 /BaseFont /'+fo.name+' /CIDSystemInfo << /Registry (Adobe) /Ordering (GB1) /Supplement 4 >> /FontDescriptor '+fo.f+' 0 R /DW 1000 /W [1 95 620] >>\nendobj\n');
    objStart(); pushStr(fo.f+' 0 obj\n<< /Type /FontDescriptor /FontName /'+fo.name+' /Flags 6 /FontBBox [-25 -254 1000 880] /ItalicAngle 0 /Ascent 880 /Descent -120 /CapHeight 880 /StemV 93 >>\nendobj\n');
  });
  // 9/10：Helvetica 常规与粗体（标准 14 字体，无需嵌入，字宽精确）
  objStart(); pushStr('9 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');
  objStart(); pushStr('10 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n');
  pageStreams.forEach(function(cs, i){
    const po = firstPageObj + i*2, co = po + 1;
    objStart(); pushStr(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /Font << /F1 3 0 R /F2 6 0 R /F3 9 0 R /F4 10 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
    objStart(); pushStr(co+' 0 obj\n<< /Length '+enc.encode(cs).length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  });
  const xrefStart = offset;
  // xref 条目数 = 对象总数 + 1 个空闲条目（对象号 0）
  const objCount = 10 + pageStreams.length*2;
  const xrefCount = objCount + 1;
  pushStr('xref\n0 '+xrefCount+'\n');
  pushStr('0000000000 65535 f \n');
  offsets.forEach(function(o){ pushStr(String(o).padStart(10,'0')+' 00000 n \n'); });
  pushStr('trailer\n<< /Size '+xrefCount+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');
  const total = chunks.reduce(function(n,c){ return n+c.length; }, 0);
  const out = new Uint8Array(total);
  let p = 0; chunks.forEach(function(c){ out.set(c,p); p += c.length; });
  return out;
}
// 一行文字按 ASCII/CJK 切段后逐段输出（各用各的字体），返回结束时的 x
function pdfTextOps(text, str, size, x, y, bold, rgb){
  pdfRuns(str).forEach(function(run){
    if(!run.text) return;
    const fontName = run.ascii ? (bold ? 'F4' : 'F3') : (bold ? 'F2' : 'F1');
    // 中文粗体：部分阅读器把 Light/Medium 替换成同一款字体，叠加「填充+描边」保证粗细可见。
    // 必须是 2 Tr（先填充再描边）；1 Tr 是「只描边」，字形会变空心。
    const mode = (!run.ascii && bold) ? ('2 Tr '+(size*0.035).toFixed(3)+' w ') : '0 Tr ';
    const hex = run.ascii ? pdfAsciiHex(run.text) : pdfHex(run.text);
    // 文字填充色：默认黑；给了 rgb 就用它（描边保持黑色，保证中文字形清晰）
    const fill = rgb ? (rgb[0].toFixed(3)+' '+rgb[1].toFixed(3)+' '+rgb[2].toFixed(3)+' rg ') : '0 g ';
    text.push('BT /'+fontName+' '+size+' Tf '+fill+'0 G '+mode+'1 0 0 1 '+x.toFixed(2)+' '+y.toFixed(2)+' Tm '+hex+' Tj 0 Tr ET');
    x += pdfTextW(run.text, size, bold);
  });
  return x;
}
// 文字版 PDF：矢量表格线 + 矢量文字
async function genTablePdfBlob(t, orientation){
  try{
    const L = pdfLayout(t, orientation);
    const pageStreams = [];
    for(let pg=0; pg<L.totalPages; pg++){
      const s0 = pg*L.rowsPerPage, s1 = Math.min(s0 + L.rowsPerPage, L.rows.length);
      const n = s1 - s0;
      const gridH = L.headH + n*L.rowH;
      const gridBottom = L.tableTop - gridH;
      const parts = [];
      // 单元格背景必须在网格线之前画，否则会把线盖住
      const fills = [];
      for(let j=0;j<n;j++){
        const r = L.rows[s0+j];
        let bx = L.margin + L.noW;
        L.visFields.forEach(function(f,ci){
          const st = pdfCellStyle(t, r, f);
          const rgb = hexToRgb01(st.bg);
          if(rgb){
            fills.push(rgb[0].toFixed(3)+' '+rgb[1].toFixed(3)+' '+rgb[2].toFixed(3)+' rg '
              + bx.toFixed(2)+' '+(L.bodyTop-(j+1)*L.rowH).toFixed(2)+' '+L.widths[ci].toFixed(2)+' '+L.rowH.toFixed(2)+' re f');
          }
          bx += L.widths[ci];
        });
      }
      parts.push('0.75 w 0.6 G');   // #999 细边框
      parts.push(L.margin+' '+gridBottom+' '+L.totalW+' '+gridH+' re S');
      for(let i=0;i<=n;i++){
        const y = L.bodyTop - i*L.rowH;
        parts.push(L.margin+' '+y+' m '+(L.margin+L.totalW)+' '+y+' l S');
      }
      let vx = L.margin;
      parts.push(vx+' '+gridBottom+' m '+vx+' '+L.tableTop+' l S');
      vx += L.noW;
      parts.push(vx+' '+gridBottom+' m '+vx+' '+L.tableTop+' l S');
      L.widths.forEach(function(w){
        vx += w;
        parts.push(vx+' '+gridBottom+' m '+vx+' '+L.tableTop+' l S');
      });
      const text = [];
      pdfTextOps(text, pdfClip(t.name, L.titleSize, L.usableW, true), L.titleSize, L.margin, L.titleBaseline, true);
      const headBase = L.bodyTop + L.rowH/2 - L.headSize*0.35;
      pdfTextOps(text, 'No.', L.headSize, L.margin+L.padX, headBase, true);
      let hx = L.margin + L.noW;
      L.visFields.forEach(function(f,i){
        pdfTextOps(text, pdfClip(f.name, L.headSize, L.widths[i]-L.padX*2, true), L.headSize, hx+L.padX, headBase, true);
        hx += L.widths[i];
      });
      for(let j=0;j<n;j++){
        const r = L.rows[s0+j];
        const base = L.bodyTop - (j+0.5)*L.rowH - L.cellSize*0.35;
        pdfTextOps(text, String(r.no!=null ? r.no : (s0+j+1)), L.cellSize, L.margin+L.padX, base, false);
        let cx = L.margin + L.noW;
        L.visFields.forEach(function(f,ci){
          const st = pdfCellStyle(t, r, f);
          pdfTextOps(text, pdfClip(pdfCellText(f, r), L.cellSize, L.widths[ci]-L.padX*2, false), L.cellSize, cx+L.padX, base, st.bold, hexToRgb01(st.fg));
          cx += L.widths[ci];
        });
      }
      if(L.totalPages > 1){
        const foot = '第 '+(pg+1)+' / '+L.totalPages+' 页';
        pdfTextOps(text, foot, 8, L.pageW - L.margin - pdfTextW(foot, 8, false), L.margin - 10, false);
      }
      pageStreams.push(fills.join('\n') + '\n' + parts.join('\n') + '\n' + text.join('\n'));
    }
    const bytes = buildTextPdfBytes(pageStreams, L.pageW, L.pageH);
    return new Blob([bytes], {type:'application/pdf'});
  }catch(err){
    console.error(err);
    return null;
  }
}
function clipCell(ctx, s, maxW){
  const str = String(s==null?'':s);
  if(ctx.measureText(str).width <= maxW) return str;
  let out = str;
  while(out.length>1 && ctx.measureText(out+'…').width > maxW) out = out.slice(0,-1);
  return out+'…';
}
function loadImage(src){
  return new Promise((res, rej)=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = ()=>rej(new Error('image load failed'));
    im.src = src;
  });
}
function dataUrlToBytes(durl){
  const i = durl.indexOf(',');
  const bin = atob(durl.slice(i+1));
  const u = new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++) u[k] = bin.charCodeAt(k);
  return u;
}
// 图片版 PDF：同一套 pdfLayout() + canvas 按 dpi/72 缩放绘制 —— 排版与文字版完全一致
async function genTablePdfBlobRaster(t, orientation, dpiOpt){
  try{
    const dpi = dpiOpt || 300;
    const k = dpi / 72;                                  // pt -> px
    const L = pdfLayout(t, orientation);
    const Y = y => L.pageH - y;                          // PDF 的 y 轴向上，canvas 向下
    const pages = [];
    for(let pg=0; pg<L.totalPages; pg++){
      const cv = document.createElement('canvas');
      cv.width = Math.round(L.pageW*k); cv.height = Math.round(L.pageH*k);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.setTransform(k, 0, 0, k, 0, 0);                // 之后全部按 pt 坐标绘制
      ctx.textBaseline = 'alphabetic';
      const s0 = pg*L.rowsPerPage, s1 = Math.min(s0 + L.rowsPerPage, L.rows.length);
      const n = s1 - s0;
      const gridH = L.headH + n*L.rowH;
      const gridBottom = L.tableTop - gridH;
      // 边框：0.75pt = 1px，#999
      // 先铺单元格背景（在网格线之前，避免盖住线）
      for(let j=0;j<n;j++){
        const r = L.rows[s0+j];
        let bx = L.margin + L.noW;
        for(let ci=0; ci<L.visFields.length; ci++){
          const st = pdfCellStyle(t, r, L.visFields[ci]);
          if(st.bg){ ctx.fillStyle = st.bg; ctx.fillRect(bx, Y(L.bodyTop-(j+1)*L.rowH), L.widths[ci], L.rowH); }
          bx += L.widths[ci];
        }
      }
      ctx.strokeStyle = '#999'; ctx.lineWidth = 0.75;
      ctx.strokeRect(L.margin, Y(L.tableTop), L.totalW, gridH);
      for(let i=0;i<=n;i++){
        const y = L.bodyTop - i*L.rowH;
        ctx.beginPath(); ctx.moveTo(L.margin, Y(y)); ctx.lineTo(L.margin+L.totalW, Y(y)); ctx.stroke();
      }
      let vx = L.margin;
      ctx.beginPath(); ctx.moveTo(vx, Y(L.tableTop)); ctx.lineTo(vx, Y(gridBottom)); ctx.stroke();
      vx += L.noW;
      ctx.beginPath(); ctx.moveTo(vx, Y(L.tableTop)); ctx.lineTo(vx, Y(gridBottom)); ctx.stroke();
      L.widths.forEach(function(w){
        vx += w;
        ctx.beginPath(); ctx.moveTo(vx, Y(L.tableTop)); ctx.lineTo(vx, Y(gridBottom)); ctx.stroke();
      });
      const draw = function(str, size, x, baselineY, bold, color){
        const s = String(str==null?'':str); if(!s) return;
        ctx.font = (bold?'bold ':'') + size + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = color || '#000000';
        ctx.fillText(s, x, Y(baselineY));
      };
      draw(clipCell(ctx, t.name, L.usableW), L.titleSize, L.margin, L.titleBaseline, true);
      const headBase = L.bodyTop + L.rowH/2 - L.headSize*0.35;
      draw('No.', L.headSize, L.margin+L.padX, headBase, true);
      let hx = L.margin + L.noW;
      L.visFields.forEach(function(f,i){
        draw(clipCell(ctx, f.name, L.widths[i]-L.padX*2), L.headSize, hx+L.padX, headBase, true);
        hx += L.widths[i];
      });
      for(let j=0;j<n;j++){
        const r = L.rows[s0+j];
        const base = L.bodyTop - (j+0.5)*L.rowH - L.cellSize*0.35;
        draw(String(r.no!=null ? r.no : (s0+j+1)), L.cellSize, L.margin+L.padX, base, false);
        let cx = L.margin + L.noW;
        for(let ci=0; ci<L.visFields.length; ci++){
          const f = L.visFields[ci];
          const raw = r.values ? r.values[f.id] : '';
          const cellW = L.widths[ci]-L.padX*2;
          if((f.type==='signature' || f.type==='image') && String(raw).startsWith('data:')){
            try{
              const img = await loadImage(String(raw));
              if(img.width>0 && img.height>0){
                const maxH = L.cellSize + 3, maxW = cellW;
                let w = img.width, h = img.height;
                if(h>maxH){ w = w*maxH/h; h = maxH; }
                if(w>maxW){ h = h*maxW/w; w = maxW; }
                ctx.drawImage(img, cx+L.padX+Math.max(0,(cellW-w)/2), Y(base)-h*0.75, w, h);
              }
            }catch(err){ draw('（图片）', L.cellSize, cx+L.padX, base, false); }
          } else {
            const st2 = pdfCellStyle(t, r, f);
            draw(clipCell(ctx, pdfCellText(f, r), cellW), L.cellSize, cx+L.padX, base, st2.bold, st2.fg);
          }
          cx += L.widths[ci];
        }
      }
      if(L.totalPages > 1){
        const foot = '第 '+(pg+1)+' / '+L.totalPages+' 页';
        ctx.font = '8px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText(foot, L.pageW - L.margin - pdfTextW(foot, 8, false), Y(L.margin - 10));
      }
      pages.push({ data: dataUrlToBytes(cv.toDataURL('image/jpeg', 0.95)), w: cv.width, h: cv.height });
    }
    const bytes = buildRasterPdfBytes(pages, L.pageW, L.pageH);
    return new Blob([bytes], {type:'application/pdf'});
  }catch(err){
    console.error(err);
    return null;
  }
}
function buildRasterPdfBytes(pages, pw, ph){
  const enc = new TextEncoder();
  const chunks = []; let offset = 0; const offsets = [];
  const pushStr = s=>{ const b = enc.encode(s); chunks.push(b); offset += b.length; };
  const pushBytes = u8=>{ chunks.push(u8); offset += u8.length; };
  const objStart = ()=>{ offsets.push(offset); };
  pushStr('%PDF-1.4\n');
  objStart(); pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = pages.map((_,i)=>String(3+i*3)+' 0 R').join(' ');
  objStart(); pushStr('2 0 obj\n<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>\nendobj\n');
  pages.forEach((jp,i)=>{
    const po = 3+i*3, io = 4+i*3, co = 5+i*3;
    objStart(); pushStr(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+io+' 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
    objStart(); pushStr(io+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+jp.w+' /Height '+jp.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp.data.length+' >>\nstream\n');
    pushBytes(jp.data);
    pushStr('\nendstream\nendobj\n');
    const content = 'q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    objStart(); pushStr(co+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
  });
  const xrefStart = offset;
  // xref 条目数 = 对象总数 + 1 个空闲条目（对象号 0）
  const objCount = 2 + pages.length*3;
  const xrefCount = objCount + 1;
  pushStr('xref\n0 '+xrefCount+'\n');
  pushStr('0000000000 65535 f \n');
  offsets.forEach(o=>{ pushStr(String(o).padStart(10,'0')+' 00000 n \n'); });
  pushStr('trailer\n<< /Size '+xrefCount+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');
  const len = chunks.reduce((n,c)=>n+c.length,0);
  const out = new Uint8Array(len);
  let p = 0; chunks.forEach(c=>{ out.set(c,p); p += c.length; });
  return out;
}
function doShareFmt(tableId, fmt){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const sheets = shareSheetsOf(tableId);          // 工作簿里的**全部**工作表
  const multi = sheets.length > 1;
  const base = shareBookName(t);
  const nameOf = s => multi ? (base + '-' + safeFileBase(s.name)) : base;

  if(fmt==='csv'){
    // 和站内「导出 CSV」用同一个 csvCell()：转义、是/否、数组合并都一致
    const items = sheets.map(s=>{
      const header = ['编号', ...s.fields.map(f=>csvCell(f.name))].join(',');
      const lines = s.rows.map(r => [r.no!=null?r.no:'', ...s.fields.map(f=>csvCell(r.values[f.id], f))].join(','));
      const csv = '\ufeff' + [header, ...lines].join('\r\n');
      return { blob: new Blob([csv], {type:'text/csv;charset=utf-8'}), fname: nameOf(s)+'.csv' };
    });
    shareMany(items, base);
    return;
  }

  if(fmt==='json'){
    if(multi){
      // 多工作表：走**备份格式**（tables[] + bookNames），对方导入后仍然是一本多工作表 ✓
      // 单表格式 {name,fields,rows} 只能装一张，导进来会变成互不相干的独立表 ✗
      const payload = Object.assign({ v:1 }, exportPayloadByTables(sheets));
      shareOrDownload(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'}), base+'.json', base);
      return;
    }
    // 单工作表：保持原来的单表格式（老版本也能导入）
    const p0 = tableExportPayload(t);
    const data = { name: t.name, fields: t.fields, rows: t.rows, view: t.view||{}, xgroups: p0.xgroups };
    shareOrDownload(new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8'}), base+'.json', base);
    return;
  }

  if(fmt==='pdf'){
    // 生成真正的 PDF 文件（canvas 绘制，与表格版式一致），可直接下载/分享到微信
    Promise.all(sheets.map(s=>genTablePdfBlob(s, 'landscape').catch(()=>null)))
      .then(blobs=>{
        const items = [];
        blobs.forEach((b, i)=>{ if(b) items.push({ blob:b, fname: nameOf(sheets[i])+'.pdf' }); });
        if(!items.length){ toast('生成 PDF 失败'); return; }
        if(items.length < sheets.length) toast('有 ' + (sheets.length - items.length) + ' 个工作表生成失败');
        shareMany(items, base);
      })
      .catch(()=>{ toast('生成 PDF 失败'); });
    return;
  }
}
function shareOrDownload(blob, fname, title){
  // 优先调起系统分享（微信/QQ/邮件/存储到文件…）；不支持时自动退回下载。
  // 提示语由 exportFile 统一给：分享成功才说成功，取消就说取消，绝不谎报 ✗
  closeModal();
  exportFile(blob, fname, {title: title, okMsg: '已分享 ' + fname});
}

function rawVal(r, f){ if(f.type==='formula'){ const n = formulaValue(r, f); return n == null ? '' : n; } const v = r.values[f.id]; if(f.type==='tags'||f.type==='select') return Array.isArray(v)?v.join(' '):''; return v; }
function displayVal(r, f){
  if(f.type === 'formula'){
    const n = formulaValue(r, f);
    return n == null ? '<span class="cell-empty">—</span>' : esc(fmtFormula(n, f));
  }
  const v = r.values[f.id];
  const empty = v==null || v==='' || v==='undefined' || v==='null' || (Array.isArray(v) && !v.length);
  if(empty) return '<span class="cell-empty">—</span>';
  if(f.type==='bool') return v==='true' ? '<span class="badge ok">是</span>' : '<span class="badge no">否</span>';
  if(f.type==='tags'||f.type==='select') return v.map(esc).join('、');
  if(f.type==='image') return String(v).startsWith('data:') ? `<img class="cell-img" src="${escAttr(String(v))}">` : esc(String(v));
  if(f.type==='signature') return String(v).startsWith('data:') ? `<img class="cell-sig" src="${escAttr(String(v))}">` : esc(String(v));
  if(f.type==='color') return `<span class="cell-color" style="background:${escAttr(String(v))}"></span>`;
  if(f.type==='icon') return ICON_CHOICES.includes(v) ? svg(v) : esc(String(v));
  if(f.type==='url'&&/^https?:\/\//.test(v)) return `<a class="cell-link" href="${escAttr(v)}" target="_blank" rel="noopener">${esc(String(v))}</a>`;
  if(f.type==='email'&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<a class="cell-link" href="mailto:${escAttr(v)}">${esc(String(v))}</a>`;
  if(f.type==='textarea'||f.type==='rich') return `<span class="cell-pre">${esc(String(v))}</span>`;
  if(f.type==='datetime') return esc(String(v).replace('T',' '));
  if(f.type==='money'){ const m = fmtMoney(v, f); return m ? m : esc(String(v)); }
  return esc(String(v));
}
function filtered(t, u){
  const q = (u.q||'').trim().toLowerCase();
  let rows = t.rows;
  if(q){
    const hits = rows.filter(r => t.fields.some(f => String(rawVal(r,f)||'').toLowerCase().includes(q)));
    rows = hits.slice();
    const extra = new Map();
    hits.forEach(r=>{
      t.fields.forEach(f=>{
        if(!String(rawVal(r,f)||'').toLowerCase().includes(q)) return;
        const gid = (r.links && (r.links[f.id] || r.links.__any__)) || '';
        if(!gid) return;
        t.rows.forEach(x=>{
          if(x===r || hits.includes(x)) return;
          if(x.links && (x.links[f.id]===gid || (x.links[f.id]==null && x.links.__any__===gid))) extra.set(x.id, x);
        });
      });
    });
    rows = hits.concat([...extra.values()]);
  }
  const col = Object.entries(u.col||{}).filter(([,v])=> v!=='' && v!=null);
  if(col.length) rows = rows.filter(r => col.every(([fid,v])=>{
    const f = t.fields.find(x=>x.id===fid); if(!f) return true;
    if(f.type==='select'){ const arr = r.values[fid]; return Array.isArray(arr) && arr.includes(String(v)); }
    return String(rawVal(r,f)||'').toLowerCase().includes(String(v).toLowerCase());
  }));
  return rows;
}
function sortRows(rows, sort, t){
  if(!sort) return rows.slice();
  const f = t.fields.find(x=>x.id===sort.fieldId);
  const dir = sort.dir==='desc' ? -1 : 1;
  return rows.slice().sort((a,b)=>{
    if(sort.fieldId==='__no__'){ const na=Number(a.no)||0, nb=Number(b.no)||0; return (na-nb)*dir; }
    let va = a.values[sort.fieldId], vb = b.values[sort.fieldId];
    if(f && (f.type==='number'||f.type==='money')){ va = Number(va)||0; vb = Number(vb)||0; return (va-vb)*dir; }
    if(f && f.type==='bool'){ va = va==='true'?1:0; vb = vb==='true'?1:0; return (va-vb)*dir; }
    if(f && f.type==='formula'){
      const na = formulaValue(a, f), nb = formulaValue(b, f);
      return ((na==null?0:na) - (nb==null?0:nb))*dir;
    }
    if(f && f.type==='date'){ va = va||''; vb = vb||''; return va<vb?-dir : va>vb?dir : 0; }
    va = String(va==null?'':va); vb = String(vb==null?'':vb);
    return va.localeCompare(vb, 'zh')*dir;
  });
}

function moveSheetDrag(e){

  if(sheetDragEl) sheetDragEl.classList.remove('dragging');
  const id = sheetDragId, idx = sheetDropIdx, detach = sheetDetach;
  sheetDragId = null; sheetDragEl = null; sheetDropIdx = -1; sheetDetach = false;
  if(!id) return;
  const t = db.tables.find(x=>x.id===id); if(!t) return;
  if(detach){ detachSheet(id); return; }
  if(idx < 0) return;
  const sheets = bookSheets(t);
  const others = sheets.filter(s=>s.id!==id);
  const at = Math.min(idx, others.length);
  // 已经在这个位置就不用动
  if(others[at-1] === sheets[at-1] && others[at] === sheets[at] && sheets[at] === t) return;
  const reordered = others.slice(); reordered.splice(at, 0, t);
  const base = Math.min(...sheets.map(x=>x.order==null?0:x.order));
  reordered.forEach((x,i)=>{ x.order = base + i; });

function moveSheetByOrder(id, dir){
  const t = db.tables.find(x=>x.id===id); if(!t) return;
  const sheets = bookSheets(t);
  const i = sheets.findIndex(s=>s.id===id);
  const j = i + (dir<0 ? -1 : 1);
  if(i < 0 || j < 0 || j >= sheets.length){ return; }
  const base = Math.min(...sheets.map(x=>x.order==null?0:x.order));
  sheets.forEach((x,k)=>{ x.order = base + k; });
  const tmp = sheets[i].order;
  sheets[i].order = sheets[j].order;
  sheets[j].order = tmp;

function bindSheetTabLongPress(){

    tab.addEventListener('pointerdown', e=>{

function doImportRecords(tableId){
  const srcEl = $('ir-src'); if(!srcEl){ toast('请选择来源数据表'); return; }
  const t = db.tables.find(x=>x.id===tableId); const s = db.tables.find(x=>x.id===srcEl.value);
  if(!t || !s || !s.rows.length){ toast('来源表没有记录'); return; }
  const map = {};
  s.fields.forEach(sf=>{ const tf = t.fields.find(x=>x.name===sf.name); if(tf) map[sf.id]=tf.id; });
  let n = 0, skipped = 0; const reasons = [];
  s.rows.forEach(sr=>{
    const vals = {};
    t.fields.forEach(tf=>{ vals[tf.id] = (tf.type==='select'||tf.type==='tags') ? [] : ''; });
    Object.entries(map).forEach(([sfid,tfid])=>{ vals[tfid] = Array.isArray(sr.values[sfid]) ? [...sr.values[sfid]] : sr.values[sfid]; });
    // required check
    let bad = false;
    for(const tf of t.fields){
      if(!tf.required) continue;
      const v = vals[tf.id];
      const empty = Array.isArray(v) ? v.length===0 : (v==null || String(v).trim()==='');
      if(empty){ skipped++; reasons.push('「'+tf.name+'」必填缺失'); bad = true; break; }
    }
    if(bad) return;
    // unique check against existing rows (including already-imported ones)
    for(const tf of t.fields){
      if(!tf.unique) continue;
      const v = vals[tf.id];
      const vArr = Array.isArray(v) ? v : (v==null || v==='') ? [] : [String(v)];
      if(!vArr.length) continue;
      const clash = t.rows.some(row=>{
        const rv = row.values[tf.id];
        const rvArr = Array.isArray(rv) ? rv : (rv==null || rv==='') ? [] : [String(rv)];
        return vArr.some(cv=>rvArr.some(r=>String(r)===cv));
      });
      if(clash){ skipped++; reasons.push('「'+tf.name+'」值重复'); bad = true; break; }
    }
    if(bad) return;
    t.rows.push({ id: uid(), no: t.rows.length+1, values: vals });
    n++;
  });
  renumberTable(t);
  t.updatedAt = Date.now(); save(); renderTable(t); closeModal();
  toast(skipped ? `已从「${s.name}」导入 ${n} 条，跳过 ${skipped} 条（${[...new Set(reasons)].slice(0,3).join('、')}${new Set(reasons).size>3?' 等':''}）` : `已从「${s.name}」导入 ${n} 条记录并合并`);
}
/* 让一个小浮层能用手/鼠标拖着走（不做尺寸记忆，纯拖动）。
   关键点和 makeFloat 一样：**pointerdown 那一帧就把 touch-action 设成 none** ——
   等"移动超过 4px"再设已经晚了，浏览器早把这次触摸判成"滚动内容区"，
   之后的 pointermove 会被节流甚至不再派发，表现就是"拖不动 / 一顿一顿" ✗ */
function makeDraggable(el, opts){
  opts = opts || {};
  const exclude = opts.exclude || 'button,input,select,textarea,a';
  const handle = opts.handle ? el.querySelector(opts.handle) : null;
  if(el._dragBound) return; el._dragBound = true;
  el.addEventListener('pointerdown', e=>{
    if(e.button !== 0 && e.button !== undefined) return;
    // 给了 handle（如子菜单顶部的拖拽条）就**只能从 handle 起拖** ——
    // 否则面板本身可拖，用户想点菜单项时手指稍一滑动就被判成拖动 ✗
    if(handle){ if(!handle.contains(e.target)) return; }
    else if(e.target.closest(exclude)) return;
    const sx = e.clientX, sy = e.clientY;
    const vv0 = window.visualViewport;
    const vOffL = (vv0 && vv0.offsetLeft) || 0, vOffT = (vv0 && vv0.offsetTop) || 0;
    const r = el.getBoundingClientRect();
    const sL = parseFloat(el.style.left), sT = parseFloat(el.style.top);
    const ox = isFinite(sL) ? sL : r.left + vOffL;
    const oy = isFinite(sT) ? sT : r.top + vOffT;
    const prevTA = el.style.touchAction;
    el.style.touchAction = 'none';
    let moved = false, done = false;
    const move = ev=>{
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      if(!moved) return;
      const vv = window.visualViewport;
      const vL = (vv && vv.offsetLeft) || 0, vT = (vv && vv.offsetTop) || 0;
      const vW = (vv && vv.width) || window.innerWidth;
      const vH = (vv && vv.height) || window.innerHeight;
      const keep = 40;   // 只保证至少 40px 留在可视区内，不整块夹取
      const minL = vL + 4, maxL = Math.max(minL, vL + vW - keep);
      const minT = vT + 4, maxT = Math.max(minT, vT + vH - keep);
      el.style.left = Math.max(minL, Math.min(maxL, ox + dx))+'px';
      el.style.top  = Math.max(minT, Math.min(maxT, oy + dy))+'px';
    };
    const up = ()=>{
      if(done) return; done = true;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      el.style.touchAction = prevTA;      // 恢复原值，别一律写 '' ✗
      if(moved) el._dragMovedAt = Date.now();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  // 拖完 250ms 内的 click 不要当成"点了菜单项"，否则一松手就误触 ✗
  el.addEventListener('click', e=>{
    if(el._dragMovedAt && Date.now() - el._dragMovedAt < 250){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}
/* 取元素在视口里的「布局盒子」——**不受 transform 影响**。
   为什么不直接用 getBoundingClientRect()：菜单/子菜单出现时都在播 menuPop 动画，
   keyframes 里有 transform:scale(.97) translateY(6px)，动画期间 rect 拿到的是**缩放后**的尺寸
   （实测 330px 的菜单被量成 320px），拿它算位置就会偏 ✗。
   offsetWidth/offsetHeight 是布局尺寸，永远不受 transform 影响，配合 offsetParent 的 rect 就是准的。 */
function offsetBox(el){
  const w = el.offsetWidth, h = el.offsetHeight;
  const op = el.offsetParent;
  if(!op){ const r = el.getBoundingClientRect(); return { left:r.left, top:r.top, right:r.left+w, bottom:r.top+h, width:w, height:h }; }
  const or = op.getBoundingClientRect();
  const left = or.left + el.offsetLeft, top = or.top + el.offsetTop;
  return { left, top, right:left+w, bottom:top+h, width:w, height:h };
}

/* 把子菜单摆到主菜单**旁边**：
   ① 主菜单左侧（主菜单靠右时最自然）→ ② 右侧 → ③ 上方/下方（窄屏左右都塞不下）
   量位置一律用 offsetBox()（布局盒子），**不能用 getBoundingClientRect**——
   主菜单出现时在播 menuPop 动画，rect 拿到的是 transform 缩放后的尺寸，算出来会偏 ✗ */
function positionSubmenu(sub, btn){
  const sw = sub.offsetWidth || 170, sh = sub.offsetHeight || 170;
  const menu = btn.closest('.bar-menu') || btn.closest('.ov-menu');
  const mr = menu ? offsetBox(menu) : offsetBox(btn);
  const tr = offsetBox(btn);
  const vw = window.innerWidth, vh = window.innerHeight, PAD = 6, GAP = 8;
  let left, top, side;
  if(mr.left - GAP - sw >= PAD){                 // ① 主菜单左侧
    left = mr.left - GAP - sw; top = tr.top; side = 'left';
  }else if(mr.right + GAP + sw <= vw - PAD){     // ② 右侧
    left = mr.right + GAP; top = tr.top; side = 'right';
  }else{                                         // ③ 上方 / 下方
    side = 'stack';
    left = Math.min(Math.max(PAD, mr.left), Math.max(PAD, vw - sw - PAD));
    if(mr.top - GAP - sh >= PAD) top = mr.top - GAP - sh;
    else if(mr.bottom + GAP + sh <= vh - PAD) top = mr.bottom + GAP;
    else top = vh - sh - PAD;
  }
  left = Math.min(Math.max(PAD, left), Math.max(PAD, vw - sw - PAD));
  top  = Math.min(Math.max(PAD, top),  Math.max(PAD, vh - sh - PAD));
  // 左右摆放时，若底边超出主菜单太多（子菜单比主菜单高），往上提一点，
  // 让子菜单底边**不越过主菜单底边** —— 否则会垂到底部操作栏上，看起来"错位" ✗
  if(side === 'left' || side === 'right'){
    if(top + sh > mr.bottom) top = Math.max(PAD, Math.min(top, mr.bottom - sh));
    // 仍然超出（子菜单太高）→ 以触发器为中心尽量居中在菜单旁
    if(top + sh > vh - PAD) top = Math.max(PAD, vh - PAD - sh);
  }
  sub.dataset.side = side;
  sub.style.left = Math.round(left) + 'px';
  sub.style.top  = Math.round(top) + 'px';
}
function closeOtherSubmenus(keep){

/* 把「条件格式 → 手动行样式 → 列样式 → 单元格样式」合成为一段 CSS 文本。
   优先级与 renderGrid 完全一致（后面的覆盖前面的），供预览 / 打印导出复用 —— 
   这两处以前完全没读格式，所以"格式设置里设的颜色在预览里看不到"。 */
function mergedCellStyle(t, r, f){
  const cond = condStyleFor(t, r);
  const rs = (t.view && t.view.rowStyle && t.view.rowStyle[r.id]) || {};
  const cs = (t.view && t.view.colStyle && t.view.colStyle[f.id]) || {};
  const cls = (t.view && t.view.cellStyle && t.view.cellStyle[r.id+'-'+f.id]) || {};
  return Object.assign({}, cond, rs, cs, cls);
}
// '#rrggbb' / '#rgb' → [0..1, 0..1, 0..1]；认不出来（比如 rgba(...)）返回 null
function hexToRgb01(hex){
  const h = String(hex || '').trim().replace(/^#/, '');
  const two = v => parseInt(v, 16) / 255;
  if(h.length === 3 && /^[0-9a-f]{3}$/i.test(h)) return [two(h[0]+h[0]), two(h[1]+h[1]), two(h[2]+h[2])];
  if(h.length === 6 && /^[0-9a-f]{6}$/i.test(h)) return [two(h.slice(0,2)), two(h.slice(2,4)), two(h.slice(4,6))];
  return null;
}
// PDF/画布用：只保留能画出来的（纯色）属性
function pdfCellStyle(t, r, f){
  const st = mergedCellStyle(t, r, f);
  return { bg: hexToRgb01(st.bgColor) ? st.bgColor : '',
           fg: hexToRgb01(st.fontColor) ? st.fontColor : '',
           bold: st.bold === true };
}
function cellStyleCSS(t, r, f){
  const st = mergedCellStyle(t, r, f);
  let css = '';
  if(st.bgColor) css += 'background:' + st.bgColor + ';';
  if(st.fontColor) css += 'color:' + st.fontColor + ';';
  if(st.bold) css += 'font-weight:700;';
  if(st.textAlign) css += 'text-align:' + st.textAlign + ';';
  if(st.fontSize) css += 'font-size:' + st.fontSize + ';';
  if(st.fontFamily) css += 'font-family:' + st.fontFamily + ';';
  return css;
}

  //    不缩就得横向滚动，而安卓的滚动条是**浮层**（2~3px，样式改不动、手指抓不住）
  //    （真机 2026-10-20："预览的滚动条很难触摸到"）。
  //    用 `zoom` 而不是 `transform`：zoom 会把**布局尺寸一起缩**，缩完就没有横向滚动了 ✓
  requestAnimationFrame(()=>{

        const s = Math.max(0.3, avail / cw);

  let initialScale = 1;
  body.addEventListener('touchstart', e=>{

      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;

let rafDrag = null, dragX = 0, dragY = 0;
function applyDrag(){
  const grid = $('grid');
  if(vlDrag){
    const t = db.tables.find(x=>x.id===vlDrag.tableId); if(!t || !grid) return;
    const sc = vlDrag.sc; if(!sc) return;
    const tbl = sc.querySelector('table'); if(!tbl) return;
    let w = Math.max(44, Math.min(Math.round(vlDrag.colW0 + (dragX - vlDrag.startX)), 900));
    const cols = tbl.querySelectorAll('col');
    const prevW = parseInt(cols[vlDrag.ci+1].style.width)||0;
    cols[vlDrag.ci+1].style.width = w+'px';
    const delta = w - prevW;
    const lastIdx = cols.length-1;
    if(vlDrag.ci+1 < lastIdx){
      let sumO = 0;
      for(let i=1;i<lastIdx;i++){ sumO += parseInt(cols[i].style.width)||0; }
      const tw = Math.max(vlDrag.scRect.width, sumO);
      cols[lastIdx].style.width = Math.max(44, tw - sumO) + 'px';
    }
    let sumAll = 0;
    for(let i=0;i<cols.length;i++){ sumAll += parseInt(cols[i].style.width)||48; }
    tbl.style.width = sumAll + 'px';
    const vl = sc.querySelector('.vline-layer');
    if(vl && vlDrag.linePos.length && delta){
      for(let i=vlDrag.ci+1;i<vlDrag.linePos.length;i++){
        vlDrag.linePos[i] += delta;
        const line = vl.children[i-1];

      }

function textW(s){
  if(s==null) return 0;
  let w = 0;
  for(const ch of String(s)){ w += ch.codePointAt(0) > 255 ? 14 : 8; }
  return w;
}
function colWidths(t, view, total){
  // 序号列宽自适应：按表头 # 与最长编号内容估算（数字/ASCII 每字符 8px，汉字 14px）
  let _nw = textW('#');
  t.rows.forEach(_r=>{ _nw = Math.max(_nw, textW(String(_r.no!=null?_r.no:''))); });
  const ws = { __no__: Math.max(30, Math.min(_nw + 26, 110)) };
  const fids = t.fields.map(f=>f.id);
  let sum = 0;
  t.fields.forEach(f=>{
    let w = textW(f.name);
    t.rows.forEach(r=>{
      let sv = rawVal(r,f);
      if(f.type==='tags'||f.type==='select') sv = String(sv).replace(/ /g,'、');
      w = Math.max(w, textW(sv));
    });
    w = Math.min(620, w + 24 + 12);
    ws[f.id] = (view.colW && view.colW[f.id]) ? view.colW[f.id] : w;
    sum += ws[f.id];
  });
  if(fids.length){
    const tw = Math.max(total||800, sum);
    ws[fids[fids.length-1]] = Math.max(44, ws[fids[fids.length-1]] + tw - sum);
  }
  return ws;
}

        return;

        let toFid = '';
        if(p){
          const el = document.elementFromPoint(p.clientX, p.clientY);
          const target = el && el.closest('#grid thead th');
          toFid = target ? (target.dataset.fid || '__no__') : '';
        }
        const from = fid;
        cleanup();
        if(toFid && toFid !== from && from !== '__no__' && toFid !== '__no__') moveFieldTo(tableId, from, toFid);

  const rows = grid.querySelectorAll('tbody tr[data-rid]');
  rows.forEach(tr=>{
    if(tr._lpRowBound) return;
    tr._lpRowBound = true;
    let tt = null, sy = 0, sx = 0;

  const ncs = grid.querySelectorAll('td.no-cell');
  ncs.forEach(td=>{
    if(td._lpBound) return;

/* 刘海屏/圆角屏的安全区（横屏时刘海在左或右、底部有 home indicator）。
   取值和 CSS 用同一份 CSS 变量，保证 JS 夹取浮层位置时和布局一致。
   注意要缓存 —— 每次开菜单都读一遍 getComputedStyle 太浪费；
   屏幕旋转时清缓存（见下面的 orientationchange）。 */
let _safeInsetsCache = null;
function safeInsets(){
  if(_safeInsetsCache) return _safeInsetsCache;
  let ins = { top:0, right:0, bottom:0, left:0 };
  try{
    const cs = getComputedStyle(document.documentElement);
    const v = n => { const x = parseFloat(cs.getPropertyValue(n)); return isFinite(x) ? x : 0; };
    ins = { top:v('--sai-t'), right:v('--sai-r'), bottom:v('--sai-b'), left:v('--sai-l') };
  }catch(e){}
  _safeInsetsCache = ins;
  return ins;
}
window.addEventListener('orientationchange', ()=>{ _safeInsetsCache = null; });
window.addEventListener('resize', ()=>{ _safeInsetsCache = null; });
/* 把浮层菜单放到锚点下方，并**夹进可视区**（同时让开刘海/圆角/小白条）。
   原来只写 `left = max(8, r.left - 40)`，靠右的列/靠下的按钮会让菜单飞出屏幕（横屏更明显）✗。
   下面放不下就翻到锚点上方；四边都收口。调用前菜单必须已在 DOM 里。 */
function placeMenuNear(menu, anchorEl, dx){
  const r = anchorEl.getBoundingClientRect();
  menu.classList.add('show');            // 先显形才能量到真实尺寸
  const mw = menu.offsetWidth || 200, mh = menu.offsetHeight || 200;
  const ins = safeInsets();
  const vw = window.innerWidth, vh = window.innerHeight;
  const padL = 8 + ins.left, padR = 8 + ins.right, padB = 8 + ins.bottom;
  let top = r.bottom + 4;
  if(top + mh > vh - padB) top = r.top - mh - 4;          // 下方放不下 → 翻到上方
  top = Math.max(8 + ins.top, Math.min(top, Math.max(8 + ins.top, vh - mh - padB)));
  let left = Math.max(padL, r.left + (dx == null ? 0 : dx));
  left = Math.min(left, Math.max(padL, vw - mw - padR));
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
}

/* 长按/右键表头 → 直接删掉这一列（不必再进「管理表结构」逐行删）。
   数据、视图设置、排序/筛选记忆、跨表关联组里跟这一列有关的东西都要一起清掉，
   否则会留下"看不见的孤儿"（比如条件格式规则指向已删字段、关联组挂空）。 */
function deleteColDirect(tableId, fid){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const f = t.fields.find(x=>x.id===fid);
  if(!f){ toast('这一列不存在'); return; }
  if(t.fields.length <= 1){ toast('至少要保留一列'); return; }
  confirmDialog('确定删除列「<b>'+esc(f.name)+'</b>」吗？<br>该列下的数据会一并删除。', ()=>{
    t.fields = t.fields.filter(x=>x.id!==fid);
    // 行数据 + 行上的关联组标记
    t.rows.forEach(r=>{
      if(r.values) delete r.values[fid];
      if(r.links) delete r.links[fid];
    });
    // 视图里挂在这一列上的设置
    const v = t.view || {};
    if(v.colW && typeof v.colW === 'object') delete v.colW[fid];
    if(v.colStyle && typeof v.colStyle === 'object') delete v.colStyle[fid];
    if(v.cellStyle && typeof v.cellStyle === 'object'){
      const suffix = '-' + fid;
      Object.keys(v.cellStyle).forEach(k=>{ if(k.length > suffix.length && k.slice(-suffix.length) === suffix) delete v.cellStyle[k]; });
    }
    if(Array.isArray(v.condRules)) v.condRules = v.condRules.filter(r=>String(r.fieldId) !== String(fid));
    // 排序 / 每列筛选的记忆
    const u = uiFor(tableId);
    if(u.col) delete u.col[fid];
    if(u.sort && u.sort.fieldId === fid) u.sort = null;
    saveTableQuery();
    // 跨表关联组：以这一列为"源字段"的组会变成孤儿，一并清掉
    if(Array.isArray(db.xgroups)) db.xgroups = db.xgroups.filter(g=>String(g.fieldId) !== String(fid));
    t.updatedAt = Date.now();
    save();
    renderTable(t);
    toast('已删除列「'+f.name+'」');
  }, '删除');
}

  if(!t._selectedRows || !t._selectedRows.size){ toast('请先选择记录'); return; }
  const n = t._selectedRows.size;
  // move deleted rows to trash (shallow is fine for undo snapshot)
  const deleted = t.rows.filter(r=>t._selectedRows.has(r.id));
  (db.trash = db.trash||[]).push({ id:uid(), tableId, tableName:t.name, rows:JSON.parse(JSON.stringify(deleted)), deletedAt:Date.now() });
  t.rows = t.rows.filter(r=>!t._selectedRows.has(r.id));
  t.rows.forEach((r,i)=>{ r.no = i+1; });

  (db.xgroups = db.xgroups||[]).forEach(g=>{ g.rows = g.rows.filter(m=>!(m.t===tableId && t._selectedRows.has(m.r))); });
  db.xgroups = db.xgroups.filter(g=>g.rows.length>1);
  // Exit batch mode and re-render
  t._batchMode = false;
  t._selectedRows = new Set();
  renderTable(t);
  t.updatedAt = Date.now(); save();
  toast(`已删除 ${n} 条记录`);
}

function undoTo(index){
  try{
    const raw = localStorage.getItem(LS_KEY+'-history');
    if(!raw){ toast('没有可撤销的操作'); return; }
    const history = JSON.parse(raw);
    if(!history || !history[index]){ toast('没有可撤销的操作'); return; }
    const item = history[index];
    let next = null;
    if(item.data && item.data.tables && Array.isArray(item.data.tables)){
      next = normalizeDb(item.data);
    }else if(item.data && item.data.t && item.data.table && Array.isArray(item.data.table.orderIds)){
      next = JSON.parse(JSON.stringify(db));
      const cur = next.tables.find(x=>x.id===item.data.t);
      if(!cur){ toast('撤销数据已损坏'); return; }
      const s = item.data.table;
      cur.fields = s.fields; cur.view = s.view; cur.name = s.name;
      const rowMap = new Map();
      cur.rows.forEach(r=>rowMap.set(r.id, r));
      s.removed.forEach(r=>rowMap.set(r.id, r));
      const chMap = new Map(s.changed.map(r=>[r.id, r]));
      const finalRows = [];
      for(const id of s.orderIds){
        const r = rowMap.get(id);
        if(r) finalRows.push(chMap.get(id) || r);
      }
      cur.rows = finalRows;
      if(s.trash !== undefined) next.trash = s.trash;
      if(s.xgroups !== undefined) next.xgroups = s.xgroups;
      if(s.folders !== undefined) next.folders = s.folders;
      next = normalizeDb(next);
    }else{
      toast('撤销数据已损坏'); return;
    }
    // cancel any in-flight debounced history write (it would use a stale baseline)
    if(_pendingHistory){ clearTimeout(_pendingHistory); _pendingHistory = null; }
    db = next;
    // sync the snapshot baseline so the next save diffs against the post-undo state
    lastSnapshot = JSON.parse(JSON.stringify(next));
    // save without triggering history
    localStorage.setItem(LS_KEY, JSON.stringify(db));
    // trim history: keep entries before this undo point
    const newHistory = history.slice(index + 1);
    localStorage.setItem(LS_KEY+'-history', JSON.stringify(newHistory.slice(0, 10)));
    closeModal();
    // check current table still exists
    const r = parseHash();
    if(r.view === 'table'){
      const exists = db.tables.find(x=>x.id === r.id);
      if(!exists){
        location.hash = '#/overview';
      }
    }
    try{ render(); }catch(e){ console.error('render after undo failed', e); }
    toast('已撤销: '+(item.label || '操作'));
  }catch(e){
    toast('撤销失败: '+e.message);
  }
}
function saveHistory(label, prevState){
  try{
    if(!prevState || !prevState.tables){
      try{ prevState = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    }
    if(!prevState || !prevState.tables){
      // No previous state - use current db as base (first save)
      try{ prevState = JSON.parse(JSON.stringify(db)); }catch(e){ return; }
    }
    if(!prevState || !prevState.tables) return;

    // Auto-detect label
    if(!label || label === '操作'){
      try{
        // First check table-level changes (create/delete/rename table)
        const curTIds = new Set(db.tables.map(x=>x.id));
        const prevTIds = new Set(prevState.tables.map(x=>x.id));
        const addedTables = db.tables.filter(x=>!prevTIds.has(x.id));
        const removedTables = prevState.tables.filter(x=>!curTIds.has(x.id));
        if(addedTables.length){ label = '新建数据表「'+addedTables[0].name+'」'; }
        else if(removedTables.length){ label = '删除数据表「'+removedTables[0].name+'」'; }
        else {
          // Check table name changes
          for(const ct of db.tables){
            const pt = prevState.tables.find(x=>x.id===ct.id);
            if(pt && ct.name !== pt.name){ label = '重命名数据表「'+pt.name+'」→「'+ct.name+'」'; break; }
            // Check field changes
            if(pt && ct.fields){
              const cfIds = new Set(ct.fields.map(f=>f.id));
              const pfIds = new Set(pt.fields.map(f=>f.id));
              const addedF = ct.fields.filter(f=>!pfIds.has(f.id));
              const removedF = pt.fields.filter(f=>!cfIds.has(f.id));
              if(addedF.length) label = '新增字段「'+addedF[0].name+'」（'+ct.name+'）';
              else if(removedF.length) label = '删除字段「'+removedF[0].name+'」（'+ct.name+'）';
              else {
                for(const cf of ct.fields){
                  const pf = pt.fields.find(f=>f.id===cf.id);
                  if(pf){
                    if(cf.name !== pf.name) label = '重命名字段「'+pf.name+'」→「'+cf.name+'」（'+ct.name+'）';
                    else if(cf.required !== pf.required) label = (cf.required?'设置':'取消')+'必填「'+cf.name+'」（'+ct.name+'）';
                    else if(cf.hidden !== pf.hidden) label = (cf.hidden?'隐藏':'显示')+'字段「'+cf.name+'」（'+ct.name+'）';
                    else if(cf.multi !== pf.multi) label = (cf.multi?'允许多选':'设为单选')+'「'+cf.name+'」（'+ct.name+'）';
                  }
                  if(label && label !== '操作') break;
                }
              }
            }
            if(label && label !== '操作') break;
          }
        }
        // Then row-level details
        const r = parseHash();
        const curT = r.view==='table' ? db.tables.find(x=>x.id===r.id) : null;
        const prevT = curT ? prevState.tables.find(x=>x.id===curT.id) : null;
        if(!label && curT && prevT){
          const curIds = new Set(curT.rows.map(x=>x.id));
          const prevIds = new Set(prevT.rows.map(x=>x.id));
          const added = curT.rows.filter(x=>!prevIds.has(x.id));
          const removed = prevT.rows.filter(x=>!curIds.has(x.id));
          const nm = (t,row) => { try{ const f=t.fields[0]; const v=row.values&&row.values[f.id]; return Array.isArray(v)?v.join(','):(v||''); }catch(e){ return ''; } };
          if(added.length && !removed.length) label = '新建「'+(nm(curT,added[0])||'未命名')+'」（'+curT.name+'）';
          else if(removed.length && !added.length) label = '删除「'+(nm(prevT,removed[0])||'未命名')+'」（'+curT.name+'）';
          else if(added.length) label = '编辑记录（'+curT.name+'）';
          else {
            let changed = false;
            for(const rr of curT.rows){
              const pr = prevT.rows.find(x=>x.id===rr.id);
              if(pr && JSON.stringify(rr.values||{}) !== JSON.stringify(pr.values||{})){
                label = '编辑「'+(nm(curT,rr)||'未命名')+'」（'+curT.name+'）';
                changed = true; break;
              }
            }
            if(!changed){
              // Check links
              let linkChanged = null;
              for(const rr of curT.rows){
                const pr = prevT.rows.find(x=>x.id===rr.id);
                if(pr && JSON.stringify(rr.links||{}) !== JSON.stringify(pr.links||{})){
                  linkChanged = nm(curT, rr) || '未命名';
                  break;
                }
              }
              if(linkChanged) label = '关联「'+linkChanged+'」（'+curT.name+'）';
              else {
                // Check view/style changes
                const cv = JSON.stringify(curT.view||{});
                const pv = JSON.stringify(prevT.view||{});
                if(cv !== pv){
                  // Try to identify which row/field style changed
                  let styleDetail = '';
                  try{
                    const csv = (curT.view&&curT.view.cellStyle)||{};
                    const psv = (prevT.view&&prevT.view.cellStyle)||{};
                    const crs = (curT.view&&curT.view.rowStyle)||{};
                    const prs = (prevT.view&&prevT.view.rowStyle)||{};
                    const ccs = (curT.view&&curT.view.colStyle)||{};
                    const pcs = (prevT.view&&prevT.view.colStyle)||{};
                    const cellKeys = Object.keys(csv).filter(k=>JSON.stringify(csv[k])!==JSON.stringify(psv[k]||{}));
                    const rowKeys = Object.keys(crs).filter(k=>JSON.stringify(crs[k])!==JSON.stringify(prs[k]||{}));
                    const colKeys = Object.keys(ccs).filter(k=>JSON.stringify(ccs[k])!==JSON.stringify(pcs[k]||{}));
                    if(cellKeys.length){
                      const parts = cellKeys[0].split('-');
                      const row = curT.rows.find(x=>x.id===parts[0]);
                      const field = curT.fields.find(x=>x.id===parts[1]);
                      styleDetail = '单元格「'+(row?nm(curT,row):'')+' / '+(field?field.name:parts[1])+'」';
                    } else if(rowKeys.length){
                      const row = curT.rows.find(x=>x.id===rowKeys[0]);
                      styleDetail = '行「'+(row?nm(curT,row):rowKeys[0])+'」';
                    } else if(colKeys.length){
                      const field = curT.fields.find(x=>x.id===colKeys[0]);
                      styleDetail = '列「'+(field?field.name:colKeys[0])+'」';
                    }
                  }catch(e){}
                  label = '格式设置'+(styleDetail?'：'+styleDetail:'')+'（'+curT.name+'）';
                } else label = '修改设置（'+curT.name+'）';
              }
            }
          }
        } else {
          const cc = db.tables.reduce((a,t)=>a+t.rows.length,0);
          const pc = prevState.tables.reduce((a,t)=>a+t.rows.length,0);
          label = cc<pc ? '删除记录' : (cc>pc ? '新建记录' : '修改设置');
        }
      }catch(e){ label = '操作'; }
    }

    // Save history (robust read - corrupted history should not block new entries)
    let history = [];
    try{
      const raw = localStorage.getItem(LS_KEY+'-history');
      if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) history = parsed; }
    }catch(e){ history = []; }
    // Compress snapshot: strip UI-only fields to save space on mobile
    function compactState(st){
      try{
        const c = JSON.parse(JSON.stringify(st));
        if(c.tables) c.tables.forEach(t=>{
          delete t._selectedRows;
          if(t.view){
            // Keep view but it's small
          }
        });
        return c;
      }catch(e){ return st; }
    }
    // Snapshot scope: whole DB only for table-level ops,
    // otherwise a compact row-level diff of the touched table
    let snap = null;
    const curTIds = new Set(db.tables.map(x=>x.id));
    const prevTIds = new Set(prevState.tables.map(x=>x.id));
    const tableLevel = db.tables.filter(x=>!prevTIds.has(x.id)).length>0 || prevState.tables.filter(x=>!curTIds.has(x.id)).length>0;
    if(tableLevel){
      snap = compactState(prevState);
    }else{
      let touchedPt = null, touchedCt = null;
      for(const ct of db.tables){
        const pt = prevState.tables.find(x=>x.id===ct.id);
        if(pt && (pt.updatedAt!==ct.updatedAt || pt.rows.length!==ct.rows.length || JSON.stringify(pt.view)!==JSON.stringify(ct.view) || JSON.stringify(pt.fields)!==JSON.stringify(ct.fields) || pt.name!==ct.name)){ touchedPt = pt; touchedCt = ct; break; }
      }
      if(touchedPt && touchedCt){
        const curMap = new Map(touchedCt.rows.map(r=>[r.id, r]));
        const addedIds = touchedCt.rows.filter(r=>!touchedPt.rows.some(x=>x.id===r.id)).map(r=>r.id);
        const removed = touchedPt.rows.filter(r=>!curMap.has(r.id));
        const changed = touchedPt.rows.filter(r=>curMap.has(r.id) && JSON.stringify(r)!==JSON.stringify(curMap.get(r.id)));
        snap = { t: touchedPt.id, table: {
          fields: touchedPt.fields, view: touchedPt.view, name: touchedPt.name,
          orderIds: touchedPt.rows.map(r=>r.id),
          addedIds, removed, changed
        } };
        // Global structures (trash/xgroups/folders) may have changed alongside the
        // row edit (e.g. deleting a linked record writes trash and edits xgroups).
        // Attach them ONLY when they actually differ, keeping small snapshots small.
        const gExtra = {};
        if(JSON.stringify(prevState.trash||[]) !== JSON.stringify(db.trash||[])) gExtra.trash = prevState.trash;
        if(JSON.stringify(prevState.xgroups||[]) !== JSON.stringify(db.xgroups||[])) gExtra.xgroups = prevState.xgroups;
        if(JSON.stringify(prevState.folders||[]) !== JSON.stringify(db.folders||[])) gExtra.folders = prevState.folders;
        if(Object.keys(gExtra).length) Object.assign(snap.table, gExtra);
      }else{
        snap = compactState(prevState);
      }
    }
    history.unshift({ label: label || '操作', time: Date.now(), data: snap });
    history = history.slice(0, 10);
    // 再按**字节预算**砍一刀：10 份快照在大表上能吃掉好几 MB，把 localStorage 顶到配额上限，
    // 表现为「侧边栏占用一直是 2.32M」+ 之后任何导入/编辑都报"存储空间已满" ✗。
    // 保留最近 1 份（撤销的安全网不能没有），其余按预算从旧到新丢。
    const budget = window._histBudget || 1024*1024;
    let histJson = '';
    try{
      for(let n = history.length; n >= 1; n--){
        const cand = JSON.stringify(history.slice(0, n));
        if(n === 1 || new Blob([cand]).size <= budget){ histJson = cand; break; }
      }
    }catch(e){ histJson = ''; }
    let saved = false;
    if(histJson){
      try{ localStorage.setItem(LS_KEY+'-history', histJson); saved = true; }catch(e){}
    }
    if(!saved){
      // Try with fewer entries
      for(let i = Math.min(3, history.length); i >= 1; i--){
        try{
          localStorage.setItem(LS_KEY+'-history', JSON.stringify(history.slice(0, i)));
          saved = true;
          break;
        }catch(e){}
      }
    }
    if(!saved){ try{ localStorage.removeItem(LS_KEY+'-history'); }catch(e){} }
  }catch(e){}
}
/* ===== iPhone「添加到主屏幕」独立窗口模式（standalone）=====
   ⚠️ 这个模式下，**键盘上第三方输入法的语音按钮**（讯飞/搜狗/百度）会去启动它自己的 App
   做识别。独立窗口的网页 App 没有 Safari 那套完整的 App 生命周期，对方 App 起不来就**黑屏**；
   切回来后输入会话已经断了，连地球键切换输入法都没反应。**这是 iOS 的限制，页面侧修不了** ✗。
   实测（2026-10-14，用户 iPhone）：同一个网址在 Safari 里一切正常；系统键盘的「听写」在
   独立窗口里也正常。所以这里只做两件事：① 操作指南里写清楚；② 给一个「用 Safari 打开」的出口。
   （如果以后改成 Safari 打开，isStandaloneApp() 返回 false，这个入口会自动消失 ✓） */
function isStandaloneApp(){
  try{
    if(window.navigator && window.navigator.standalone === true) return true;   // iOS 主屏幕图标
    // 非 iOS 不看 display-mode：桌面浏览器全屏、安卓 PWA 都不需要这条提示
    if(!/iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  }catch(e){}
  return false;
}

// 清掉文件里可能已经存在的上一代注入块（嵌入数据块 / 模板清库块），
// 否则「别人分享给你的文件」再分享时旧块会残留，导致数据串味。
//
// ⚠️ 这里绝对不能用 /<script>\s*window\.__EMBED_DB__[\s\S]*?<\/script>/g ：
// 源码里 const dataJs = '<script>window.__EMBED_DB__ = ' ... 本身就是这个形状，
// 而 [\s\S]*? 会跨行一路吃到文件末尾的 <\/script>，把程序后半段（约 18 万字符）整个删掉，
// 导出文件打开后脚本直接不执行（db is not defined）。
// 注入块恒为「单行」，所以把匹配限制在 [^\n] 内即可区分：
// 源码那两处后面跟的是 '<\/script>'（源码文本里带反斜杠），无法匹配真正的闭合标签。
const INJECT_BLOCK_RE = /<script>(?:window\.__EMBED_DB__\s*=|localStorage\.removeItem\("lighter-db-v1"\);)[^\n]*?;\s*<\/script>[ \t]*\r?\n?/g;
function stripInjected(html){
  return String(html == null ? '' : html).replace(INJECT_BLOCK_RE, '');
}
async function _buildHtml(withData){
  closeModal();
  await ensureSrcHtml();
  // Use the pristine snapshot captured at boot (no live dialogs/panels);
  // fall back to current DOM only if the snapshot is unavailable.
  // The snapshot is already clean, so NO regex DOM-cleanup here: those replaces
  // would corrupt inline JS (template strings contain <div id="modal-root"> etc).
  let html = window._SRC_HTML || ('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
  // 先清掉上一代注入块：否则「别人分享给你的文件」再分享时，
  // 旧数据块排在后面会覆盖新数据（下载模板也会因此自带别人的数据）。
  // 必须用 stripInjected（单行匹配），直接写跨行正则会误删自身源码，详见其注释。
  html = stripInjected(html);
  // 注入锚点 = 主程序脚本的开标签（第一个不带 src 的 <script>，即 indexOf 找到的那个）。
  // 不能用 /<script/i（会命中 CDN 的 <script src=...>），也不能用 lastIndexOf
  // （源码里的 /<script>/ 正则字面量会被误命中）。
  const anchor = html.indexOf('<script>');
  if(withData){
    // Embed current database so the shared file opens with THIS data.
    // Escape "<" inside the JSON so user content cannot break out of the script tag.
    const dataJs = '<script>window.__EMBED_DB__ = ' + JSON.stringify(db).replace(/</g, '\\u003c') + ';<\/script>';
    if(anchor >= 0) html = html.slice(0, anchor) + dataJs + html.slice(anchor);
  }else{
    // 空白模板：开一个独立脚本先清掉本机数据（含 embed 消费标记），让应用回落到 seed 示例数据
    const clearJs = '<script>localStorage.removeItem("lighter-db-v1");localStorage.removeItem("lighter-db-v1-history");localStorage.removeItem("lighter-db-v1-embed-consumed");<\/script>';
    if(anchor >= 0) html = html.slice(0, anchor) + clearJs + html.slice(anchor);
  }
  return html;
}

/* ===== 条件格式：按规则自动给整行上色（Excel 式） =====
   规则自上而下，**第一条命中即生效**；用户手动设的行样式优先级更高（手动覆盖规则）。 */
const COND_OPS = [
  ['lt','小于'], ['lte','小于等于'], ['gt','大于'], ['gte','大于等于'],
  ['eq','等于'], ['ne','不等于'], ['contains','包含'], ['empty','为空'], ['notempty','不为空']
];
function condCellStr(r, f){
  const v = r.values[f.id];
  if(v == null) return '';
  return String(Array.isArray(v) ? v.join(',') : v).trim();
}
function condStyleFor(t, r){
  const rules = (t.view && Array.isArray(t.view.condRules)) ? t.view.condRules : [];
  if(!rules.length) return null;
  for(const rule of rules){
    const f = t.fields.find(x=>x.id === rule.fieldId);
    if(!f) continue;
    const s2 = condCellStr(r, f);
    const n = s2 === '' ? null : Number(s2);
    const rn = Number(rule.value);
    let hit = false;
    switch(rule.op){
      case 'lt':  hit = n !== null && !isNaN(n) && !isNaN(rn) && n < rn; break;
      case 'lte': hit = n !== null && !isNaN(n) && !isNaN(rn) && n <= rn; break;
      case 'gt':  hit = n !== null && !isNaN(n) && !isNaN(rn) && n > rn; break;
      case 'gte': hit = n !== null && !isNaN(n) && !isNaN(rn) && n >= rn; break;
      case 'eq':  hit = s2 !== '' && s2 === String(rule.value); break;
      case 'ne':  hit = s2 !== '' && s2 !== String(rule.value); break;
      case 'contains': hit = s2 !== '' && s2.indexOf(String(rule.value)) > -1; break;
      case 'empty': hit = s2 === ''; break;
      case 'notempty': hit = s2 !== ''; break;
    }
    if(hit) return { bgColor: rule.bgColor || '', fontColor: rule.fontColor || '', bold: rule.bold === true };
  }
  return null;
}
function condRulesOf(t){ if(!t.view) t.view = {}; if(!Array.isArray(t.view.condRules)) t.view.condRules = []; return t.view.condRules; }
function openCondRules(tableId){
  const t = db.tables.find(x=>x.id===tableId); if(!t) return;
  const rules = condRulesOf(t);
  const opName = op => { const m = COND_OPS.find(x=>x[0]===op); return m ? m[1] : op; };
  const rowsHtml = rules.length ? rules.map((r,i)=>{
    const f = t.fields.find(x=>x.id===r.fieldId);
    const needVal = !(r.op==='empty' || r.op==='notempty');
    const sw = `<span class="cond-sw" style="background:${r.bgColor||'transparent'};${r.fontColor?`color:${r.fontColor};`:''}${r.bold?'font-weight:600;':''}">Aa</span>`;
    return `<div class="cond-row" data-rid="${r.id}">
      <span class="cond-idx">${i+1}</span>
      <span class="cond-txt">当 <b>${esc(f?f.name:'（字段已删）')}</b> ${esc(opName(r.op))}${needVal?` <b>${esc(r.value)}</b>`:''} → ${sw}</span>
      <button type="button" class="icon-btn" onclick="moveCondRule('${t.id}','${r.id}',-1)" title="上移">▲</button>
      <button type="button" class="icon-btn" onclick="moveCondRule('${t.id}','${r.id}',1)" title="下移">▼</button>
      <button type="button" class="icon-btn danger" onclick="delCondRule('${t.id}','${r.id}')" title="删除">${svg('i-trash')}</button>
    </div>`;
  }).join('') : `<p class="muted" style="font-size:13px">还没有规则。加一条试试，比如「库存 小于 10」→ 整行标红。</p>`;
  const fOpts = t.fields.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');
  openModal(`<div class="modal" data-float-key="condRules">
    <div class="modal-head"><h2>条件格式</h2><button type="button" class="icon-btn" onclick="closeModal()" title="关闭">${svg('i-x')}</button></div>
    <div class="modal-body">
      <p class="muted" style="font-size:12px;margin:0 0 4px">规则自上而下匹配，<b>第一条命中的生效</b>；手动设过的行颜色优先于规则。</p>
      <div class="cond-list">${rowsHtml}</div>
      <div class="cond-add">
        <div class="cond-add-head">新增规则</div>
        <div class="cond-add-grid">
          <select id="cond-field" class="in">${fOpts}</select>
          <select id="cond-op" class="in" onchange="syncCondVal()">${COND_OPS.map(([k,label])=>`<option value="${k}">${label}</option>`).join('')}</select>
          <input id="cond-val" class="in" placeholder="比较值">
          <input type="color" id="cond-bg" class="cond-color" value="#ffe0e0" title="背景色">
          <input type="color" id="cond-fg" class="cond-color" value="#a32d2d" title="文字色">
          <label class="cond-bold"><input type="checkbox" id="cond-bold"> 加粗</label>
          <button type="button" class="btn primary sm" onclick="addCondRule('${t.id}')">${svg('i-plus')} 添加</button>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">关闭</button></div>
  </div>`);
